name: Central chat mode routing checks
on:
  push:
    branches: [feat/chat-mode-routing-20261018, feat/private-chat-use-spare-models-20261018, fix/info-concise-prompt-20261018]
    paths:
      - 'backend/services/ai_test.py'
      - 'tests/test_chat_mode_routing.py'
      - 'frontend/shell/center-chat/ai-chat.js'
      - 'frontend/index.html'
      - '.github/workflows/chat-mode-routing-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependency
        run: python -m pip install flask
      - name: Compile and run server routing regression tests without network
        run: |
          python -m py_compile backend/services/ai_test.py tests/test_chat_mode_routing.py
          python -m unittest -v tests.test_chat_mode_routing
      - name: Validate unchanged frontend shell structure
        run: |
          node --check frontend/shell/center-chat/ai-chat.js
          node --check frontend/shell/center-chat/search-controls.js
          node --check frontend/js/app.js
