name: gaemigtp-main Pages production
on:
  push:
    branches: [main]
    paths:
      - frontend/index.html
      - .github/workflows/gaemigtp-main-pages-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaemigtp-main-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check home questions
        run: |
          test -s frontend/index.html
          grep -Fq '오늘 미국 상승 테마 뭐야?' frontend/index.html
          grep -Fq '전일 대비 거래량 폭증한 미국 종목 알려줘' frontend/index.html
          grep -Fq '52주 신고가 신저가 종목 알려줘' frontend/index.html
          test "$(grep -c '<button type="button">.*</button>' frontend/index.html)" -ge 3
      - name: Deploy to existing Pages project (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: 6cf7450897a598809db421965a07304b
          command: pages deploy frontend --project-name gaemigtp-main --branch main
      - name: Verify published home questions
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --max-time 30 'https://gaemigtp-main.pages.dev/' -o "$RUNNER_TEMP/pages-index.html"
          grep -Fq '오늘 미국 상승 테마 뭐야?' "$RUNNER_TEMP/pages-index.html"
          grep -Fq '전일 대비 거래량 폭증한 미국 종목 알려줘' "$RUNNER_TEMP/pages-index.html"
          grep -Fq '52주 신고가 신저가 종목 알려줘' "$RUNNER_TEMP/pages-index.html"
          if grep -Fq 'SK하이닉스 20일 큰손 평균단가 알려줘' "$RUNNER_TEMP/pages-index.html"; then exit 1; fi
