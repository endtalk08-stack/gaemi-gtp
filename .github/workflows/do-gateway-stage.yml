name: Stage reusable DigitalOcean gateway for one-time install
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths:
      - '.github/workflows/do-gateway-stage.yml'
      - 'ops/do-gateway/gaemi-do-gateway'
      - 'ops/do-gateway/install-once.sh'
      - 'ops/do-gateway/kiwoom-credentials-once.sh'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact gateway and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ops/do-gateway/gaemi-do-gateway)" = a7bbea413c5b48e70d583148d3f70566f936f35b
          bash -n ops/do-gateway/gaemi-do-gateway
          test "$(git hash-object ops/do-gateway/install-once.sh)" = 26c7473f9fa74922706deb3ec78ca6ee785d85ad
          bash -n ops/do-gateway/install-once.sh
          test "$(git hash-object ops/do-gateway/kiwoom-credentials-once.sh)" = 7cd2b286fd147fd13887ec3f67abc458eaf06e62
          bash -n ops/do-gateway/kiwoom-credentials-once.sh
          echo GAEMI_GATEWAY_CODE_VERIFIED
      - name: Stage gateway for root install without invoking it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12)
          ssh "${SSH_OPTS[@]}" gaemi-deploy@"$DO_HOST" 'install -d -m 0700 "$HOME/.gaemi-gateway/bootstrap"; test "$(systemctl is-active gaemigtp-news.service)" = active'
          scp "${SSH_OPTS[@]}" ops/do-gateway/gaemi-do-gateway gaemi-deploy@"$DO_HOST":.gaemi-gateway/bootstrap/gaemi-do-gateway
          scp "${SSH_OPTS[@]}" ops/do-gateway/install-once.sh gaemi-deploy@"$DO_HOST":.gaemi-gateway/bootstrap/install-once.sh
          scp "${SSH_OPTS[@]}" ops/do-gateway/kiwoom-credentials-once.sh gaemi-deploy@"$DO_HOST":.gaemi-gateway/bootstrap/kiwoom-credentials-once.sh
          ssh "${SSH_OPTS[@]}" gaemi-deploy@"$DO_HOST" 'set -e; chmod 0600 "$HOME/.gaemi-gateway/bootstrap/kiwoom-credentials-once.sh"; test "$(git hash-object "$HOME/.gaemi-gateway/bootstrap/kiwoom-credentials-once.sh")" = 7cd2b286fd147fd13887ec3f67abc458eaf06e62; bash -n "$HOME/.gaemi-gateway/bootstrap/kiwoom-credentials-once.sh"; echo GAEMI_KIWOOM_INPUT_SCRIPT_STAGED; chmod 0600 "$HOME/.gaemi-gateway/bootstrap/gaemi-do-gateway" "$HOME/.gaemi-gateway/bootstrap/install-once.sh"; test "$(git hash-object "$HOME/.gaemi-gateway/bootstrap/install-once.sh")" = 26c7473f9fa74922706deb3ec78ca6ee785d85ad; bash -n "$HOME/.gaemi-gateway/bootstrap/install-once.sh"; test "$(git hash-object "$HOME/.gaemi-gateway/bootstrap/gaemi-do-gateway")" = a7bbea413c5b48e70d583148d3f70566f936f35b; bash -n "$HOME/.gaemi-gateway/bootstrap/gaemi-do-gateway"; echo GAEMI_GATEWAY_STAGED_VERIFIED; test "$(systemctl is-active gaemigtp-news.service)" = active; echo ORIGINAL_NEWS_WORKER_ACTIVE'
