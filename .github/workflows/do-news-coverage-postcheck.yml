name: Read-only news coverage post-deploy log check
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/do-news-coverage-postcheck.yml]
permissions:
  contents: read
jobs:
  inspect:
    environment: digitalocean-news-worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Read service post-deploy status and sanitized news collector errors
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh -o ConnectTimeout=12 -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" "gaemi-deploy@$DO_HOST" 'bash -s' <<'REMOTE'
          set -u
          cd /opt/gaemigtp-news/app || exit 1
          echo SERVICE_STATUS="$(systemctl is-active gaemigtp-news.service || true)"
          systemctl show gaemigtp-news.service -p ActiveState -p SubState -p Result -p MainPID -p NRestarts -p ExecMainStatus -p ActiveEnterTimestamp --no-pager || true
          echo RANK_QUEUE_COUNT="$(grep -Fc 'state.setdefault("ranked_by_feed", {})' backend/news_worker.py || true)"
          echo SECTION_NEWS_LOGS
          # No environment values; print only service errors/stock coverage events.
          if sudo -n /usr/bin/journalctl -u gaemigtp-news.service --since '2026-10-18 00:03:00 UTC' --no-pager -o cat >/tmp/gaemigtp-coverage-check.$ 2>/dev/null; then
            grep -Ei 'news-worker|news-ai|provider:naver-news|Traceback|Error|Exception|ModuleNotFound|failed|exit-code|Main process' /tmp/gaemigtp-coverage-check.$ | tail -n 85 || true
            rm -f /tmp/gaemigtp-coverage-check.$
          else
            echo JOURNAL_NOT_ACCESSIBLE
          fi
          REMOTE
