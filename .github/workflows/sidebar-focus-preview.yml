name: Sidebar focus fix preview
on:
  push:
    branches: [fix/sidebar-focus-console-errors-20261124]
    paths:
      - 'frontend/shell/workspace-shell-state.js'
      - 'frontend/index.html'
      - '.github/workflows/sidebar-focus-preview.yml'
permissions:
  contents: read
concurrency:
  group: sidebar-focus-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell state JavaScript
        run: |
          set -e
          node --check frontend/shell/workspace-shell-state.js
          grep -Fq 'focusedPanel' frontend/shell/workspace-shell-state.js
          grep -Fq 'el.inert = !isOpen' frontend/shell/workspace-shell-state.js
          grep -Fq "el.setAttribute('aria-hidden', isOpen ? 'false' : 'true')" frontend/shell/workspace-shell-state.js
      - name: Deploy preview to existing Pages project
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: 6cf7450897a598809db421965a07304b
          command: pages deploy frontend --project-name gaemigtp-main --branch sidebar-focus-preview
      - name: Verify preview asset
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          case "$PREVIEW_URL" in https://*.gaemigtp-main.pages.dev) ;; *) exit 1 ;; esac
          curl -fLsS --max-time 25 "$PREVIEW_URL/index.html" -o "$RUNNER_TEMP/preview-index.html"
          grep -Fq 'workspace-shell-state.js?v=20261124-sidebar-focus-fix-v1' "$RUNNER_TEMP/preview-index.html"
          curl -fLsS --max-time 25 "$PREVIEW_URL/shell/workspace-shell-state.js?v=20261124-sidebar-focus-fix-v1" -o "$RUNNER_TEMP/workspace-shell-state.js"
          grep -Fq 'sidebarStates' "$RUNNER_TEMP/workspace-shell-state.js"
