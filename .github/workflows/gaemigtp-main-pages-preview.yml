name: gaemigtp-main Pages preview # candidate d3a80ee; corrected 11-row DOM test
on:
  push:
    branches: [ops/gaemigtp-main-pages-preview]
    paths:
      - .github/workflows/gaemigtp-main-pages-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaemigtp-main-pages-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref == 'refs/heads/ops/gaemigtp-main-pages-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin the heatmap source for this preview push only.
          ref: >-
            ${{ github.event_name == 'push'
              && github.event.before == '94d9d2adefd6f389f49753f4931f646cd668e662'
              && '55880e7fea992ee37c8645e1b3adf490827dbd1c'
              || github.sha }}
      - name: Check Pages inputs
        run: |
          test -s frontend/index.html
          test -s functions/market/us-daily-chart.js
          node --check frontend/shell/right-panel/right-panel-tabs.js
          node --check frontend/shell/left-market-sidebar/market-sidebar.js
          node --test tests/test_sidebar_issue_sync.cjs
          node --check frontend/shell/center-chat/widget-dock/widget-dock.js
          grep -Fq 'data-qqq-reason' frontend/shell/center-chat/widget-dock/widget-dock.js
          grep -Fq '#bfc3cb' frontend/shell/center-chat/widget-dock/widget-dock.css
          grep -Fq 'wss://quotes.gaemigtp.com/ws/us-live-quotes' frontend/shell/left-market-sidebar/market-sidebar.js
      - name: Deploy to existing Pages project preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: 6cf7450897a598809db421965a07304b
          command: pages deploy frontend --project-name gaemigtp-main --branch github-pages-preview
      - name: Verify preview and R2-backed chart
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          case "$PREVIEW_URL" in
            https://*.gaemigtp-main.pages.dev) ;;
            *) exit 1 ;;
          esac
          sidebar_js="$(grep -o 'shell/left-market-sidebar/market-sidebar[.]js?v=[^"]*' frontend/index.html)"
          sidebar_css="$(grep -o 'shell/left-market-sidebar/market-sidebar[.]css?v=[^"]*' frontend/index.html)"
          index="$RUNNER_TEMP/pages-index.html"
          for attempt in 1 2 3 4 5; do
            if curl -fLsS --compressed --max-time 20 -H 'Accept: text/html,application/xhtml+xml' \
                -H 'Cache-Control: no-cache' "$PREVIEW_URL/?v=$GITHUB_SHA" -o "$index" -w 'Preview HTML: HTTP %{http_code}, %{content_type}, %{size_download} bytes\n' &&
              cmp -s frontend/index.html "$index" &&
              grep -Fq "$sidebar_js" "$index" &&
              grep -Fq "$sidebar_css" "$index" &&
              grep -Eq "data-info-tab-action=['\"]?industry(['\"]|[[:space:]>])" "$index" &&
              grep -Eq "data-info-tab-action=['\"]?realtime(['\"]|[[:space:]>])" "$index"; then
              echo 'Verified preview HTML and sidebar references'
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Preview HTML title: $(grep -oE '<title>[^<]+' "$index" | head -1 || true)"
              echo "Preview HTML bytes: $(wc -c < "$index")"
              echo "Preview HTML beginning:"
              head -c 900 "$index"
              echo
              branch_preview="https://github-pages-preview.gaemigtp-main.pages.dev/?v=$GITHUB_SHA"
              curl -fLsS --compressed --max-time 20 -H 'Cache-Control: no-cache' "$branch_preview" -o "$RUNNER_TEMP/branch-preview-index.html" || true
              echo "Branch alias HTML bytes: $(wc -c < "$RUNNER_TEMP/branch-preview-index.html" 2>/dev/null || echo 0)"
              echo '::error::Preview HTML is missing the expected sidebar asset references or tabs'
              exit 1
            fi
            sleep 3
          done
          echo 'Checking the deployed sidebar script'
          curl -fLsS --compressed --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 -H 'Cache-Control: no-cache' "$PREVIEW_URL/$sidebar_js" -o "$RUNNER_TEMP/pages-market-sidebar.js"
          cmp frontend/shell/left-market-sidebar/market-sidebar.js "$RUNNER_TEMP/pages-market-sidebar.js"
          echo 'Checking the deployed sidebar stylesheet'
          curl -fLsS --compressed --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 -H 'Cache-Control: no-cache' "$PREVIEW_URL/$sidebar_css" -o "$RUNNER_TEMP/pages-market-sidebar.css"
          cmp frontend/shell/left-market-sidebar/market-sidebar.css "$RUNNER_TEMP/pages-market-sidebar.css"
          echo 'Checking preview instrument metadata'
          curl -fLsS --compressed --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$PREVIEW_URL/stocks/us/instruments.json" -o "$RUNNER_TEMP/us-instruments.json"
          jq -e '.ok == true and ([.items[] | select((.symbol == "NVDA" or .symbol == "WMT") and (.industry | length > 0))] | length) == 2' "$RUNNER_TEMP/us-instruments.json"
          grep -Fq '오늘 미국 상승 테마 뭐야?' "$RUNNER_TEMP/pages-index.html"
          grep -Fq '전일 대비 거래량 폭증한 미국 종목 알려줘' "$RUNNER_TEMP/pages-index.html"
          grep -Fq '52주 신고가 신저가 종목 알려줘' "$RUNNER_TEMP/pages-index.html"
          echo 'Checking the R2-backed NVDA daily chart'
          curl -fLsS --compressed --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$PREVIEW_URL/market/us-daily-chart?symbol=NVDA" |
            jq -e '.ok == true and .symbol == "NVDA" and (.rows | length > 0)'
          echo 'Checking the preview summary endpoint'
          curl -fLsS --compressed --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$PREVIEW_URL/market/qqq-reason" |\
            jq -e '.ok == true and (.items | type == "array") and all(.items[]; (.publishedAt | type == "number") and (.text | type == "string" and length > 0) and (.url | startswith("https://")))'

      - name: Publish verified preview link
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: printf '[Open the gaemigtp-main preview](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the live TOP20 data connection
        run: |
          curl -fLsS --compressed --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 "https://quotes.gaemigtp.com/market/trading-value?market=us" -o "$RUNNER_TEMP/us-trading-value.json"
          jq -e --slurpfile metadata "$RUNNER_TEMP/us-instruments.json" '
            .ok == true and (.items | type == "array" and length > 0) and
            any(.items[];
              (.symbol | ascii_upcase | sub("\\.(O|N)$"; "")) as $symbol |
              any($metadata[0].items[];
                (.symbol | ascii_upcase) == $symbol and
                (.industry | type == "string" and length > 0)))
          ' "$RUNNER_TEMP/us-trading-value.json"

      - name: Verify live 11-industry data and three stocks per industry
        run: |
          curl -fLsS --compressed --retry 2 --retry-all-errors --retry-delay 2 --max-time 30 \
            "https://quotes.gaemigtp.com/market/us-industries?include_stocks=1&view=heatmap" \
            -o "$RUNNER_TEMP/us-industries.json"
          jq -e '
            .ok == true and .heatmap_ready == true and
            (.items | type == "array" and length == 11) and
            all(.items[]; (.stocks | type == "array" and length >= 3))
          ' "$RUNNER_TEMP/us-industries.json"
          echo "Verified all 11 industries have at least three Kiwoom-ranked stocks"

