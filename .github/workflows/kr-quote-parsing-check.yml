name: KR quote dash handling checks

on:
  pull_request:
    paths:
      - 'backend/providers/market_price.py'
      - 'tests/test_kr_quote_parsing.py'
      - '.github/workflows/kr-quote-parsing-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kr-quote-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check quote module syntax
        run: python -m py_compile backend/providers/market_price.py
      - name: Test real-price preservation and missing-value cases
        run: python -m unittest -v tests.test_kr_quote_parsing
