name: One-time US close refresh on DigitalOcean
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-close-refresh-once.yml'
permissions:
  contents: read
concurrency:
  group: us-close-refresh-once-20261020
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: gaemi-deploy
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate scoped Python file
        run: python -m py_compile backend/services/us_market_close.py
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Stage only the independent US close module
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$DO_USER@$DO_HOST" 'mkdir -p "$HOME/.gaemi-us-close-20261020"; chmod 700 "$HOME/.gaemi-us-close-20261020"; systemctl is-active gaemigtp-news.service'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 backend/services/us_market_close.py "$DO_USER@$DO_HOST:.gaemi-us-close-20261020/us_market_close.py"
      - name: Install US close selector and generate 2026-10-19 close on DigitalOcean
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$DO_USER@$DO_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app=/opt/gaemigtp-news/app
          source="$HOME/.gaemi-us-close-20261020/us_market_close.py"
          target="$app/backend/services/us_market_close.py"
          test -s "$source"
          test -f "$target"
          test "$(systemctl is-active gaemigtp-news.service)" = active
          python3 -m py_compile "$source"
          sudo -n /usr/bin/test -r /etc/gaemigtp/news-worker.env
          sudo -n /usr/bin/cp -p "$target" "$HOME/.gaemi-us-close-20261020/us_market_close.before.py"
          sudo -n /usr/bin/install -o root -g root -m 0644 "$source" "$target"
          sudo -n /usr/bin/systemd-run --quiet --wait --pipe --collect \
            --unit=gaemi-us-close-refresh-20261020 \
            -p User=gaemigtp-news -p Group=gaemigtp-news \
            -p WorkingDirectory="$app" \
            -p EnvironmentFile=/etc/gaemigtp/news-worker.env \
            /opt/gaemigtp-news/venv/bin/python -c 'import datetime,json,sys; from backend.services.us_market_close import publish_once; r=publish_once(now_utc=datetime.datetime(2026,10,20,0,0,tzinfo=datetime.timezone.utc)); print(json.dumps(r,ensure_ascii=False),flush=True); sys.exit(0 if r.get("status")=="published" else 2)'
          test "$(systemctl is-active gaemigtp-news.service)" = active
          echo "US_CLOSE_GENERATION_COMPLETE_ON_DIGITALOCEAN"
          REMOTE
