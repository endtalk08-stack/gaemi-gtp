name: Central news selection test (temporary)

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/test_news_central_selection.py'
      - '.github/workflows/central-news-selection-tests.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_news_central_selection.py -v
      - run: python -m unittest discover -s tests -p test_news_central_article_excerpt.py -v
        continue-on-error: true
      - run: python -m unittest discover -s tests -p test_simple_news_storyboard.py -v
        continue-on-error: true
      - run: python -m unittest discover -s tests -p test_issue_briefs.py -v
        continue-on-error: true
      - run: python -m unittest discover -s tests -p test_news_keyword_extraction.py -v
        continue-on-error: true
      - name: Confirm baseline failures on main
        run: |
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach /tmp/gaemi-main origin/main
          cd /tmp/gaemi-main
          echo '=== Main legacy excerpt ==='
          python -m unittest discover -s tests -p test_news_central_article_excerpt.py -v 2>&1 | tail -25
          echo '=== Main legacy storyboard ==='
          python -m unittest discover -s tests -p test_simple_news_storyboard.py -v 2>&1 | tail -40
