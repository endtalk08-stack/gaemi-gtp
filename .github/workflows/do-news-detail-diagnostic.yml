name: Diagnose original article verification (read only)
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/do-news-detail-diagnostic.yml]
permissions:
  contents: read
jobs:
  article-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Diagnose directly relevant recent article extraction
        run: |
          python - <<'PY'
          import importlib.util, time
          from backend.services.news_result import _central_direct_article
          from backend.services.issue_briefs import central_material_brief_supported, _article_excerpt
          p='backend/services/news_detail.py'
          spec=importlib.util.spec_from_file_location('detail_check',p)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          urls=[
            'https://www.hankyung.com/article/2026101667266',
            'https://www.hankyung.com/article/202610166229g',
            'http://www.wowtv.co.kr/NewsCenter/News/Read?articleId=A202610160059&t=NN',
            'https://www.venturesquare.net/1120582/',
            'https://www.gpkorea.com/news/articleView.html?idxno=147671',
            'https://www.wowtv.co.kr/NewsCenter/News/Read?articleId=A202610160059&t=NN',
          ]
          import urllib.request, re
          site='https://www.wowtv.co.kr/NewsCenter/News/Read?articleId=A202610160059&t=NN'
          try:
              req=urllib.request.Request(site,headers={'User-Agent':'gaemiGTP/1.0'})
              with urllib.request.urlopen(req,timeout=5) as resp:
                  raw=resp.read(350000).decode('utf-8','replace')
              hits=list(re.finditer('솔리다임|다롄|SK하이닉스',raw,re.IGNORECASE))
              print('BODY_HIT_COUNT',len(hits))
              for match in hits[-5:]:
                  p=match.start()
                  print('BODY_HIT',re.sub(r'\\s+',' ',raw[max(0,p-160):p+280])[:450])
              for term in ['SK하이닉스','中생산','articleBody','view_content','article_content','news_content']:
                  match=re.search(re.escape(term),raw,re.IGNORECASE)
                  if match:
                      p=match.start()
                      print('HTML_CONTEXT',term,re.sub(r'\\s+',' ',raw[max(0,p-250):p+300])[:550])
          except Exception as exc:
              print('HTML_CONTEXT_FAILED',type(exc).__name__)
          for url in urls:
              t=time.monotonic()
              try:
                  result=mod._read_url(url,with_source=True)
                  excerpt=_article_excerpt(result.get('text') or '')
                  titles={
                    '2026101667266':'"반도체는 워싱턴서 결정"…SK가 HBM 만큼 공들이는 것',
                    '202610166229g':'"돈 너무 많이 쓴다" 경고에도…삼전닉스 멈출 수 없는 까닭',
                    'A202610160059':'"中생산 늘린다고?"…SK하이닉스가 펄쩍 뛰며 부인한 까닭은',
                    '1120582':'엑시나, SK하이닉스와 AI 메모리 기술 협력',
                    '147671':'"그랜저 살까, 모델Y 살까"…5000만원으로 살 수 있는 車 달라졌다',
                  }
                  article={'title':next((title for key,title in titles.items() if key in url),'')}
                  check_stock='테슬라' if 'gpkorea' in url else 'SK하이닉스'
                  print('GATES',url.split('/')[2], 'direct=',_central_direct_article(article,excerpt,check_stock),'material=',central_material_brief_supported(excerpt),'body_has_stock=',check_stock.lower() in excerpt.lower(),'title=',article['title'],'excerpt=',excerpt[:160])
                  print('DETAIL_TAIL',url.split('/')[2], 'last=',excerpt[-450:])
                  print('ARTICLE_CHECK',url.split('/')[2], 'source=',result.get('source'),
                        'body_chars=',len(result.get('text','')), 'seconds=',round(time.monotonic()-t,2))
              except Exception as exc:
                  print('ARTICLE_ERROR',url.split('/')[2],type(exc).__name__)
          PY
