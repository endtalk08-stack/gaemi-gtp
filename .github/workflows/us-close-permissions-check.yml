name: US close deploy permissions check
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/us-close-permissions-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 4
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
      GROQ: ${{ secrets.GROQ_API_KEY }}
      NAVER_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NEON: ${{ secrets.NEWS_DATABASE_URL }}
    steps:
      - name: Inspect credentials availability and delegated deployment permission
        shell: bash
        run: |
          set -euo pipefail
          for name in GROQ NAVER_ID NAVER_SECRET NEON; do
            if test -n "${!name}"; then
              echo "SECRET_AVAILABLE $name"
            else
              echo "SECRET_UNAVAILABLE $name"
            fi
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=12 gaemi-deploy@"$DO_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo "US_CLOSE_USER=$(id -un)"
          echo "US_CLOSE_PERMISSION_LIST"
          sudo -n -l 2>&1 | sed -n '1,40p' || true
          for p in /etc/gaemigtp/news-worker.env /opt/gaemigtp-news/app/backend/services/us_market_close.py; do
            if test -r "$p"; then echo "US_CLOSE_READABLE $p"; else echo "US_CLOSE_NOT_READABLE $p"; fi
            if test -w "$p"; then echo "US_CLOSE_WRITABLE $p"; else echo "US_CLOSE_NOT_WRITABLE $p"; fi
          done
          REMOTE
