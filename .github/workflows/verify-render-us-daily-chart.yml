name: Verify private Render chart API response
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: ['.github/workflows/verify-render-us-daily-chart.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify unauthenticated chart API returns JSON 401
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          for symbol in ("NVDA","MU"):
              url="https://gaemi-gtp.onrender.com/market/us-daily-chart?symbol="+symbol
              req=urllib.request.Request(url,headers={"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=40) as resp:
                      status=resp.status
                      body=resp.read(10000)
                      ct=resp.headers.get("Content-Type","")
              except urllib.error.HTTPError as exc:
                  status=exc.code
                  body=exc.read(10000)
                  ct=exc.headers.get("Content-Type","")
              assert status==401,(symbol,status)
              assert "application/json" in ct,(symbol,ct)
              data=json.loads(body)
              assert data.get("error")=="private_access_required",(symbol,data.get("error"))
              print("CHART_PRIVATE_GATE_OK symbol=%s status=%s error=%s"%(symbol,status,data["error"]),flush=True)
          PY
