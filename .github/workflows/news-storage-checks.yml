name: News storage and AI quota checks

on:
  push:
    branches: [main]
    paths:
      - "backend/database/**"
      - "backend/services/news_issue_ai.py"
      - "backend/services/news_feed.py"
      - "tests/test_news_issue_ai.py"
      - "tests/test_news_repository.py"
      - "tests/test_news_retention.py"
      - "tests/test_news_ai_failure_diagnostics.py"
      - "tests/test_news_ai_candidates.py"
      - "tests/test_news_central_selection.py"
      - "requirements.txt"
      - ".github/workflows/news-storage-checks.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile news modules
        run: python -m compileall -q backend/database backend/services/news_issue_ai.py backend/services/news_feed.py
      - name: Run isolated news tests
        run: |
          python -m unittest discover -s tests -p 'test_news_issue_ai.py' -v
          python -m unittest discover -s tests -p 'test_news_repository.py' -v
          python -m unittest discover -s tests -p 'test_news_retention.py' -v
          python -m unittest discover -s tests -p 'test_news_ai_failure_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_news_ai_candidates.py' -v
          # Check central selection behavior affected by the AI candidate hand-off.
          # The unrelated legacy central-selection suite has two known failures.
          python -m unittest discover -s tests -p 'test_news_central_selection.py' -k test_verified_candidates_replace_unrelated_and_unreadable -v
          python -m unittest discover -s tests -p 'test_news_central_selection.py' -k test_same_event_reports_collapse_to_one -v
          python -m unittest discover -s tests -p 'test_news_central_selection.py' -k test_distinct_factory_location_is_not_duplicate -v
          python -m unittest discover -s tests -p 'test_news_central_selection.py' -k test_recent_material_events_fill_missing_central_news_slots -v
