name: Local Kiwoom news identity handoff one-time safe deployment
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: ['.github/workflows/one-time-news-local-handoff-20261029.yml']
permissions:
  contents: read
concurrency:
  group: gaemi-digitalocean-gateway
  cancel-in-progress: false
jobs:
  deploy-paused:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 10
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify precise live baselines, offline tests, and deploy while disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          remote="gaemi-deploy@$DO_HOST"
          src_c="$RUNNER_TEMP/collector.before.py"
          src_w="$RUNNER_TEMP/worker.before.py"
          src_r="$RUNNER_TEMP/rotation.py"
          new_c="$RUNNER_TEMP/collector.after.py"
          new_w="$RUNNER_TEMP/worker.after.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote" 'test "$(systemctl is-active gaemigtp-news.service || true)" = inactive && test "$(systemctl is-enabled gaemigtp-news.service || true)" = disabled && test "$(systemctl is-active gaemigtp-kiwoom-us-value.timer || true)" = inactive && test "$(systemctl is-enabled gaemigtp-kiwoom-us-value.timer || true)" = disabled && ( test "$(systemctl is-active gaemigtp-kiwoom-us-value.service || true)" = inactive || test "$(systemctl is-active gaemigtp-kiwoom-us-value.service || true)" = failed ) && echo PAUSED_NEWS_AND_KIWOOM_PRECHECK_OK'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote:/opt/gaemigtp-news/app/backend/kiwoom_us_value_collector.py" "$src_c"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote:/opt/gaemigtp-news/app/backend/news_worker.py" "$src_w"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote:/opt/gaemigtp-news/app/backend/services/us_top20_rotation.py" "$src_r"
          cmp -s backend/kiwoom_us_value_collector.py "$src_c"
          python3 - "$src_c" "$src_w" "$src_r" "$new_c" "$new_w" <<'PY'
          import ast, importlib.util, json, os, pathlib, sys, tempfile, types
          from datetime import datetime, timezone
          from unittest.mock import patch
          collector_path, worker_path, rot_path, target_collector, target_worker = map(pathlib.Path, sys.argv[1:])
          original_collector=collector_path.read_text(encoding="utf-8")
          original_worker=worker_path.read_text(encoding="utf-8")
          coll_anchor="    print(\"KIWOOM_US_VALUE_SNAPSHOT_UPDATED=20\", flush=True)\n"
          worker_start="def read_ranked_stocks(market, query, path):\n"
          worker_end="\n\ndef next_ranked_stock(state):"
          assert original_collector.count(coll_anchor)==1, "collector_baseline_mismatch"
          assert original_worker.count(worker_start)==1 and original_worker.count(worker_end)==1, "worker_baseline_mismatch"
          entry=original_worker.index(worker_start)
          exit=original_worker.index(worker_end,entry)
          old_reader=original_worker[entry:exit]
          for marker in ("psycopg.connect", "market_rank_entries", "market_instruments", "normalize_ranking"):
              assert marker in old_reader, "old_reader_mismatch:"+marker
          local_writer='''def _write_local_news_top20(rows, captured_at, *, target_path=None):
              """Atomic one-server handoff of already fetched Kiwoom ranks and identities.
          
              The existing Neon write stays unchanged; this file never triggers an API/DB call.
              """
              from pathlib import Path
              import tempfile
              from backend.services.us_top20_rotation import normalize_ranking
              from backend.kiwoom_us_identity_sync import identity_from_kiwoom
          
              path = Path(target_path) if target_path is not None else Path(
                  "/var/lib/gaemigtp-news/kiwoom-us-top20-news.json")
              if not path.parent.is_dir() or path.is_symlink():
                  raise RuntimeError("unsafe_local_ranking_path")
              normalized = normalize_ranking([
                  {"rank": row["rank"], "symbol": row["symbol"], "name": row["name"]}
                  for row in rows
              ])
              items=[]
              for row in normalized:
                  matched=identity_from_kiwoom(row["name"], row["symbol"])
                  if matched is None:
                      raise ValueError("unmatched_kiwoom_identity")
                  items.append({
                      **row,
                      "company_key": matched["company_key"],
                      "news_name": matched["news_name"],
                      "identity_status": matched["status"]
                  })
              data={"schema_version": 1, "source": "kiwoom",
                    "market": "US", "rank_type": "trading_value",
                    "captured_at": captured_at.isoformat(), "items": items}
              temp_name=None
              try:
                  with tempfile.NamedTemporaryFile(
                      mode="w", encoding="utf-8", dir=str(path.parent),
                      prefix=".kiwoom-news-top20-", delete=False
                  ) as handle:
                      temp_name=handle.name
                      os.fchmod(handle.fileno(), 0o600)
                      json.dump(data,handle,ensure_ascii=False,separators=(",",":"))
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.replace(temp_name,path)
              finally:
                  if temp_name is not None and os.path.exists(temp_name):
                      os.unlink(temp_name)
          '''
          new_reader='''def read_ranked_stocks(market, query, path, *, snapshot_path=None):
              """Use Kiwoom's existing local snapshot; never request Render or Neon."""
              if market != "미국" or query != "market=us" or path != "/market/trading-value":
                  return []
              from pathlib import Path
              from backend.services.us_top20_rotation import normalize_ranking
              file=Path(snapshot_path) if snapshot_path is not None else Path(
                  "/var/lib/gaemigtp-news/kiwoom-us-top20-news.json")
              if file.is_symlink():
                  raise ValueError("unsafe_local_ranking_path")
              data=json.loads(file.read_text(encoding="utf-8"))
              if (not isinstance(data,dict) or data.get("schema_version") != 1
                      or data.get("source") != "kiwoom" or data.get("market") != "US"
                      or data.get("rank_type") != "trading_value"):
                  raise ValueError("invalid_local_kiwoom_snapshot")
              return normalize_ranking(data.get("items"))
          '''
          updated_collector=original_collector.replace(
              "\ndef main():\n", "\n"+local_writer+"\ndef main():\n",1
          ).replace(coll_anchor,
              "    _write_local_news_top20(rows, captured)\n"+coll_anchor,1)
          assert original_collector.count("\ndef main():\n")==1
          updated_worker=original_worker[:entry]+new_reader+original_worker[exit:]
          ast.parse(updated_collector,filename="backend/kiwoom_us_value_collector.py")
          ast.parse(updated_worker,filename="backend/news_worker.py")
          assert updated_collector.count("def _write_local_news_top20(")==1
          assert updated_collector.count("upsert_kiwoom_identity(")==original_collector.count("upsert_kiwoom_identity(")
          assert updated_collector.count("fetch_us_trading_value_top(")==original_collector.count("fetch_us_trading_value_top(")
          assert updated_worker[:entry]==original_worker[:entry] and updated_worker[entry+len(new_reader):]==original_worker[exit:]
          assert "psycopg.connect" not in new_reader and "urllib" not in new_reader
          target_collector.write_text(updated_collector,encoding="utf-8")
          target_worker.write_text(updated_worker,encoding="utf-8")
          # Offline regression with the *real* deployed rank normalization, mocked identities.
          rot_spec=importlib.util.spec_from_file_location("rotation_live",rot_path)
          rot=importlib.util.module_from_spec(rot_spec)
          rot_spec.loader.exec_module(rot)
          module_rot=types.ModuleType("backend.services.us_top20_rotation")
          module_rot.normalize_ranking=rot.normalize_ranking
          module_identity=types.ModuleType("backend.kiwoom_us_identity_sync")
          module_identity.identity_from_kiwoom=lambda name,symbol: {
              "company_key":"US:"+symbol,"news_name":name,"status":"verified"}
          ns_writer={"json":json,"os":os}
          ns_reader={"json":json}
          extract=lambda src,name:next(n for n in ast.parse(src).body if isinstance(n,ast.FunctionDef) and n.name==name)
          exec(compile(ast.Module(body=[extract(updated_collector,"_write_local_news_top20")],type_ignores=[]),"writer.py","exec"),ns_writer)
          exec(compile(ast.Module(body=[extract(updated_worker,"read_ranked_stocks")],type_ignores=[]),"reader.py","exec"),ns_reader)
          with patch.dict(sys.modules,{"backend.services.us_top20_rotation":module_rot,
                                        "backend.kiwoom_us_identity_sync":module_identity}):
              with tempfile.TemporaryDirectory(prefix="gaemi-offline-") as directory:
                  f=pathlib.Path(directory)/"top20.json"
                  rows=[{"rank":i,"symbol":"AB"+str(i),"name":"Issuer "+str(i)} for i in range(1,21)]
                  stamp=datetime(2026,10,29,tzinfo=timezone.utc)
                  ns_writer["_write_local_news_top20"](rows,stamp,target_path=f)
                  saved=json.loads(f.read_text())
                  assert saved["source"]=="kiwoom" and len(saved["items"])==20
                  assert saved["items"][0]["company_key"]=="US:AB1"
                  assert saved["items"][-1]["identity_status"]=="verified"
                  assert f.stat().st_mode & 0o777 == 0o600
                  ranking=ns_reader["read_ranked_stocks"]("미국","market=us","/market/trading-value",snapshot_path=f)
                  assert len(ranking)==20 and ranking[0]["symbol"]=="AB1" and ranking[-1]["symbol"]=="AB20"
                  assert ns_reader["read_ranked_stocks"]("미국","market=us","/market/popular",snapshot_path=f)==[]
                  before=f.read_bytes()
                  try: ns_writer["_write_local_news_top20"](rows[:19],stamp,target_path=f)
                  except rot.RankingUnavailable: pass
                  else: raise AssertionError("partial rank accepted")
                  assert f.read_bytes()==before
                  f.write_text(json.dumps({**saved,"items":saved["items"][:19]}))
                  try: ns_reader["read_ranked_stocks"]("미국","market=us","/market/trading-value",snapshot_path=f)
                  except rot.RankingUnavailable: pass
                  else: raise AssertionError("reader accepted partial ranking")
                  f.write_text(json.dumps(saved))
                  f.unlink()
                  f.symlink_to(pathlib.Path(directory)/"wrong")
                  try: ns_reader["read_ranked_stocks"]("미국","market=us","/market/trading-value",snapshot_path=f)
                  except ValueError: pass
                  else: raise AssertionError("reader followed symlink")
          print("LOCAL_KIWOOM_HANDOFF_OFFLINE_TESTS_PASSED")
          print("NO_REAL_NEON_NO_KIWOOM_NO_NEWS_AI_CALLS")
          print("PATCH_SCOPE=ONE_COLLECTOR_POST_COMMIT_HOOK_AND_ONE_WORKER_READER")
          PY
          before_c="$(sha256sum "$src_c" | awk '{print $1}')"
          before_w="$(sha256sum "$src_w" | awk '{print $1}')"
          after_c="$(sha256sum "$new_c" | awk '{print $1}')"
          after_w="$(sha256sum "$new_w" | awk '{print $1}')"
          test "$before_c" != "$after_c" && test "$before_w" != "$after_w"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote" "test \"\$(systemctl is-active gaemigtp-news.service || true)\" = inactive && test \"\$(systemctl is-enabled gaemigtp-news.service || true)\" = disabled && test \"\$(systemctl is-active gaemigtp-kiwoom-us-value.timer || true)\" = inactive && test \"\$(systemctl is-enabled gaemigtp-kiwoom-us-value.timer || true)\" = disabled && test \"\$(sha256sum /opt/gaemigtp-news/app/backend/kiwoom_us_value_collector.py | awk '{print \$1}')\" = '$before_c' && test \"\$(sha256sum /opt/gaemigtp-news/app/backend/news_worker.py | awk '{print \$1}')\" = '$before_w'"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote" 'install -d -m 0700 "$HOME/.gaemi-gateway"'
          changed_c=0;changed_w=0
          rollback() {
            rc="$?";trap - ERR
            echo "LOCAL_HANDOFF_DEPLOY_ERROR_ROLLBACK_BEGIN"
            if [ "$changed_w" = 1 ]; then
              scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$src_w" "$remote:.gaemi-gateway/payload" || true
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote" sudo -n /usr/local/sbin/gaemi-do-gateway deploy backend/news_worker.py "$(git hash-object "$src_w")" || true
            fi
            if [ "$changed_c" = 1 ]; then
              scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$src_c" "$remote:.gaemi-gateway/payload" || true
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote" sudo -n /usr/local/sbin/gaemi-do-gateway deploy backend/kiwoom_us_value_collector.py "$(git hash-object "$src_c")" || true
            fi
            echo "LOCAL_HANDOFF_DEPLOY_ERROR_ROLLBACK_ATTEMPTED"
            exit "$rc"
          }
          trap rollback ERR
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$new_c" "$remote:.gaemi-gateway/payload"
          changed_c=1
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote" sudo -n /usr/local/sbin/gaemi-do-gateway deploy backend/kiwoom_us_value_collector.py "$(git hash-object "$new_c")"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$new_w" "$remote:.gaemi-gateway/payload"
          changed_w=1
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote" sudo -n /usr/local/sbin/gaemi-do-gateway deploy backend/news_worker.py "$(git hash-object "$new_w")"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote" "test \"\$(systemctl is-active gaemigtp-news.service || true)\" = inactive && test \"\$(systemctl is-enabled gaemigtp-news.service || true)\" = disabled && test \"\$(systemctl is-active gaemigtp-kiwoom-us-value.timer || true)\" = inactive && test \"\$(systemctl is-enabled gaemigtp-kiwoom-us-value.timer || true)\" = disabled && test \"\$(sha256sum /opt/gaemigtp-news/app/backend/kiwoom_us_value_collector.py | awk '{print \$1}')\" = '$after_c' && test \"\$(sha256sum /opt/gaemigtp-news/app/backend/news_worker.py | awk '{print \$1}')\" = '$after_w'"
          changed_c=0;changed_w=0;trap - ERR
          echo "LOCAL_NEWS_HANDOFF_INSTALLED_BOTH_COLLECTORS_REMAIN_DISABLED"
          echo "NEW_COLLECTOR_SHA256=$after_c"
          echo "NEW_WORKER_SHA256=$after_w"
          