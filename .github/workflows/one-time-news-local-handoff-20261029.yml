name: Local Kiwoom news identity handoff one-time safe deployment
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: ['.github/workflows/one-time-news-local-handoff-20261029.yml']
permissions:
  contents: read
concurrency:
  group: gaemi-digitalocean-gateway
  cancel-in-progress: false
jobs:
  deploy-paused:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 10
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify precise live baselines, offline tests, and deploy while disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          remote="gaemi-deploy@$DO_HOST"
          src_c="$RUNNER_TEMP/collector.before.py"
          src_w="$RUNNER_TEMP/worker.before.py"
          src_r="$RUNNER_TEMP/rotation.py"
          new_c="$RUNNER_TEMP/collector.after.py"
          new_w="$RUNNER_TEMP/worker.after.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote" 'bash -s' <<'REMOTE'
          for u in gaemigtp-news.service gaemigtp-kiwoom-us-value.timer gaemigtp-kiwoom-us-value.service; do
            echo "DIAG_UNIT=$u"
            echo "DIAG_ACTIVE=$(systemctl is-active "$u" || true)"
            echo "DIAG_ENABLED=$(systemctl is-enabled "$u" || true)"
            systemctl show "$u" -p ActiveState -p SubState -p Result -p LoadState --no-pager | head -n 4
          done
          echo "DIAG_NEWS_FILE=$(test -f /opt/gaemigtp-news/app/backend/news_worker.py && echo present || echo missing)"
          echo "DIAG_COLLECTOR_FILE=$(test -f /opt/gaemigtp-news/app/backend/kiwoom_us_value_collector.py && echo present || echo missing)"
          echo "DIAG_NEWS_STATE=$(stat -c '%a:%U:%G' /var/lib/gaemigtp-news 2>/dev/null || echo unavailable)"
          REMOTE
          echo "DIAGNOSTIC_ONLY_COMPLETED_NO_DEPLOY"
