name: Widget X click preview
on:
  push:
    branches: [fix/widget-x-click-20261124]
    paths:
      - frontend/shell/center-chat/widget-dock/widget-dock.js
      - frontend/shell/center-chat/widget-dock/widget-dock.css
      - .github/workflows/widget-x-preview.yml
permissions:
  contents: read
concurrency:
  group: widget-x-click-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate changed widget code
        run: |
          node --check frontend/shell/center-chat/widget-dock/widget-dock.js
          grep -Fq "document.addEventListener('click'" frontend/shell/center-chat/widget-dock/widget-dock.js
          grep -Fq "}, true);" frontend/shell/center-chat/widget-dock/widget-dock.js
          grep -Fq 'position: relative;' frontend/shell/center-chat/widget-dock/widget-dock.css
          grep -Fq 'z-index: 5;' frontend/shell/center-chat/widget-dock/widget-dock.css
          grep -Fq 'pointer-events: auto;' frontend/shell/center-chat/widget-dock/widget-dock.css
      - name: Deploy preview to existing Pages project
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: 6cf7450897a598809db421965a07304b
          command: pages deploy frontend --project-name gaemigtp-main --branch widget-x-click-preview
      - name: Verify preview deployment
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          case "$PREVIEW_URL" in https://*.gaemigtp-main.pages.dev) ;; *) exit 1 ;; esac
          curl -fLsS --compressed --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 "$PREVIEW_URL/" -o "$RUNNER_TEMP/index.html"
          grep -Fq 'centralWidgetDock' "$RUNNER_TEMP/index.html"
          js="$(grep -o 'shell/center-chat/widget-dock/widget-dock[.]js?v=[^"]*' "$RUNNER_TEMP/index.html" | head -n1)"
          test -n "$js"
          curl -fLsS --compressed --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 "$PREVIEW_URL/$js" -o "$RUNNER_TEMP/widget-dock.js"
          cmp frontend/shell/center-chat/widget-dock/widget-dock.js "$RUNNER_TEMP/widget-dock.js"
          echo "Preview deployed: $PREVIEW_URL"
