name: Kiwoom US read-only adapter tests
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths:
      - '.github/workflows/kiwoom-us-quotes-tests.yml'
      - 'backend/providers/kiwoom_us_quotes.py'
      - 'backend/kiwoom_us_live_prices.py'
      - 'backend/kiwoom_us_price_relay.py'
      - 'tests/test_kiwoom_us_quotes.py'
      - 'backend/services/market_rankings.py'
      - 'backend/services/market_issue_headlines.py'
      - 'backend/services/engine.py'
      - 'app.py'
      - 'tests/test_market_trading_value.py'
      - 'tests/test_market_selection_context.py'
      - 'frontend/shell/left-market-sidebar/market-sidebar.js'
permissions:
  contents: read
jobs:
  no-network-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify code and run mocked Kiwoom unit tests
        run: |
          set -euo pipefail
          python -m pip install 'requests>=2.32,<3'
          python -m compileall -q backend/providers/kiwoom_us_quotes.py backend/kiwoom_us_live_prices.py backend/kiwoom_us_price_relay.py backend/services/market_rankings.py backend/services/market_issue_headlines.py backend/services/engine.py app.py
          python -m unittest -v tests.test_kiwoom_us_quotes
          python -m unittest -v tests.test_market_trading_value tests.test_market_selection_context tests.test_kiwoom_identity_autoregister
