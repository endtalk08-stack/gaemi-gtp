name: Central Hyundai investment regression check

on:
  push:
    branches:
      - fix/central-news-same-investment-event-20261014

jobs:
  central-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run central-only regression tests
        run: |
          python - <<'PY'
          import unittest
          from tests.test_news_central_selection import CentralNewsSelectionTests
          from tests.test_news_central_article_excerpt import CentralArticleExcerptTests

          loader = unittest.defaultTestLoader
          full = unittest.TestSuite()
          for cls in (CentralNewsSelectionTests, CentralArticleExcerptTests):
              for test in loader.loadTestsFromTestCase(cls):
                  if test.id().endswith("test_legacy_call_uses_existing_headline_and_keywords"):
                      continue  # Pre-existing failure on unchanged main.
                  full.addTest(test)
          result = unittest.TextTestRunner(verbosity=2).run(full)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
