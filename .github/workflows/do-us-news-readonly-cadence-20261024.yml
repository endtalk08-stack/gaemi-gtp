name: Audit US news worker live reprocessing 20261024
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/do-us-news-readonly-cadence-20261024.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: SSH read-only service and recent results, no secret values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i "$HOME/.ssh/id_ed25519" "gaemi-deploy@$DO_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/gaemigtp-news/app
          echo LIVE_WORKER_BEGIN
          systemctl show gaemigtp-news.service -p ActiveState -p SubState -p MainPID -p ExecStart -p ActiveEnterTimestamp -p NRestarts | head -n 6
          echo CODE_REV6_PRESENT=$(grep -Fc '"_code_source_revision": 6' backend/services/news_result.py)
          echo STORE_REV6_PRESENT=$(grep -Fc 'payload.get("_code_source_revision") != 6' backend/services/news_processed_store.py)
          echo RECENT_NEWS_WORKER_LOG_BEGIN
          journalctl -u gaemigtp-news.service --since '40 minutes ago' --no-pager -o cat | grep -E '\[news-worker\]|\[analyze news funnel\]|\[뉴스\] fail|\[news detail\] failed' | tail -n 75 | sed -E 's#https?://[^ ]+#<url>#g' || true
          echo RECENT_NEWS_WORKER_LOG_END
          echo LIVE_WORKER_END
          REMOTE
      - name: Wipe temporary SSH identity
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
