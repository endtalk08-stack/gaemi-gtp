name: Validate staged daily Groq issues
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths:
      - ops/staged_ai_issue_store.py
      - ops/staged_ai_issue_display_adapter.py
      - ops/staged_daily_groq_issues.py
      - ops/staged_daily_issue_schedule.py
      - ops/staged_daily_call_guard.py
      - ops/staged_issue_evidence.py
      - ops/staged_issue_links.py
      - ops/staged_issue_pipeline.py
      - tests/test_staged_ai_issue_store.py
      - tests/test_staged_ai_issue_display_adapter.py
      - tests/test_staged_daily_groq_issues.py
      - tests/test_staged_daily_issue_schedule.py
      - tests/test_staged_daily_safety.py
      - tests/test_staged_daily_call_guard.py
      - tests/test_staged_daily_evidence.py
      - tests/test_staged_issue_links.py
      - tests/test_staged_issue_integration.py
      - tests/test_staged_issue_pipeline.py
      - tests/test_staged_issue_pipeline_storage.py
      - .github/workflows/test-staged-daily-groq.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test without calling any API
        run: |
          python -m py_compile ops/staged_ai_issue_store.py ops/staged_ai_issue_display_adapter.py ops/staged_daily_groq_issues.py ops/staged_daily_issue_schedule.py ops/staged_daily_call_guard.py ops/staged_issue_evidence.py ops/staged_issue_links.py ops/staged_issue_pipeline.py
          python -m unittest discover -s tests -p 'test_staged_ai_*.py' -v
          python -m unittest discover -s tests -p 'test_staged_daily_*.py' -v
          python -m unittest discover -s tests -p 'test_staged_issue_*.py' -v
