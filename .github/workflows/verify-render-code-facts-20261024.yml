name: Verify Render code-fact issue visibility
on:
  push:
    branches: [fix/render-code-facts-display-20261024]
    paths:
      - backend/services/news_freshness.py
      - backend/services/market_issue_headlines.py
      - backend/services/news_result.py
      - tests/test_us_news_freshness.py
      - tests/test_market_issue_headlines.py
      - tests/test_us_stock_news_identity.py
      - .github/workflows/verify-render-code-facts-20261024.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python syntax
        run: python -m py_compile backend/services/news_freshness.py backend/services/market_issue_headlines.py backend/services/news_result.py
      - name: Verify main chat and sidebar freshness
        run: |
          python -m unittest discover -s tests -p 'test_us_news_freshness.py' -v
          python -m unittest discover -s tests -p 'test_market_issue_headlines.py' -v
          python -m unittest discover -s tests -p 'test_us_stock_news_identity.py' -v
