name: Install fixed 40-stock disclosure whitelist (no API requests)
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/do-disclosure-40-whitelist-install.yml]
permissions:
  contents: read
concurrency:
  group: do-disclosure-40-whitelist-install
  cancel-in-progress: false
jobs:
  offline-test-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: digitalocean-news-worker
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline unit tests - no SEC, DART, Neon or Render calls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_disclosure_*.py' -v
          python3 -m compileall -q backend/services/disclosure_universe.py backend/services/disclosure_single_collect.py
      - name: Prepare scoped SSH
        run: |
          set -euo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Stage two disclosure-only modules
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "gaemi-deploy@$DO_HOST" 'mkdir -p /home/gaemi-deploy/disclosures-migration-staging/user40-ready && chmod 700 /home/gaemi-deploy/disclosures-migration-staging/user40-ready'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes backend/services/disclosure_universe.py backend/services/disclosure_single_collect.py "gaemi-deploy@$DO_HOST:/home/gaemi-deploy/disclosures-migration-staging/user40-ready/"
      - name: Install data and guarded single-stock collector - do not execute
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "gaemi-deploy@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          app=/opt/gaemigtp-news/app
          dst=$app/backend/services
          stage=/home/gaemi-deploy/disclosures-migration-staging/user40-ready
          py=/opt/gaemigtp-news/venv/bin/python
          old_engine="$(sha256sum "$dst/engine.py" | cut -d' ' -f1)"
          old_worker="$(systemctl show gaemigtp-news.service -p MainPID --value)"
          test "$(systemctl is-active gaemigtp-news.service)" = active
          test -w "$dst"
          for file in disclosure_universe.py disclosure_single_collect.py; do
            "$py" -m py_compile "$stage/$file"
            if [ -e "$dst/$file" ]; then
              cmp -s "$stage/$file" "$dst/$file" || { echo "DISCREPANCY_EXISTING_FILE=$file"; exit 1; }
            else
              install -m 0644 "$stage/$file" "$dst/$file"
            fi
            cmp -s "$stage/$file" "$dst/$file"
            echo "DISCLOSURE_ONLY_FILE_READY=$file"
          done
          cd "$app"
          "$py" - <<'PY'
          from backend.services.disclosure_universe import KR_COMPANIES, US_COMPANIES, validate_universe
          assert validate_universe()
          print("FIXED_UNIVERSE_KR=" + str(len(KR_COMPANIES)))
          print("FIXED_UNIVERSE_US=" + str(len(US_COMPANIES)))
          PY
          test "$(sha256sum "$dst/engine.py" | cut -d' ' -f1)" = "$old_engine"
          test "$(systemctl show gaemigtp-news.service -p MainPID --value)" = "$old_worker"
          test "$(systemctl is-active gaemigtp-news.service)" = active
          echo 'INSTALL_COMPLETE_NO_PROVIDER_CALL_NO_SCHEDULE_NO_WORKER_RESTART'
          REMOTE
