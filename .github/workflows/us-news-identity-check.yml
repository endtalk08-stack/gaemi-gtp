name: US news stock identity checks

on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017, main]
    paths:
      - 'backend/analysis/news/stock_identity.py'
      - 'backend/analysis/news/catalog.py'
      - 'backend/services/stock_identity_store.py'
      - 'backend/services/market_rankings.py'
      - 'ops/staged_news_processed_store.py'
      - 'backend/services/news_result.py'
      - 'backend/services/market_issue_headlines.py'
      - 'tests/test_dynamic_stock_identity.py'
      - '.github/workflows/us-news-identity-check.yml'
  pull_request:
    paths:
      - 'backend/analysis/news/catalog.py'
      - 'backend/services/news_feed.py'
      - 'backend/services/news_result.py'
      - 'backend/services/market_issue_headlines.py'
      - 'tests/test_us_stock_news_identity.py'
      - '.github/workflows/us-news-identity-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed Python
        run: python -m py_compile backend/analysis/news/catalog.py backend/analysis/news/stock_identity.py backend/services/stock_identity_store.py backend/services/market_rankings.py backend/services/news_feed.py backend/services/news_result.py backend/services/market_issue_headlines.py tests/test_dynamic_stock_identity.py tests/test_us_stock_news_identity.py
      - name: Dynamic company identity checks
        run: python -m unittest discover -s tests -p 'test_dynamic_stock_identity.py' -v
      - name: Focused US identity regressions
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            # Render main intentionally has no removed legacy news-result store.
            # Exercise the real company identity and read-only sync paths only.
            python -m unittest -v \
              tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_verified_naver_names_and_ticker_suffixes \
              tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_provider_queries_for_naver_alphabet \
              tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_provider_queries_for_amazon_and_palantir \
              tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_sidebar_reads_existing_us_alias_without_renaming_row \
              tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_sidebar_rejects_mismatched_ticker \
              tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_sidebar_kr_uses_only_original_name \
              tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_central_reader_uses_existing_us_snapshot_alias_when_exact_missing
          else
            python -m unittest discover -s tests -p 'test_us_stock_news_identity.py' -v
          fi
      - name: Existing stock news queries
        run: python -m unittest discover -s tests -p 'test_news_feed_queries.py' -v
      - name: Existing US/KR ranking name normalization (isolated)
        run: |
          python -m unittest -v \
            tests.test_market_trading_value.MarketTradingValueTests.test_naver_live_kr_popular_price_object_identity_and_rank \
            tests.test_market_trading_value.MarketTradingValueTests.test_naver_live_us_popular_price_object_identity_and_rank \
            tests.test_market_trading_value.MarketTradingValueTests.test_popular_ranking_reuses_kr_and_us_stock_normalization
