name: US news stock identity checks

on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017, main]
    paths:
      - 'backend/analysis/news/stock_identity.py'
      - 'backend/analysis/news/catalog.py'
      - 'backend/services/market_rankings.py'
      - 'backend/services/news_identity_registry.py'
      - 'backend/services/news_result.py'
      - 'backend/services/market_issue_headlines.py'
      - 'tests/test_dynamic_stock_identity.py'
      - 'tests/test_us_stock_news_identity.py'
      - '.github/workflows/us-news-identity-check.yml'
  pull_request:
    paths:
      - 'backend/analysis/news/catalog.py'
      - 'backend/services/news_feed.py'
      - 'backend/services/news_identity_registry.py'
      - 'backend/services/news_result.py'
      - 'backend/services/market_issue_headlines.py'
      - 'tests/test_us_stock_news_identity.py'
      - '.github/workflows/us-news-identity-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed Python
        run: python -m py_compile backend/services/news_identity_registry.py backend/analysis/news/catalog.py backend/analysis/news/stock_identity.py backend/services/market_rankings.py backend/services/news_feed.py backend/services/news_result.py backend/services/market_issue_headlines.py tests/test_dynamic_stock_identity.py tests/test_us_stock_news_identity.py
      - name: Local verified company identity checks (no database)
        run: |
          python -m unittest -v \
            tests.test_dynamic_stock_identity.IdentityTests.test_share_company_news_but_not_price_identity \
            tests.test_dynamic_stock_identity.IdentityTests.test_known_ticker_english_and_korean_names \
            tests.test_dynamic_stock_identity.IdentityTests.test_unknown_ticker_never_steals_another_company \
            tests.test_dynamic_stock_identity.IdentityTests.test_adr_and_space_news_do_not_cross_into_other_tickers \
            tests.test_dynamic_stock_identity.IdentityTests.test_local_verified_catalog_resolves_share_classes_without_database \
            tests.test_dynamic_stock_identity.IdentityTests.test_logo_lookup_does_not_change_pending_news_identity
      - name: Focused US provider and sidebar identity regressions
        run: |
          python -m unittest -v \
            tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_verified_naver_names_and_ticker_suffixes \
            tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_provider_queries_for_naver_alphabet \
            tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_provider_queries_for_amazon_and_palantir \
            tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_sidebar_rejects_mismatched_ticker \
            tests.test_us_stock_news_identity.UsListingNewsIdentityTests.test_sidebar_kr_uses_only_original_name
      - name: Existing stock news queries
        run: python -m unittest discover -s tests -p 'test_news_feed_queries.py' -v
      - name: Retained US trading-value rank normalization
        run: |
          python -m unittest -v \
            tests.test_market_trading_value.MarketTradingValueTests.test_us_value_rows_only \
            tests.test_market_trading_value.MarketTradingValueTests.test_removed_naver_ranking_collectors_are_absent
