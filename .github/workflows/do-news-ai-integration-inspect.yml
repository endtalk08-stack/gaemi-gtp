name: Inspect DigitalOcean AI integration points
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/do-news-ai-integration-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    environment: digitalocean-news-worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Read integration points without changing server
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -o ConnectTimeout=12 -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" gaemi-deploy@"$DO_HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import os
          root=Path("/opt/gaemigtp-news/app")
          for rel in ["backend/news_worker.py","backend/services/news_processed_store.py"]:
              p=root/rel
              print("===== "+rel+" =====")
              lines=p.read_text().splitlines()
              for i,line in enumerate(lines,1):
                  if i<=265:
                      print(f"{i:03d} {line}")
          print("===== SERVICE STATE =====")
          print("groq_key_in_process_env", bool(os.getenv("GROQ_API_KEY")))
          print("===== SOURCE DIR =====")
          print("ops_dir_exists", (root/"ops").is_dir())
          PY
# Read-only code inspection. No deploy, restart, or API calls.
