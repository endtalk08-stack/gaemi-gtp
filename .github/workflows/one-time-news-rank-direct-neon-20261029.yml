name: Replace news worker Render ranking hop with direct Neon read (one time)
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/one-time-news-rank-direct-neon-20261029.yml]
permissions:
  contents: read
concurrency:
  group: gaemi-digitalocean-gateway
  cancel-in-progress: false
jobs:
  patch-paused-worker:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify paused worker, offline patch, and deploy WITHOUT starting service
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12)
          remote="gaemi-deploy@$DO_HOST"
          old="$RUNNER_TEMP/gaemi-worker-original.py"
          built="$RUNNER_TEMP/gaemi-worker-direct-neon.py"
          rotation="$RUNNER_TEMP/us_top20_rotation.py"
          ssh "$remote" 'test "$(systemctl is-active gaemigtp-news.service || true)" = inactive && test -f /opt/gaemigtp-news/app/backend/news_worker.py && echo NEWS_WORKER_PAUSED_PRECHECK_OK'
          scp "$remote:/opt/gaemigtp-news/app/backend/news_worker.py" "$old"
          scp "$remote:/opt/gaemigtp-news/app/backend/services/us_top20_rotation.py" "$rotation"
          python - "$old" "$built" "$rotation" <<'PY'
          import ast, importlib.util, pathlib, sys, types
          from unittest.mock import patch
          old_path, new_path, rot_path = (pathlib.Path(p) for p in sys.argv[1:])
          original = old_path.read_text(encoding='utf-8')
          start = 'def read_ranked_stocks(market, query, path):'
          end = '\n\ndef next_ranked_stock(state):'
          assert original.count(start) == 1 and original.count(end) == 1, 'unexpected_worker_baseline'
          first = original.index(start)
          last = original.index(end, first)
          existing = original[first:last]
          for required in ('urllib.request.urlopen', 'NEWS_WORKER_RANKING_TOKEN', '/market/trading-value', 'data.get("items")'):
              assert required in existing, 'unexpected_old_rank_source'
          replacement = '''def read_ranked_stocks(market, query, path):
              """Read the already-collected Kiwoom Top20 directly from Neon, no Render HTTP.
          
              Exactly one read-only snapshot query at the beginning of each 20-stock
              rotation; all other ticks reuse the worker's persistent local cycle.
              """
              if market != "미국" or query != "market=us" or path != "/market/trading-value":
                  return []
              from backend.services.us_top20_rotation import normalize_ranking
              import psycopg
              dsn = store.database_url()
              if not dsn:
                  raise RuntimeError("NEWS_DATABASE_URL is required")
              with psycopg.connect(dsn, connect_timeout=5) as conn:
                  with conn.cursor() as cur:
                      cur.execute("""
                          SELECT e.rank, e.symbol, e.display_name
                          FROM public.market_rank_entries AS e
                          JOIN public.market_instruments AS i
                            ON i.market=e.market AND i.symbol=e.symbol
                          WHERE e.market='US' AND e.snapshot_id=(
                              SELECT s.id FROM public.market_rank_snapshots AS s
                              WHERE s.source='kiwoom' AND s.market='US'
                                AND s.rank_type='trading_value'
                              ORDER BY s.captured_at DESC, s.id DESC LIMIT 1
                          )
                          ORDER BY e.rank LIMIT 20
                      """)
                      records = cur.fetchall()
              return normalize_ranking([
                  {"rank": rank, "symbol": symbol, "name": name}
                  for rank, symbol, name in records
              ])'''
          updated = original[:first] + replacement + original[last:]
          assert updated[:first] == original[:first] and updated[first + len(replacement):] == original[last:]
          ast.parse(updated, filename='backend/news_worker.py')
          new_path.write_text(updated, encoding='utf-8')
          # Offline only: inject fake psycopg to prove no network, no writes,
          # exactly one SQL SELECT, stable ordering and refusal of partial lists.
          spec = importlib.util.spec_from_file_location('offline_real_rotation', rot_path)
          real_rotation = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(real_rotation)
          sys.modules['backend.services.us_top20_rotation'] = real_rotation
          node = next(n for n in ast.parse(updated).body if isinstance(n, ast.FunctionDef) and n.name == 'read_ranked_stocks')
          calls = []
          records = [(i, f'AB{i}', f'Stock {i}') for i in range(1, 21)]
          class Cursor:
              def __enter__(self): return self
              def __exit__(self, *args): pass
              def execute(self, statement):
                  assert 'market_rank_entries' in statement
                  assert 'market_instruments' in statement
                  assert 'market_rank_snapshots' in statement
                  assert statement.lstrip().upper().startswith('SELECT')
                  assert not any(k in statement.upper() for k in ('INSERT ', 'UPDATE ', 'DELETE ', 'DROP '))
                  calls.append('select')
              def fetchall(self): return records
          class Connection:
              def __enter__(self): return self
              def __exit__(self, *args): pass
              def cursor(self): return Cursor()
          fake = types.ModuleType('psycopg')
          def fake_connect(dsn, connect_timeout):
              assert dsn == 'offline-only' and connect_timeout == 5
              return Connection()
          fake.connect = fake_connect
          ns = {'store': types.SimpleNamespace(database_url=lambda: 'offline-only')}
          exec(compile(ast.Module(body=[node], type_ignores=[]), 'isolated-rank.py', 'exec'), ns)
          with patch.dict(sys.modules, {'psycopg': fake}):
              result = ns['read_ranked_stocks']('미국','market=us','/market/trading-value')
              assert len(result) == 20 and result[0]['symbol'] == 'AB1' and result[-1]['symbol'] == 'AB20'
              assert calls == ['select'], calls
              assert ns['read_ranked_stocks']('미국','market=us','/market/popular') == []
              assert calls == ['select']
              records[:] = records[:-1]
              try:
                  ns['read_ranked_stocks']('미국','market=us','/market/trading-value')
              except real_rotation.RankingUnavailable:
                  pass
              else:
                  raise AssertionError('partial snapshot was accepted')
          print('OFFLINE_DIRECT_NEON_TOP20_TESTS_PASS')
          print('SCOPE=replace_only_read_ranked_stocks')
          print('NO_PROVIDER_CALLS_NO_DATABASE_CONNECTIONS_NO_SERVICE_RESTART')
          PY
          original_sha="$(sha256sum "$old" | awk '{print $1}')"
          new_sha="$(sha256sum "$built" | awk '{print $1}')"
          test "$original_sha" != "$new_sha"
          # Refuse to edit if the live file changed since the snapshot, or service is active.
          ssh "$remote" "test \"\$(systemctl is-active gaemigtp-news.service || true)\" = inactive && test \"\$(sha256sum /opt/gaemigtp-news/app/backend/news_worker.py | awk '{print \$1}')\" = '$original_sha'"
          ssh "$remote" 'install -d -m 0700 "$HOME/.gaemi-gateway"'
          scp "$built" "$remote:.gaemi-gateway/payload"
          sha_blob="$(git hash-object "$built")"
          armed=1
          rollback() {
            local rc="$?"
            trap - ERR
            if [ "$armed" = 1 ]; then
              echo 'VERIFICATION_FAILED_ROLLBACK_ORIGINAL'
              scp "$old" "$remote:.gaemi-gateway/payload" || true
              ssh "$remote" sudo -n /usr/local/sbin/gaemi-do-gateway deploy backend/news_worker.py "$(git hash-object "$old")" || true
            fi
            exit "$rc"
          }
          trap rollback ERR
          ssh "$remote" sudo -n /usr/local/sbin/gaemi-do-gateway deploy backend/news_worker.py "$sha_blob"
          ssh "$remote" "test \"\$(systemctl is-active gaemigtp-news.service || true)\" = inactive && test \"\$(sha256sum /opt/gaemigtp-news/app/backend/news_worker.py | awk '{print \$1}')\" = '$new_sha'"
          armed=0
          trap - ERR
          echo 'DIRECT_NEON_RANKING_DEPLOYED_NEWS_WORKER_STILL_PAUSED'
