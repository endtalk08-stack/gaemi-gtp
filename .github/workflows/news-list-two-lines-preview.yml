name: News list two-line preview
on:
  push:
    branches: [fix/news-list-two-lines-20261124]
    paths:
      - 'frontend/widgets/news/news-widget.js'
      - 'frontend/widgets/news/news-widget.css'
      - 'frontend/index.html'
      - '.github/workflows/news-list-two-lines-preview.yml'
permissions:
  contents: read
concurrency:
  group: news-list-two-lines-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check news-only changes
        run: |
          set -e
          node --check frontend/widgets/news/news-widget.js
          grep -Fq 'function renderListItem(item)' frontend/widgets/news/news-widget.js
          grep -Fq 'rows.map(renderListItem)' frontend/widgets/news/news-widget.js
          grep -Fq 'filteredRows.map(renderListItem)' frontend/widgets/news/news-widget.js
          grep -Fq 'gnw-list-time' frontend/widgets/news/news-widget.css
          grep -Fq 'gnw-detail-source' frontend/widgets/news/news-widget.js
          grep -Fq 'justify-content:space-between' frontend/widgets/news/news-widget.css
          grep -Fq 'news-detail-layout-v3' frontend/index.html
          grep -Fq 'data-gnw-open' frontend/widgets/news/news-widget.js
          grep -Fq "data-central-widget-remove=\"news-feed\"" frontend/widgets/news/news-widget.js
          node --check frontend/shell/center-chat/widget-dock/widget-dock.js
      - name: Preview on existing gaemigtp-main
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: 6cf7450897a598809db421965a07304b
          command: pages deploy frontend --project-name gaemigtp-main --branch news-list-two-lines-preview
      - name: Check deployed file and Access status
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          case "$PREVIEW_URL" in https://*.gaemigtp-main.pages.dev) ;; *) exit 1 ;; esac
          curl -fLsS --max-time 25 "$PREVIEW_URL/index.html" -o "$RUNNER_TEMP/preview.html"
          if grep -qi 'Cloudflare Access' "$RUNNER_TEMP/preview.html"; then
            echo "Preview deployed; Cloudflare Access prevents anonymous HTML verification"
            exit 0
          fi
          grep -Fq 'news-list-two-lines-v1' "$RUNNER_TEMP/preview.html"
          curl -fLsS --max-time 25 "$PREVIEW_URL/widgets/news/news-widget.js?v=20261124-news-list-two-lines-v1" -o "$RUNNER_TEMP/news-widget.js"
          cmp -s frontend/widgets/news/news-widget.js "$RUNNER_TEMP/news-widget.js"
          echo "Preview news assets verified"
