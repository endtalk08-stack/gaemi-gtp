name: News temporary storage checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/services/news_metadata_store.py'
      - 'backend/services/news_feed.py'
      - 'tests/test_news_metadata_store.py'
      - '.github/workflows/news-metadata-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify news cache and retention rules
        run: python -m unittest discover -s tests -p 'test_news_metadata_store.py' -v
      - name: Verify the original feed's query behavior
        run: python -m unittest discover -s tests -p 'test_news_feed_queries.py' -v
