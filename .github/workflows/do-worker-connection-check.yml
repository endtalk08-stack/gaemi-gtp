name: DigitalOcean worker SSH connection check

on:
  workflow_dispatch:
  push:
    branches:
      - ops/do-ssh-deploy-setup-20261017
    paths:
      - .github/workflows/do-worker-connection-check.yml

permissions:
  contents: read

concurrency:
  group: digitalocean-worker-connection-check
  cancel-in-progress: false

jobs:
  inspect-only:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_SSH_USER: gaemi-deploy
      DO_SSH_PRIVATE_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      DO_SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate SSH settings
        run: |
          set -euo pipefail
          for name in DO_HOST DO_SSH_USER DO_SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required SSH setting: ${name}"
              exit 1
            fi
          done
      - name: Prepare strict SSH client
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Verify SSH access and worker service without changing the server
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$DO_SSH_USER@$DO_HOST" \
            'set -eu; test -d /opt/gaemigtp-news/app/backend; printf "SSH_CONNECTION_OK user="; id -un; printf "WORKER_SERVICE="; systemctl is-active gaemigtp-news.service'

      - name: Inspect installed disclosure components read-only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$DO_SSH_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/gaemigtp-news/app
          printf 'WORKER_SERVICE='
          systemctl is-active gaemigtp-news.service
          for path in \
            backend/news_worker.py \
            backend/providers/sec_filings.py \
            backend/services/engine.py \
            backend/services/disclosure_scoring.py \
            backend/services/news_processed_store.py; do
            if test -f "$path"; then
              echo "COMPONENT_PRESENT=$path"
            else
              echo "COMPONENT_ABSENT=$path"
            fi
          done
          if test -r /etc/gaemigtp/news-worker.env; then
            echo WORKER_CONFIG_READABLE=yes
            for name in OPENDART_API_KEY DART_API_KEY SEC_USER_AGENT NEWS_DATABASE_URL DATABASE_URL; do
              if grep -Eq "^$name=" /etc/gaemigtp/news-worker.env; then
                echo "CONFIG_NAME_PRESENT=$name"
              else
                echo "CONFIG_NAME_ABSENT=$name"
              fi
            done
          else
            echo WORKER_CONFIG_READABLE=no
          fi
          if test -d .git; then
            printf 'DO_SOURCE_REVISION='
            git rev-parse --short HEAD || true
          else
            echo DO_SOURCE_REVISION=not-git-checkout
          fi
          echo DISCLOSURE_COMPONENT_READONLY_CHECK_DONE
          REMOTE

      - name: Verify deployed disclosure modules and active worker usage
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$DO_SSH_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/gaemigtp-news/app
          /opt/gaemigtp-news/venv/bin/python - <<'PY'
          import ast
          from pathlib import Path
          checks = {
              "backend/news_worker.py": ("main",),
              "backend/services/engine.py": ("fetch_kr_official_disclosures", "fetch_us_official_filings", "fetch_dart_disclosure_detail"),
              "backend/providers/sec_filings.py": ("fetch_recent_filings",),
          }
          for filename, wanted in checks.items():
              path = Path(filename)
              if not path.is_file():
                  print("MISSING_SOURCE=" + filename)
                  continue
              try:
                  content = path.read_text()
                  tree = ast.parse(content)
              except (SyntaxError, UnicodeError, OSError) as e:
                  print("SOURCE_UNREADABLE=" + filename + ":" + type(e).__name__)
                  continue
              found = {n.name for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
              for name in wanted:
                  print("DO_FUNC=" + filename + ":" + name + ":" + str(name in found).lower())
              if filename.endswith("news_worker.py"):
                  imports = []
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ImportFrom):
                          imports.append(node.module or "")
                  print("WORKER_IMPORTS_DISCLOSURE=" + str(any("disclos" in t or t.endswith("engine") or "sec_filing" in t for t in imports)).lower())
          PY
          echo DISCLOSURE_SOURCE_INSPECTION_COMPLETE
          REMOTE

      - name: Check DO disclosure runtime boundaries safely
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$DO_SSH_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/gaemigtp-news/app
          printf 'SERVICE_ACCOUNT='
          systemctl show gaemigtp-news.service -p User --value
          printf 'SERVICE_ENV_PATH_CONFIGURED='
          if test -n "$(systemctl show gaemigtp-news.service -p EnvironmentFiles --value)"; then echo yes; else echo no; fi
          echo SERVICE_ACTIVE="$(systemctl is-active gaemigtp-news.service)"
          echo "TCP_LISTEN_PORTS_BEGIN"
          ss -tlnH | awk '{print $4}' | sed -E 's/.*:([0-9]+)$/\\1/' | sort -nu | head -15
          echo "TCP_LISTEN_PORTS_END"
          /opt/gaemigtp-news/venv/bin/python - <<'PY'
          from pathlib import Path
          import ast
          base = Path('/opt/gaemigtp-news/app')
          py = ['backend/news_worker.py','backend/services/engine.py',
                'backend/providers/sec_filings.py','backend/services/disclosure_scoring.py']
          for name in py:
              path = base / name
              if not path.exists():
                  continue
              source = path.read_text()
              try:
                  compile(source, str(path), 'exec')
                  print('CODE_SYNTAX_OK=' + name)
              except (SyntaxError, ValueError, TypeError) as exc:
                  print('CODE_SYNTAX_ERROR=' + name + ':' + type(exc).__name__)
              if name == 'backend/news_worker.py':
                  t = ast.parse(source)
                  names = {n.id for n in ast.walk(t) if isinstance(n, ast.Name)}
                  print('WORKER_REFERENCES_ANALYZE_STOCK=' + str('analyze_stock' in names).lower())
                  print('WORKER_REFERENCES_SEC_FILINGS=' + str('fetch_us_official_filings' in names).lower())
                  print('WORKER_REFERENCES_DART=' + str('fetch_kr_official_disclosures' in names).lower())
          for name in ('flask','gunicorn','psycopg','requests'):
              from importlib.util import find_spec
              try:
                  ok = bool(find_spec(name))
              except (ImportError, AttributeError, ValueError):
                  ok = False
              print('DO_PACKAGE_' + name.upper() + '=' + str(ok).lower())
          PY
          echo DISCLOSURE_RUNTIME_BOUNDARY_CHECK_DONE
          REMOTE

      - name: Verify disclosure credential-name availability without reading secrets
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$DO_SSH_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -eu
          if sudo -n -u gaemigtp-news /usr/bin/env true >/dev/null 2>&1; then
            echo DISCLOSURE_ACCOUNT_SWITCH=allowed
            sudo -n -u gaemigtp-news /opt/gaemigtp-news/venv/bin/python - <<'PY'
          import os, pathlib, re
          env_paths = (pathlib.Path('/etc/gaemigtp/news-worker.env'),)
          required = ['OPENDART_API_KEY', 'DART_API_KEY', 'SEC_USER_AGENT', 'NEWS_DATABASE_URL', 'DATABASE_URL']
          lines = []
          for file in env_paths:
              if file.is_file() and os.access(file, os.R_OK):
                  for line in file.read_text().splitlines():
                      if not line.startswith('#') and '=' in line:
                          lines.append(line.split('=',1)[0].strip())
          for key in required:
              print('DO_CREDENTIAL_NAME_' + key + '=' + ('present' if key in lines else 'absent'))
          print('DO_SEC_USABLE=' + str('SEC_USER_AGENT' in lines).lower())
          print('DO_DART_USABLE=' + str(any(k in lines for k in ('OPENDART_API_KEY','DART_API_KEY'))).lower())
          PY
          else
            echo DISCLOSURE_ACCOUNT_SWITCH=denied
          fi
          echo DISCLOSURE_CONFIG_CHECK_COMPLETE
          REMOTE

      - name: Check configured disclosure secret names in deployment environment
        env:
          SEC_AGENT_SECRET: ${{ secrets.SEC_USER_AGENT }}
          DART_PRIMARY_SECRET: ${{ secrets.OPENDART_API_KEY }}
          DART_COMPAT_SECRET: ${{ secrets.DART_API_KEY }}
          DART_ENV_PRIMARY: ${{ vars.OPENDART_API_KEY }}
          DART_ENV_COMPAT: ${{ vars.DART_API_KEY }}
        run: |
          set -euo pipefail
          for name in SEC_AGENT_SECRET DART_PRIMARY_SECRET DART_COMPAT_SECRET DART_ENV_PRIMARY DART_ENV_COMPAT; do
            if test -n "${!name}"; then
              echo "ACTION_SETTING_${name}=present"
            else
              echo "ACTION_SETTING_${name}=absent"
            fi
          done
          echo DISCLOSURE_DEPLOY_SETTING_CHECK_DONE

      - name: Smoke-check DO SEC 30-day listing without credentials or scheduled work
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$DO_SSH_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/gaemigtp-news/app
          timeout 25s /opt/gaemigtp-news/venv/bin/python - <<'PY'
          import os
          import time
          print('DO_LOGIN_DART_CONFIG=' + str(bool(os.getenv('OPENDART_API_KEY') or os.getenv('DART_API_KEY'))).lower(), flush=True)
          try:
              from backend.services.engine import fetch_us_official_filings
              import inspect
              print('DO_SEC_SUPPORTED_PARAMS=' + ','.join(inspect.signature(fetch_us_official_filings).parameters), flush=True)
              start = time.monotonic()
              # Avoid entire filing enrichment fan-out during server baseline.
              parameters = inspect.signature(fetch_us_official_filings).parameters
              args = {'days': 30, 'max_results': 0}
              if 'complete_window' in parameters:
                  args['complete_window'] = True
              rows = fetch_us_official_filings('AAPL', **args)
              print('DO_SEC_LIST_LENGTH=' + str(len(rows)), flush=True)
              print('DO_SEC_LIST_HAS_ACCESSION=' + str(bool(rows and rows[0].get('accession'))).lower(), flush=True)
              print('DO_SEC_LIST_SECONDS=' + str(round(time.monotonic()-start, 2)), flush=True)
          except Exception as exc:
              print('DO_SEC_LIST_ERROR=' + type(exc).__name__, flush=True)
          PY
          echo DO_SEC_READONLY_SMOKE_COMPLETE
          REMOTE

      - name: Verify both newly registered disclosure secrets without exposing values
        env:
          CHECK_DB_SECRET: ${{ secrets.NEWS_DATABASE_URL }}
          CHECK_DART_SECRET: ${{ secrets.OPENDART_API_KEY }}
        run: |
          set -euo pipefail
          if test -n "$CHECK_DB_SECRET"; then
            echo "DISCLOSURE_NEON_SECRET=present"
          else
            echo "DISCLOSURE_NEON_SECRET=missing"
          fi
          if test -n "$CHECK_DART_SECRET"; then
            echo "DISCLOSURE_DART_SECRET=present"
          else
            echo "DISCLOSURE_DART_SECRET=missing"
          fi
          test -n "$CHECK_DB_SECRET" && test -n "$CHECK_DART_SECRET"
          echo DISCLOSURE_BOTH_SECRETS_READY
      - name: Run one-time SEC and DART snapshot sync into Neon
        env:
          TRANSFER_DB_URL: ${{ secrets.NEWS_DATABASE_URL }}
          TRANSFER_DART_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TRANSFER_DB_URL" && test -n "$TRANSFER_DART_KEY"
          local_dir="$(mktemp -d)"
          remote_dir=/home/gaemi-deploy/disclosures-migration-staging
          cleanup() { rm -rf "$local_dir"; }
          trap cleanup EXIT
          umask 077
          python - "$local_dir/.disclosure-credentials.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "NEWS_DATABASE_URL": os.environ["TRANSFER_DB_URL"],
              "OPENDART_API_KEY": os.environ["TRANSFER_DART_KEY"],
          }))
          PY
          chmod 600 "$local_dir/.disclosure-credentials.json"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$DO_SSH_USER@$DO_HOST" 'test -f /home/gaemi-deploy/disclosures-migration-staging/engine.py && test -f /home/gaemi-deploy/disclosures-migration-staging/disclosure_transfer.py && systemctl is-active gaemigtp-news.service'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$local_dir/.disclosure-credentials.json" \
            "$DO_SSH_USER@$DO_HOST":"$remote_dir"/.disclosure-credentials.json
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$DO_SSH_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          folder=/home/gaemi-deploy/disclosures-migration-staging
          trap 'rm -f "$folder/.disclosure-credentials.json"' EXIT
          cd /opt/gaemigtp-news/app
          timeout 145s /opt/gaemigtp-news/venv/bin/python - <<'PY'
          from pathlib import Path
          import json, os, sys
          credential=Path('/home/gaemi-deploy/disclosures-migration-staging/.disclosure-credentials.json')
          credentials=json.loads(credential.read_text())
          credential.unlink()
          for key,value in credentials.items():
              os.environ[key]=value
          import psycopg
          with psycopg.connect(os.environ['NEWS_DATABASE_URL'],connect_timeout=5) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='disclosure_snapshots')")
                  ready=bool(cur.fetchone()[0])
          print("DO_DISCLOSURE_NEON_TABLE_ACCESS="+str(ready).lower(),flush=True)
          if not ready:
              sys.exit(2)
          import backend.services
          backend.services.__path__.insert(0,'/home/gaemi-deploy/disclosures-migration-staging')
          from backend.services.disclosure_transfer import collect_once
          from backend.services import engine
          is_staged=Path(engine.__file__).resolve()==Path('/home/gaemi-deploy/disclosures-migration-staging/engine.py')
          print("DO_DISCLOSURE_STAGED_ENGINE="+str(is_staged).lower(),flush=True)
          if not is_staged:
              sys.exit(3)
          failures=[]
          for market,symbol in [('KR','005930'),('US','AAPL')]:
              try:
                  result=collect_once(market,symbol)
                  print("DO_DISCLOSURE_SYNC_OK="+market+":"+symbol+":"+str(result['filing_count']),flush=True)
              except Exception as exc:
                  print("DO_DISCLOSURE_SYNC_FAIL="+market+":"+symbol+":"+type(exc).__name__,flush=True)
                  failures.append(market)
          if failures:
              sys.exit(4)
          print('DO_DISCLOSURE_BOTH_MARKETS_STORED',flush=True)
          PY
          echo "DO_NEWS_WORKER_AFTER_SYNC=$(systemctl is-active gaemigtp-news.service)"
          REMOTE
