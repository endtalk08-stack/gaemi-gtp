name: DigitalOcean worker SSH connection check

# Manual-only, fixed read-only command; never run on a PR or push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalocean-worker-connection-check
  cancel-in-progress: false

jobs:
  inspect-only:
    if: ${{ github.repository == 'endtalk08-stack/gaemi-gtp' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: digitalocean-news-worker
    timeout-minutes: 3
    steps:
      - name: Validate secrets and prepare pinned SSH identity
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DO_HOST DO_SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Required SSH setting is not configured: $name"
              exit 1
            fi
          done
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Verify connection and worker status (read-only)
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 \
            -o ConnectionAttempts=1 \
            -o RequestTTY=no \
            "gaemi-deploy@$DO_HOST" \
            'set -eu; test "$(id -un)" = gaemi-deploy; test -d /opt/gaemigtp-news/app/backend; status="$(systemctl is-active gaemigtp-news.service)"; test "$status" = active; printf "SSH_CONNECTION_OK user=%s\n" "$(id -un)"; printf "WORKER_SERVICE=%s\n" "$status"'

      - name: Remove temporary SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
