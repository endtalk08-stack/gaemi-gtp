name: DigitalOcean worker connection check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalocean-worker-connection-check
  cancel-in-progress: false

jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required GitHub Actions secrets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DO_HOST DO_SSH_USER DO_SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Prepare SSH (no host key bypass)
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Inspect worker without changes
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "${DO_SSH_USER}@${DO_HOST}" \
            'test -d /opt/gaemigtp-news/app/backend && systemctl is-active gaemigtp-news.service && printf "DO worker connection verified\n"'
