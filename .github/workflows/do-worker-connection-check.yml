name: DigitalOcean worker connection check

on:
  workflow_dispatch:
  push:
    branches:
      - ops/do-ssh-deploy-setup-20261017
    paths:
      - .github/workflows/do-worker-connection-check.yml

permissions:
  contents: read

concurrency:
  group: digitalocean-worker-connection-check
  cancel-in-progress: false

jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required GitHub Actions secrets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_USER: ${{ vars.NEWS_SSH_USER }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.NEWS_SSH_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DO_HOST DO_SSH_USER DO_SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Prepare SSH (no host key bypass)
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.NEWS_SSH_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Inspect worker without changes
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_USER: ${{ vars.NEWS_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "${DO_SSH_USER}@${DO_HOST}" \
            'set -eu; cd /opt/gaemigtp-news/app/backend; test -s news_worker.py; test -s services/news_processed_store.py; printf "NEWS_WORKER_FILES:\\n"; find . -maxdepth 2 -type f -name "*.py" -printf "%P\\n" | sort | head -60; printf "NEWS_WORKER_SOURCE_BYTES="; wc -c < news_worker.py; printf "\\nNEWS_PROCESSED_STORE_SOURCE_BYTES="; wc -c < services/news_processed_store.py; printf "\\nSERVICE_STATE:\\n"; systemctl is-active gaemigtp-news.service; systemctl show -p ActiveState,SubState,MainPID gaemigtp-news.service; printf "DO worker inspection verified\\n"'

      - name: Inspect issue selection warnings (read only)
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_USER: ${{ vars.NEWS_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "${DO_SSH_USER}@${DO_HOST}" \
            'set -eu; echo "LIVE_FILE_HASHES"; sha256sum /opt/gaemigtp-news/app/backend/news_worker.py /opt/gaemigtp-news/app/backend/services/news_processed_store.py; echo "LAST_ISSUE_LOGS"; journalctl -u gaemigtp-news.service --since "45 minutes ago" --no-pager -o cat 2>/dev/null | grep -E "selection_summary|all_candidate_article_bodies_unavailable|error=|news-worker|processed news" | tail -45 || true'

      - name: Read live worker decision and snapshot save logic
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_USER: ${{ vars.NEWS_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "${DO_SSH_USER}@${DO_HOST}" \
            'set -eu; cd /opt/gaemigtp-news/app/backend; echo "WORKER_STOCK_PROCESS"; sed -n "100,175p" news_worker.py; echo "STORE_SNAPSHOT"; grep -n -A55 "^def save_snapshot" services/news_processed_store.py; echo "STORE_CHECK"; grep -n -A22 "^def read_signature" services/news_processed_store.py'
