name: Read-only DigitalOcean Groq preflight
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/do-news-ai-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.message == 'RUN_DO_NEWS_AI_INSPECT_20261017'
    environment: digitalocean-news-worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_USER: ${{ vars.NEWS_SSH_USER }}
      SSH_KEY: ${{ secrets.NEWS_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check server environment key presence without printing values
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$DO_HOST" 'systemctl show gaemigtp-news.service -p ActiveState -p SubState; /opt/gaemigtp-news/venv/bin/python -c '\''import pathlib; p=pathlib.Path("/opt/gaemigtp-news/app/backend/news_worker.py"); t=p.read_text(); print("WORKER_PRESENT",p.exists()); print("WORKER_LINES",len(t.splitlines())); print("WORKER_NEON_SAVE", "save_snapshot(" in t)'\'''
# Read-only inspection trigger; no deployment or AI calls.
