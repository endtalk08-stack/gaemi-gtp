name: Read-only DigitalOcean Groq preflight
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/do-news-ai-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.message == 'RUN_DO_NEWS_AI_INSPECT_20261017'
    environment: digitalocean-news-worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_USER: ${{ vars.NEWS_SSH_USER }}
      SSH_KEY: ${{ secrets.NEWS_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check server environment key presence without printing values
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -o ConnectTimeout=12 -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$DO_HOST" 'echo SSH_IDENTITY; id; echo WORKER_FILE_WRITE; if test -w /opt/gaemigtp-news/app/backend/news_worker.py; then echo YES; else echo NO; fi; echo BACKEND_DIR_WRITE; if test -w /opt/gaemigtp-news/app/backend; then echo YES; else echo NO; fi; echo OPS_DIR_WRITE; if test -w /opt/gaemigtp-news/app/ops; then echo YES; else echo NO; fi; echo SUDO_NONINTERACTIVE; if sudo -n true 2>/dev/null; then echo YES; else echo NO; fi; echo GIT_CHECKOUT; git -C /opt/gaemigtp-news/app rev-parse --is-inside-work-tree 2>/dev/null || true'
