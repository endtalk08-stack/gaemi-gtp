name: Inspect DigitalOcean news AI integration (read-only)
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/do-news-ai-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.message == 'RUN_DO_NEWS_AI_INSPECT_20261017'
    environment: digitalocean-news-worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_USER: ${{ vars.NEWS_SSH_USER }}
      SSH_KEY: ${{ secrets.NEWS_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Inspect scheduling, issue integration and secret presence (read only)
        run: |
          set -euo pipefail
          test "$SSH_USER" = "gaemi-news-check"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$DO_HOST" 'cd /opt/gaemigtp-news/app && /opt/gaemigtp-news/venv/bin/python -c '\''import ast,pathlib; files=["backend/news_worker.py","backend/services/news_result.py","backend/services/issue_briefs.py"]; keys=("main","run","process","build_stock_news_result","build_issue_briefs","save_snapshot"); [(print("FILE",p),print("FUNCTIONS",[(n.name,n.lineno) for n in ast.parse(pathlib.Path(p).read_text()).body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]),print("KEY_LINES"),[(print(str(i)+": "+line[:180])) for i,line in enumerate(pathlib.Path(p).read_text().splitlines(),1) if any(k in line for k in ("build_stock_news_result(", "build_issue_briefs(", "save_snapshot(", "sleep(", "time.sleep", "result_payload", "issue_briefs ="))]) for p in files]; print("CONFIG_KEY_PRESENT",__import__("os").path.exists("/opt/gaemigtp-news/app/.env"))'\'' && echo SERVICE_ENV_NAMES && systemctl cat gaemigtp-news.service | grep "^EnvironmentFile=" | sed -E "s|=.*|=[configured file path omitted]|"'
