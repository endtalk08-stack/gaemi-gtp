name: One-time sync paused DigitalOcean source to ops branch
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: ['.github/workflows/one-time-sync-paused-news-sources-20261029.yml']
permissions:
  contents: write
concurrency:
  group: gaemi-digitalocean-gateway
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 10
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/do-ssh-deploy-setup-20261017
          fetch-depth: 1
          persist-credentials: true
      - name: Sync exact deployed source without restarting services
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          remote="gaemi-deploy@$DO_HOST"
          src_c="$RUNNER_TEMP/news-collector-live.py"
          src_w="$RUNNER_TEMP/news-worker-live.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote" 'test "$(systemctl is-active gaemigtp-news.service || true)" = inactive && test "$(systemctl is-enabled gaemigtp-news.service || true)" = disabled && test "$(systemctl is-active gaemigtp-kiwoom-us-value.timer || true)" = inactive && test "$(systemctl is-enabled gaemigtp-kiwoom-us-value.timer || true)" = disabled && echo PRODUCTION_PAUSED_FOR_SOURCE_SYNC'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote:/opt/gaemigtp-news/app/backend/kiwoom_us_value_collector.py" "$src_c"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$remote:/opt/gaemigtp-news/app/backend/news_worker.py" "$src_w"
          test "$(sha256sum "$src_c" | awk '{print $1}')" = '0c3e36c9ec9aaee6822d009ad7926eb7ea403d816706dc1a312862fd184e2fd1'
          test "$(sha256sum "$src_w" | awk '{print $1}')" = '6155177ec94b12bada2c46bcd32701d195f6afd01ed6077fd6cae7cb484ae77e'
          test "$(sha256sum backend/kiwoom_us_value_collector.py | awk '{print $1}')" = '66d7f09760fc4ec66fe5e60b4df5ad354b0c4b2c0786473061f9c78e9267f1a7'
          test ! -e backend/news_worker.py
          python3 - "$src_c" "$src_w" <<'PY'
          import ast, sys
          from pathlib import Path
          c=Path(sys.argv[1]).read_text()
          w=Path(sys.argv[2]).read_text()
          ast.parse(c)
          ast.parse(w)
          assert all(x in c for x in ("def _write_local_news_top20(", "KIWOOM_US_VALUE_SNAPSHOT_UPDATED=20", "upsert_kiwoom_identity(", "fetch_us_trading_value_top("))
          assert all(x in w for x in ("def read_ranked_stocks(", "def _news_slot(", "def _batch(", "kiwoom-us-top20-news.json"))
          reader=w[w.index("def read_ranked_stocks("):w.index("def next_ranked_stock(")]
          assert not any(x in reader for x in ("psycopg.connect", "urllib.request.urlopen", "market_rank_entries"))
          for s in (c,w):
              assert not any(x in s for x in ("-----BEGIN PRIVATE KEY-----", "postgresql://", "postgres://", "sk-proj-"))
          print("SOURCE_SYNC_OFFLINE_VERIFICATION_PASS")
          PY
          cp "$src_c" backend/kiwoom_us_value_collector.py
          cp "$src_w" backend/news_worker.py
          git add -- backend/kiwoom_us_value_collector.py backend/news_worker.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" = 2
          git -c user.name='gaemi-ops-bot' -c user.email='gaemi-ops-bot@users.noreply.github.com' commit -m 'Sync deployed DigitalOcean news worker and Kiwoom local Top20 handoff'
          git push origin "HEAD:ops/do-ssh-deploy-setup-20261017"
          echo "NEWS_SOURCE_SYNC_COMMIT=$(git rev-parse HEAD)"
          echo 'DO_SERVICES_UNTOUCHED_GITHUB_SOURCES_ONLY'
          