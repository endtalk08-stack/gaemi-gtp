name: Sidebar issue sync checks

on:
  pull_request:
    paths:
      - 'frontend/shell/left-market-sidebar/market-sidebar.js'
      - 'frontend/shell/center-chat/analysis-flow.js'
      - 'frontend/index.html'
      - 'tests/test_sidebar_issue_sync.cjs'
      - 'backend/services/market_issue_headlines.py'
      - 'tests/test_market_issue_freshness.py'
      - 'backend/services/news_result.py'
      - 'tests/test_shared_news_freshness.py'
      - '.github/workflows/sidebar-issue-sync-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sidebar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check frontend/shell/left-market-sidebar/market-sidebar.js
          node --check frontend/shell/center-chat/analysis-flow.js
      - name: Sidebar synchronization regression tests
        run: node --test tests/test_sidebar_issue_sync.cjs

  verify-market-issue-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check sidebar issue priority
        run: python -m unittest discover -s tests -p 'test_market_issue_freshness.py' -v
      - name: Check central issue priority
        run: python -m unittest discover -s tests -p 'test_shared_news_freshness.py' -v
