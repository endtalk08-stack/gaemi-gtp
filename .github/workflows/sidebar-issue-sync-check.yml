name: Sidebar issue sync checks

on:
  pull_request:
    paths:
      - 'frontend/shell/left-market-sidebar/market-sidebar.js'
      - 'frontend/shell/center-chat/analysis-flow.js'
      - 'frontend/index.html'
      - 'tests/test_sidebar_issue_sync.cjs'
      - 'backend/services/market_rankings.py'
      - 'tests/test_dynamic_stock_identity.py'
      - 'backend/services/market_issue_headlines.py'
      - 'tests/test_market_issue_headlines.py'
      - 'app.py'
      - '.github/workflows/sidebar-issue-sync-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sidebar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check frontend/shell/left-market-sidebar/market-sidebar.js
          node --check frontend/shell/center-chat/analysis-flow.js
      - name: Server syntax and 20-row partial failure regression
        run: |
          python -m py_compile app.py backend/services/market_issue_headlines.py backend/services/market_rankings.py tests/test_dynamic_stock_identity.py
          python -m unittest -v tests.test_market_issue_headlines
          python -m unittest -v tests.test_dynamic_stock_identity.IdentityTests.test_sidebar_marks_follow_existing_neon_ticker_registry
      - name: Sidebar synchronization regression tests
        run: node --test tests/test_sidebar_issue_sync.cjs
