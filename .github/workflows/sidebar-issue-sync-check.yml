name: Sidebar issue sync checks

on:
  pull_request:
    paths:
      - 'frontend/shell/left-market-sidebar/market-sidebar.js'
      - 'frontend/shell/center-chat/analysis-flow.js'
      - 'frontend/index.html'
      - 'frontend/shell/right-panel/right-panel-tabs.js'
      - 'backend/services/engine.py'
      - 'app.py'
      - 'backend/providers/sec_filings.py'
      - 'frontend/js/disclosures.js'
      - 'tests/test_news_feed_queries.py'
      - 'tests/test_sidebar_issue_sync.cjs'
      - '.github/workflows/sidebar-issue-sync-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sidebar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check frontend/shell/left-market-sidebar/market-sidebar.js
          node --check frontend/shell/center-chat/analysis-flow.js
          node --check frontend/shell/right-panel/right-panel-tabs.js
          node --check frontend/js/disclosures.js
          python -m py_compile backend/services/engine.py backend/providers/sec_filings.py app.py
      - name: Sidebar synchronization regression tests
        run: node --test tests/test_sidebar_issue_sync.cjs
      - name: SEC provider detail regression (offline)
        run: |
          python - <<'PY'
          from backend.providers.sec_filings import _panel_form144_fields, _panel_filing_metrics, _panel_submission
          xml = '<securitiesInformation><noOfUnitsSold>6500</noOfUnitsSold><aggregateMarketValue>1400250</aggregateMarketValue><approxSaleDate>10/19/2026</approxSaleDate></securitiesInformation>'
          values = {i['label']:i['value'] for i in _panel_form144_fields(xml)}
          assert values['매도 예정 주식 수'] == '6500'
          assert values['예상 시장가치(USD)'] == '1400250'
          accn = '0001045810-26-000011'
          facts = {'facts':{'us-gaap':{'NetIncomeLoss':{'units':{'USD':[
            {'accn':accn,'form':'10-Q','start':'2026-01-01','end':'2026-06-30','val':999},
            {'accn':accn,'form':'10-Q','start':'2026-04-01','end':'2026-06-30','val':123}]}}}}}
          assert _panel_filing_metrics(facts,accn,'10-Q')[0]['value'] == 123
          try:
              _panel_submission('https://attacker.example/not-a-sec-document')
              raise AssertionError('must reject non-SEC archive link')
          except ValueError:
              pass
          from backend.providers.sec_filings import _panel_form4_from_xml, enrich_form4_filing
          from unittest.mock import patch
          from io import BytesIO
          rsu_xml = """
          <ownershipDocument><reportingOwner><reportingOwnerId><rptOwnerName>COOK TIMOTHY D</rptOwnerName></reportingOwnerId>
          <reportingOwnerRelationship><officerTitle>Executive Chair</officerTitle></reportingOwnerRelationship></reportingOwner>
          <nonDerivativeTable>
          <nonDerivativeTransaction><transactionCoding><transactionCode>S</transactionCode></transactionCoding>
          <transactionAmounts><transactionShares><value>100</value></transactionShares>
          <transactionPricePerShare><value>200</value></transactionPricePerShare></transactionAmounts></nonDerivativeTransaction>
          </nonDerivativeTable>
          <derivativeTable>
          <derivativeTransaction><securityTitle><value>Restricted Stock Unit</value></securityTitle>
          <transactionCoding><transactionCode>A</transactionCode></transactionCoding>
          <transactionAmounts><transactionShares><value>65969</value></transactionShares>
          <transactionPricePerShare><value>0</value></transactionPricePerShare></transactionAmounts></derivativeTransaction>
          <derivativeTransaction><securityTitle><value>Restricted Stock Unit</value></securityTitle>
          <transactionCoding><transactionCode>A</transactionCode></transactionCoding>
          <transactionAmounts><transactionShares><value>65969</value></transactionShares>
          <transactionPricePerShare><value>0</value></transactionPricePerShare></transactionAmounts></derivativeTransaction>
          </derivativeTable></ownershipDocument>
          """
          parsed = _panel_form4_from_xml(rsu_xml)
          assert len(parsed['transactions']) == 3
          assert len([t for t in parsed['transactions'] if t['derivative']]) == 2
          assert all(t['security'] == 'Restricted Stock Unit' for t in parsed['transactions'][1:])
          filing = {"cik": "320193", "accession": "0001140361-26-038021",
                    "original_document_url": "https://www.sec.gov/Archives/edgar/data/320193/000114036126038021/form4.xml"}
          with patch('backend.providers.sec_filings.urllib.request.urlopen', return_value=BytesIO(rsu_xml.encode())) as request:
              enriched = enrich_form4_filing(filing, "AAPL")
              assert request.call_count == 1
          assert len(enriched['transactions']) == 1  # Common stock, no RSU double-count
          assert enriched['transactions'][0]['shares'] == '100'
          assert len(enriched['derivative_transactions']) == 2
          assert sum(int(t['shares']) for t in enriched['derivative_transactions']) == 131938
          assert '파생증권 2건' in enriched['transaction_summary']
          assert '내부자 매도 1건' in enriched['transaction_summary']
          # A derivative-only September filing must not masquerade as a cash sale.
          only_rsu = rsu_xml.split('<nonDerivativeTable>')[0] + \
              rsu_xml.split('</nonDerivativeTable>')[1]
          rsu_only_rows = _panel_form4_from_xml(only_rsu)['transactions']
          assert len(rsu_only_rows) == 2
          assert all(row['derivative'] for row in rsu_only_rows)
          assert sum(int(row['shares']) for row in rsu_only_rows) == 131938
          from backend.providers.sec_filings import fetch_company_submissions, _CACHE
          import json
          _CACHE.clear()
          with patch('backend.providers.sec_filings.urllib.request.urlopen',
                     side_effect=lambda *a, **k: BytesIO(json.dumps({'filings': {'recent': {'form': []}}}).encode())) as request:
              assert fetch_company_submissions(320193)['filings']['recent']['form'] == []
              assert fetch_company_submissions(320193)['filings']['recent']['form'] == []
              assert request.call_count == 1  # Shared JSON cache, no duplicate SEC hit.
          print('SEC_FORM4_DERIVATIVES_DEDUP_OK')
          print('SEC_EXISTING_PROVIDER_DETAILS_OK')
          PY

