name: Sidebar issue sync checks

on:
  pull_request:
    paths:
      - 'frontend/shell/left-market-sidebar/market-sidebar.js'
      - 'frontend/shell/center-chat/analysis-flow.js'
      - 'frontend/index.html'
      - 'tests/test_sidebar_issue_sync.cjs'
      - '.github/workflows/sidebar-issue-sync-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sidebar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check frontend/shell/left-market-sidebar/market-sidebar.js
          node --check frontend/shell/center-chat/analysis-flow.js
      - name: Sidebar synchronization regression tests
        run: node --test tests/test_sidebar_issue_sync.cjs
