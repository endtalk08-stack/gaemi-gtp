name: Deploy DigitalOcean issue-store fix (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY to update only the verified issue store
        required: true
        type: string
  push:
    branches:
      - ops/do-ssh-deploy-setup-20261017
    paths:
      - .github/workflows/do-worker-manual-deploy.yml

permissions:
  contents: read

concurrency:
  group: digitalocean-news-worker-deploy
  cancel-in-progress: false

jobs:
  register-manual-workflow:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Registration only; no changes to DigitalOcean."

  deploy-issue-store:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == 'DEPLOY' && github.ref == 'refs/heads/ops/do-ssh-deploy-setup-20261017'
    environment: digitalocean-news-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_USER: ${{ vars.NEWS_SSH_USER }}
      SSH_KEY: ${{ secrets.NEWS_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
      SOURCE: ops/staged_news_processed_store.py
      TARGET: /opt/gaemigtp-news/app/backend/services/news_processed_store.py
      EXPECTED_SHA256: e100d7b5e915fba19d41564b6bab9c1daae1801c35a7420b6915e6f9d0d7fda3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight exact staged code and remote SSH
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/ops/do-ssh-deploy-setup-20261017"
          test "${{ inputs.confirm_deploy }}" = "DEPLOY"
          test "$DO_HOST" = "168.144.131.211"
          test "$SSH_USER" = "gaemi-news-check"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -s "$SOURCE"
          python -m py_compile "$SOURCE"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Back up live file; abort if it changed since inspection
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$DO_HOST" \
            'sha256sum /opt/gaemigtp-news/app/backend/services/news_processed_store.py' \
            > "$RUNNER_TEMP/live.sha"
          LIVE_SHA=$(cut -d ' ' -f1 < "$RUNNER_TEMP/live.sha")
          test "$LIVE_SHA" = "$EXPECTED_SHA256" || {
            echo "::error::Live code changed since review; refusing deployment."
            exit 1
          }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$DO_HOST" \
            'cat /opt/gaemigtp-news/app/backend/services/news_processed_store.py' > "$RUNNER_TEMP/backup.py"
          test -s "$RUNNER_TEMP/backup.py"
          test "$(sha256sum "$RUNNER_TEMP/backup.py" | cut -d ' ' -f1)" = "$EXPECTED_SHA256"
      - name: Deploy only news_processed_store.py with rollback
        run: |
          set -euo pipefail
          REMOTE="$SSH_USER@$DO_HOST"
          rollback() {
            rc=$?
            trap - ERR
            set +e
            echo "::warning::Attempting restore of original worker store"
            scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$RUNNER_TEMP/backup.py" "$REMOTE:news-deploy/news_processed_store.py"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" \
              'sudo -n /usr/bin/install -m 644 /home/gaemi-news-check/news-deploy/news_processed_store.py /opt/gaemigtp-news/app/backend/services/news_processed_store.py && sudo -n /usr/bin/systemctl restart gaemigtp-news'
            exit "$rc"
          }
          trap rollback ERR
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" \
            'test -w "$HOME/news-deploy" && systemctl is-active --quiet gaemigtp-news.service'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SOURCE" "$REMOTE:news-deploy/news_processed_store.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" \
            'sudo -n /usr/bin/install -m 644 /home/gaemi-news-check/news-deploy/news_processed_store.py /opt/gaemigtp-news/app/backend/services/news_processed_store.py && sudo -n /usr/bin/systemctl restart gaemigtp-news && systemctl is-active --quiet gaemigtp-news.service'
          LOCAL_SHA=$(sha256sum "$SOURCE" | cut -d ' ' -f1)
          REMOTE_SHA=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" \
            'sha256sum /opt/gaemigtp-news/app/backend/services/news_processed_store.py | cut -d " " -f1')
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          echo "DIGITALOCEAN_ISSUE_STORE_DEPLOY_VERIFIED"
