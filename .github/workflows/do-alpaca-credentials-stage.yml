name: Stage Alpaca one-time credentials input on DigitalOcean
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths:
      - '.github/workflows/do-alpaca-credentials-stage.yml'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source hash and syntax
        run: |
          set -euo pipefail
          test "$(git hash-object ops/do-gateway/alpaca-credentials-once.sh)" = 166b014f295bc60cb6f5e25321eaad3c3037a318
          bash -n ops/do-gateway/alpaca-credentials-once.sh
          echo ALPACA_INPUT_SCRIPT_VERIFIED
      - name: Stage installer only; do not execute or affect running services
        run: |
          set -euo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12)
          ssh "${SSH_OPTS[@]}" gaemi-deploy@"$DO_HOST" 'set -e; install -d -m 0700 "$HOME/.gaemi-gateway/bootstrap"; test "$(systemctl is-active gaemigtp-news.service)" = active'
          scp "${SSH_OPTS[@]}" ops/do-gateway/alpaca-credentials-once.sh gaemi-deploy@"$DO_HOST":.gaemi-gateway/bootstrap/alpaca-credentials-once.sh
          ssh "${SSH_OPTS[@]}" gaemi-deploy@"$DO_HOST" 'set -e; p="$HOME/.gaemi-gateway/bootstrap/alpaca-credentials-once.sh"; chmod 0600 "$p"; test "$(git hash-object "$p")" = 166b014f295bc60cb6f5e25321eaad3c3037a318; bash -n "$p"; test "$(systemctl is-active gaemigtp-news.service)" = active; echo ALPACA_INPUT_SCRIPT_STAGED; echo ORIGINAL_NEWS_WORKER_ACTIVE'
