name: Micron company intro preview checks
on:
  pull_request:
    paths:
      - 'backend/services/company_intro_preview.py'
      - 'frontend/js/company-intro-preview.js'
      - 'frontend/shell/center-chat/analysis-flow.js'
      - 'frontend/index.html'
      - 'app.py'
      - 'tests/test_company_intro_preview.py'
      - 'tests/test_company_intro_preview.cjs'
      - '.github/workflows/company-intro-preview-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax checks
        run: |
          python -m py_compile backend/services/company_intro_preview.py app.py
          node --check frontend/js/company-intro-preview.js
          node --check frontend/shell/center-chat/analysis-flow.js
      - name: Read-only registry and narrative display tests
        run: |
          python -m unittest tests.test_company_intro_preview
          node --test tests/test_company_intro_preview.cjs
