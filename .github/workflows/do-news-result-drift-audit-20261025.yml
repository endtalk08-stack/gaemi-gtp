name: Verify restored US news result on DigitalOcean (read only)
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: ['.github/workflows/do-news-result-drift-audit-20261025.yml']
permissions:
  contents: read
concurrency:
  group: gaemi-digitalocean-gateway
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 7
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate installed source, unchanged rotation, and active worker (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DO_HOST:?}" "${SSH_KEY:?}" "${SSH_KNOWN_HOSTS:?}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12)
          remote="gaemi-deploy@$DO_HOST"
          ssh "${opts[@]}" "$remote" 'bash -se' <<'REMOTE'
          set -eu
          cd /opt/gaemigtp-news/app
          systemctl is-active --quiet gaemigtp-news.service
          test "$(sha256sum backend/services/news_result.py | cut -d" " -f1)" = e2a3008bb65122ff8d58375900e8d0e10177c75c113cbbc99535229a38cde74a
          test "$(sha256sum backend/news_worker.py | cut -d" " -f1)" = b1706dd0ab3200d7c3f3fbce4c086ef2266cf66e834a29aa936e2f640b85c2cd
          /opt/gaemigtp-news/venv/bin/python -m py_compile backend/services/news_result.py
          /opt/gaemigtp-news/venv/bin/python -c 'from backend.services.news_result import _us_citation_title_names_stock; from backend.services.verified_fact_headline import attach_verified_source_citations; print("LIVE_CITATION_MODULE_IMPORT_OK")'
          systemctl show gaemigtp-news.service -p ActiveState -p SubState -p NRestarts --no-pager
          echo CURRENT_LIVE_HASHES:
          sha256sum backend/services/news_result.py backend/news_worker.py
          echo RECENT_WORKER_STOCK_UPDATES:
          journalctl -u gaemigtp-news.service --since '2026-10-25 02:18:00 UTC' --no-pager -o cat | grep -E 'news-worker|analyze news funnel|news-ai|error' | tail -32 || true
          echo READ_ONLY_NEWS_REPAIR_VERIFIED
          REMOTE
