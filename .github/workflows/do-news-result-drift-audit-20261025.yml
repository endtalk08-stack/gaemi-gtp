name: Audit DO news source provenance and unchanged-cache guard (read only)
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: ['.github/workflows/do-news-result-drift-audit-20261025.yml']
permissions:
  contents: read
concurrency:
  group: gaemi-digitalocean-gateway
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Inspect live code read-only; never alter running files
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DO_HOST:?}" "${SSH_KEY:?}" "${SSH_KNOWN_HOSTS:?}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12)
          remote="gaemi-deploy@$DO_HOST"
          base=/opt/gaemigtp-news/app/backend
          ssh "${opts[@]}" "$remote" 'test "$(systemctl is-active gaemigtp-news.service)" = active && sudo -n /usr/local/sbin/gaemi-do-gateway status >/dev/null && echo AUDIT_ACCESS_OK'
          scp "${opts[@]}" "$remote:$base/services/news_processed_store.py" "$RUNNER_TEMP/store.py"
          scp "${opts[@]}" "$remote:$base/news_worker.py" "$RUNNER_TEMP/worker.py"
          scp "${opts[@]}" "$remote:$base/services/news_result.py" "$RUNNER_TEMP/result.py"
          if ssh "${opts[@]}" "$remote" "test -f $base/services/verified_fact_headline.py"; then
            scp "${opts[@]}" "$remote:$base/services/verified_fact_headline.py" "$RUNNER_TEMP/citation.py"
          fi
          python - "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import sys,hashlib,re
          tmp=Path(sys.argv[1])
          for filename in ("store.py","worker.py","result.py","citation.py"):
              f=tmp/filename
              if not f.exists():
                  print("MODULE_MISSING",filename)
                  continue
              text=f.read_text()
              print("MODULE",filename,"sha256",hashlib.sha256(f.read_bytes()).hexdigest(),"lines",len(text.splitlines()))
              lines=text.splitlines()
              anchors={
                "store.py":("def save_snapshot","def read_signature","_code_issue_briefs","_code_fact_extraction_version","_title_only_revision","def source_fingerprint"),
                "worker.py":("def process_stock","store.read_signature","store.save_snapshot","result = build_stock_news_result","if store.read_signature","_read_rotation_state"),
                "result.py":("from .verified_fact_headline","def build_stock_news_result","issue_briefs = build_issue_briefs","_title_only_revision","_code_fact_extraction_version","return {","original_body_unavailable"),
                "citation.py":("def attach_verified_source_citations","def overlay_verified_headlines"),
              }[filename]
              found=[i for i,line in enumerate(lines) if any(marker in line for marker in anchors)]
              print("ANCHORS",filename,found)
              blocks=set()
              for i in found:
                  if filename=="store.py" and "def read_signature" in lines[i]:
                      blocks.update(range(max(0,i-1),min(len(lines),i+55)))
                  elif filename=="store.py" and "def save_snapshot" in lines[i]:
                      blocks.update(range(max(0,i-1),min(len(lines),i+75)))
                  elif filename=="worker.py" and "def process_stock" in lines[i]:
                      blocks.update(range(i,min(len(lines),i+75)))
                  elif filename=="result.py" and "issue_briefs = build_issue_briefs" in lines[i]:
                      blocks.update(range(max(0,i-3),min(len(lines),i+14)))
                  elif filename=="result.py" and "_news_status" in lines[i]:
                      blocks.update(range(max(0,i-9),min(len(lines),i+3)))
                  else:
                      blocks.update(range(max(0,i-2),min(len(lines),i+3)))
              secret=re.compile(r"(?i)(password\s*=|secret\s*=|token\s*=|api[_-]?key\s*=|database[_-]?url\s*=|postgresql://|authorization:|private_key)")
              for i in sorted(blocks):
                  line=lines[i]
                  if secret.search(line):line="[REDACTED]"
                  print(f"{filename}:{i+1} {line[:205]}")
          print("READ_ONLY_INSPECTION_COMPLETE")
          PY
