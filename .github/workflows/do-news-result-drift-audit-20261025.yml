name: US news first semantic gate and issue title suffix fix
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: ['.github/workflows/do-news-result-drift-audit-20261025.yml']
permissions:
  contents: read
concurrency:
  group: gaemi-digitalocean-gateway
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 12
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout known test baseline
        uses: actions/checkout@v4
        with:
          ref: 572169449ddd85601acdb9cc3124e01ebe3a997e
          persist-credentials: false
      - name: Prepare, verify, and deploy only the approved US news changes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          remote="gaemi-deploy@$DO_HOST"
          live=/opt/gaemigtp-news/app/backend
          old="$RUNNER_TEMP/us-issue-before"
          built="$RUNNER_TEMP/us-issue-after"
          mkdir -p "$old" "$built"
          ssh_do() { ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i "$HOME/.ssh/id_ed25519" "$remote" "$@"; }
          scp_do() { scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i "$HOME/.ssh/id_ed25519" "$@"; }
          ssh_do 'test "$(systemctl is-active gaemigtp-news.service)" = active && sudo -n /usr/local/sbin/gaemi-do-gateway status >/dev/null'
          for file in services/news_result.py services/news_processed_store.py services/verified_fact_headline.py services/article_fact_keywords.py news_worker.py services/us_top20_rotation.py; do
            scp_do "$remote:$live/$file" "$old/$(basename "$file")"
          done
          python - "$old" "$built" <<'PY'
          from pathlib import Path
          import hashlib,sys
          old,built=map(Path,sys.argv[1:])
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected={
            "news_result.py":"1953f56bedafa00e600fc1dfedc26753cb1cea290dbd62b17da5561c20e324c2",
            "news_processed_store.py":"bf27a1d8a7a22ad9a172552fcbd556afaac72f3f2d861412b7d5c6b94cfc2dbb",
            "news_worker.py":"b1706dd0ab3200d7c3f3fbce4c086ef2266cf66e834a29aa936e2f640b85c2cd",
            "us_top20_rotation.py":"53b7082d2bd009867377b70c813b7bc1f1f773939a7d3c3f474859f6f6a65b65",
            "verified_fact_headline.py":"72a84d64c6c1238a134e3858993ac94dc5b811aa6f6c84eea9e4532bf25c0da5"
          }
          for name,original in expected.items():
            assert sha(old/name)==original,"LIVE_DRIFT_STOP:"+name
          result=(old/"news_result.py").read_text()
          gate='                if not central_material_brief_supported(excerpt):'
          assert result.count(gate)==1,"MATERIAL_GATE_LAYOUT_STOP"
          result=result.replace(gate,'                if market not in ("미국", "US", "us") and not central_material_brief_supported(excerpt):',1)
          marker='        # Diagnostic counts only: trace where central issues drop out without'
          assert result.count(marker)==1,"TITLE_ANCHOR_STOP"
          prefix=(
              '        # US only: drop redundant trailing issue label. Keep sources and content.\n'
              '        if market in ("미국", "US", "us"):\n'
              '            for brief in issue_briefs:\n'
              '                if isinstance(brief, dict):\n'
              '                    brief["headline"] = re.sub(r"\\s*이슈\\s*$", "", str(brief.get("headline") or "").strip()).strip()\n'
              '\n'
          )
          result=result.replace(marker,prefix+marker,1)
          version='"_code_source_revision": 12 if market in ("미국", "US", "us") else None,'
          assert result.count(version)==1,"CODE_REVISION_STOP"
          result=result.replace(version,version.replace(": 12 ",": 13 "),1)
          assert result.count("issue_count_limit")==4,"ROTATION_ISSUE_COUNT_CHANGED_STOP"
          compile(result,"news_result.py","exec")
          (built/"news_result.py").write_text(result)
          cache=(old/"news_processed_store.py").read_text()
          expected_cache='payload.get("_code_source_revision") != 12'
          assert cache.count(expected_cache)==1,"CACHE_REVISION_STOP"
          cache=cache.replace(expected_cache,'payload.get("_code_source_revision") != 13',1)
          compile(cache,"news_processed_store.py","exec")
          (built/"news_processed_store.py").write_text(cache)
          print("US_ONE_MATERIAL_TOPIC_GATE_DISABLED",flush=True)
          print("US_TRAILING_ISSUE_SUFFIX_REMOVED",flush=True)
          print("CACHE_REVISION_13",flush=True)
          print("US_TOP20_ROTATION_UNCHANGED",flush=True)
          PY
          cp "$built/news_result.py" backend/services/news_result.py
          cp "$built/news_processed_store.py" backend/services/news_processed_store.py
          cp "$old/verified_fact_headline.py" backend/services/verified_fact_headline.py
          cp "$old/article_fact_keywords.py" backend/services/article_fact_keywords.py
          python -m py_compile backend/services/news_result.py backend/services/news_processed_store.py
          python -m unittest -q tests.test_news_central_selection tests.test_us_top20_rotation
          python - <<'PY'
          from pathlib import Path
          a=Path("backend/services/news_result.py").read_text()
          b=Path("backend/services/news_processed_store.py").read_text()
          assert 'if market not in ("미국", "US", "us") and not central_material_brief_supported(excerpt):' in a
          assert 'brief["headline"] = re.sub(r"\\s*이슈\\s*$"' in a
          assert '"_code_source_revision": 13 if market' in a
          assert 'payload.get("_code_source_revision") != 13' in b
          from backend.services.us_top20_rotation import TOP_N
          assert TOP_N==20
          print("REGRESSION_TESTS_PASSED",flush=True)
          PY
          ssh_do 'bash -se' <<'REMOTE'
          set -eu
          cd /opt/gaemigtp-news/app/backend
          test "$(systemctl is-active gaemigtp-news.service)" = active
          test "$(sha256sum services/news_result.py | cut -d" " -f1)" = 1953f56bedafa00e600fc1dfedc26753cb1cea290dbd62b17da5561c20e324c2
          test "$(sha256sum services/news_processed_store.py | cut -d" " -f1)" = bf27a1d8a7a22ad9a172552fcbd556afaac72f3f2d861412b7d5c6b94cfc2dbb
          test "$(sha256sum news_worker.py | cut -d" " -f1)" = b1706dd0ab3200d7c3f3fbce4c086ef2266cf66e834a29aa936e2f640b85c2cd
          test "$(sha256sum services/us_top20_rotation.py | cut -d" " -f1)" = 53b7082d2bd009867377b70c813b7bc1f1f773939a7d3c3f474859f6f6a65b65
          REMOTE
          changed=0
          deploy_file() {
            local src="$1" dest="$2" hash
            hash="$(git hash-object -- "$src")"
            scp_do "$src" "$remote:.gaemi-gateway/payload"
            ssh_do sudo -n /usr/local/sbin/gaemi-do-gateway deploy "$dest" "$hash"
          }
          rollback() {
            local rc="$1"
            trap - ERR
            if (( changed )); then
              echo "ROLLBACK_BEGIN"
              deploy_file "$old/news_result.py" backend/services/news_result.py || true
              deploy_file "$old/news_processed_store.py" backend/services/news_processed_store.py || true
              ssh_do sudo -n /usr/local/sbin/gaemi-do-gateway restart gaemigtp-news.service || true
              echo "ROLLBACK_ATTEMPTED"
            fi
            exit "$rc"
          }
          trap 'rollback $?' ERR
          changed=1
          deploy_file "$built/news_result.py" backend/services/news_result.py
          deploy_file "$built/news_processed_store.py" backend/services/news_processed_store.py
          ssh_do 'bash -se' <<'REMOTE'
          set -eu
          cd /opt/gaemigtp-news/app
          /opt/gaemigtp-news/venv/bin/python -m py_compile backend/services/news_result.py backend/services/news_processed_store.py
          /opt/gaemigtp-news/venv/bin/python -c 'from backend.services.news_result import build_stock_news_result; print("US_NEWS_CODE_IMPORT_OK")'
          REMOTE
          ssh_do sudo -n /usr/local/sbin/gaemi-do-gateway restart gaemigtp-news.service
          ssh_do 'test "$(systemctl is-active gaemigtp-news.service)" = active && echo US_NEWS_WORKER_ACTIVE'
          for file in news_result.py news_processed_store.py; do
            actual="$(ssh_do sha256sum "$live/services/$file" | cut -d' ' -f1)"
            expected="$(sha256sum "$built/$file" | cut -d' ' -f1)"
            test "$actual" = "$expected"
            echo "LIVE_VERIFIED_SHA256 $file $actual"
          done
          changed=0
          trap - ERR
          echo "US_MATERIAL_GATE_AND_TITLE_APPLIED"
