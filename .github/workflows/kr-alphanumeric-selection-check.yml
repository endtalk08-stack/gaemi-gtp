name: KR alphanumeric stock selection checks
on:
  push:
    branches: [main]
    paths:
      - backend/services/market_rankings.py
      - backend/services/engine.py
      - backend/services/ai_test.py
      - app.py
      - tests/test_market_selection_context.py
      - .github/workflows/kr-alphanumeric-selection-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check only changed Python modules
        run: python -m py_compile backend/services/market_rankings.py backend/services/engine.py backend/services/ai_test.py app.py tests/test_market_selection_context.py
      - name: Verify KR stock selection and unchanged market menus
        run: |
          python -m unittest -v tests.test_market_selection_context
          # The existing trading-value fixtures share a module-level
          # short-failure cache. Isolate each case so fixture order cannot
          # contaminate the next case; do not change production cache behavior.
          python - <<'PY' > /tmp/kr-market-test-cases.txt
          import unittest
          from tests.test_market_trading_value import MarketTradingValueTests
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(MarketTradingValueTests)
          for case in suite:
              print(case.id())
          PY
          while IFS= read -r test_case; do
            python -m unittest -v "$test_case"
          done < /tmp/kr-market-test-cases.txt
          python -m unittest -v tests.test_kr_quote_parsing
      - name: Confirm public Render health without bypassing private login
        run: |
          python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request(
              "https://gaemi-gtp.onrender.com/health",
              headers={"User-Agent":"gaemi-public-health-check/1.0"})
          with urllib.request.urlopen(req, timeout=45) as response:
              health=json.load(response)
          assert health.get("ok") is True
          print("RENDER_PUBLIC_HEALTH_PASS")
          PY
