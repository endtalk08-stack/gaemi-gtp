name: KR alphanumeric stock selection checks
on:
  push:
    branches: [main]
    paths:
      - backend/services/market_rankings.py
      - backend/services/engine.py
      - backend/services/ai_test.py
      - app.py
      - tests/test_market_selection_context.py
      - .github/workflows/kr-alphanumeric-selection-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check only changed Python modules
        run: python -m py_compile backend/services/market_rankings.py backend/services/engine.py backend/services/ai_test.py app.py tests/test_market_selection_context.py
      - name: Verify KR stock selection and unchanged market menus
        run: |
          python -m unittest -v tests.test_market_selection_context
          # The existing trading-value fixtures share a module-level
          # short-failure cache. Isolate each case so fixture order cannot
          # contaminate the next case; do not change production cache behavior.
          python - <<'PY' > /tmp/kr-market-test-cases.txt
          import unittest
          from tests.test_market_trading_value import MarketTradingValueTests
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(MarketTradingValueTests)
          for case in suite:
              print(case.id())
          PY
          while IFS= read -r test_case; do
            python -m unittest -v "$test_case"
          done < /tmp/kr-market-test-cases.txt
          python -m unittest -v tests.test_kr_quote_parsing
      - name: Read-only live Elice click route smoke (no AI)
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          base = "https://gaemi-gtp.onrender.com"
          def read_json(path, timeout=45):
              req = urllib.request.Request(base + path, headers={"User-Agent": "gaemi-kr-code-smoke/1.0"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.load(response)
          last_error = None
          for attempt in range(3):
              try:
                  listing = read_json("/market/popular?market=kr")
                  stocks = listing.get("items") or []
                  match = next((row for row in stocks if str(row.get("symbol","")).upper()=="0158S0"),None)
                  if not match:
                      print("LIVE_ELICE_NOT_CURRENTLY_IN_POPULAR_LIST")
                      break
                  assert match["name"] == "엘리스", match
                  query=urllib.parse.urlencode({"stock":match["name"],"market":"kr",
                        "menu":"popular","symbol":match["symbol"]})
                  result=read_json("/analyze?"+query,timeout=90)
                  titles=[row.get("title") for row in result.get("sections") or []]
                  current=(result.get("price_snapshot") or {}).get("current")
                  print("LIVE_ELICE_RESULT",json.dumps({
                      "attempt":attempt+1,"section_titles":titles[:3],
                      "price":current,"ok":result.get("ok",True),
                  },ensure_ascii=False))
                  if "종목을 찾을 수 없습니다." in titles:
                      raise RuntimeError("live_kr_selection_not_found")
                  if not current or float(current)<=0:
                      raise RuntimeError("live_kr_quote_not_available")
                  print("LIVE_ELICE_QUOTE_ROUTE_PASS")
                  break
              except Exception as exc:
                  last_error=exc
                  print("LIVE_ELICE_PROBE_RETRY",type(exc).__name__,str(exc)[:130])
                  if attempt<2:
                      time.sleep(10)
          else:
              raise RuntimeError("Live Elice quote route did not succeed") from last_error
          PY
