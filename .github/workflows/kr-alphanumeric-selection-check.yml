name: Safe source-removal and disclosure isolation checks
on:
  push:
    branches: [main, cleanup/remove-unused-feeds-20261029]
    paths:
      - app.py
      - backend/services/engine.py
      - backend/services/market_rankings.py
      - backend/services/stock_analysis.py
      - backend/services/private_access.py
      - backend/services/disclosure_ranked_universe.py
      - backend/providers/market_price.py
      - backend/providers/market_industry.py
      - frontend/index.html
      - frontend/shell/right-panel/right-panel-tabs.js
      - tests/test_market_selection_context.py
      - tests/test_market_trading_value.py
      - tests/test_market_industry.py
      - tests/test_disclosure_ranked_universe.py
      - tests/test_dynamic_stock_identity.py
      - .github/workflows/kr-alphanumeric-selection-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check updated sources compile
        run: |
          python -m py_compile app.py backend/services/engine.py backend/services/market_rankings.py backend/services/stock_analysis.py backend/services/private_access.py backend/services/disclosure_ranked_universe.py backend/providers/market_price.py backend/providers/market_industry.py
      - name: Guard US value and domestic news/disclosure after removals
        run: |
          python -m unittest -v tests.test_market_selection_context tests.test_market_trading_value tests.test_market_industry tests.test_disclosure_ranked_universe tests.test_disclosure_transfer tests.test_render_disclosure_separation
      - name: Verify retained US stock identity without deleted ranking enrichers
        run: python -m unittest -v tests.test_dynamic_stock_identity
      - name: Verify surviving disclosure and panel JavaScript
        run: |
          node --check frontend/shell/right-panel/right-panel-tabs.js
          node --check frontend/shell/left-market-sidebar/market-sidebar.js
          node --test tests/*.cjs tests/*.js

  baseline-main-js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70ccd7dc4849e7344cc40452a9b1ea3aa6cf4fad
          persist-credentials: false
      - name: Run complete offline JS regressions from unchanged main
        run: node --test tests/*.cjs tests/*.js
