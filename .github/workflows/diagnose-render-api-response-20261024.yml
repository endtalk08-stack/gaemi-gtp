name: Diagnose Render public API response shape
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-render-api-response-20261024.yml]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print non-sensitive HTTP response metadata for public API routes
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse
          base='https://gaemi-gtp.onrender.com'
          for path,params in [
              ('/market/trading-value',{'market':'us'}),
              ('/analyze',{'stock':'마이크론 테크놀로지','market':'us','menu':'value','symbol':'MU'}),
              ('/',{})]:
              url=base+path+('?' + urllib.parse.urlencode(params) if params else '')
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      data=r.read(512)
                      print('ENDPOINT',path,'status',r.status,'content-type',r.headers.get('Content-Type'),
                            'final-path',urllib.parse.urlparse(r.url).path,'first200',repr(data[:200].decode('utf-8','replace')),flush=True)
              except Exception as e:
                  print('ENDPOINT',path,'error',type(e).__name__,str(e)[:160],flush=True)
          PY
