name: Inspect source-verification funnel after title-only patch
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/inspect-verified-title-selection-20261024.yml]
permissions:
  contents: read
jobs:
  inspect:
    environment: digitalocean-news-worker
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Inspect live worker's public news-selection metrics only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh -o ConnectTimeout=12 -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" "gaemi-deploy@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/gaemigtp-news/app
          echo WORKER_STATUS
          systemctl is-active gaemigtp-news.service
          echo SOURCE_VERIFICATION_METRICS
          journalctl -u gaemigtp-news.service --since '16 minutes ago' --no-pager -o cat 2>/dev/null |
          grep -E '\[analyze news trace\]|\[news detail\]|\[analyze news funnel\]|\[news-ai\]' |
          sed -E 's,https?://[^ ]+,URL_REDACTED,g' | tail -n 160 || true
          echo METRICS_FINISHED
          REMOTE
