name: Deploy US CODE cited KR-style issues once
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/do-us-code-citation-repair-once-20261024.yml]
permissions:
  contents: read
concurrency:
  group: do-us-code-citation-repair-20261024
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 12
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test KR US shared code and verified source regression
        run: |
          set -euo pipefail
          python -m py_compile backend/services/news_result.py backend/services/verified_fact_headline.py ops/staged_news_processed_store.py
          python -m unittest discover -s tests -p test_verified_fact_headline_only.py -v
          python -m unittest discover -s tests -p test_us_kr_shared_code_selection.py -v
          python -m unittest discover -s tests -p test_news_feed_queries.py -v
          python - <<'PY'
          from pathlib import Path
          source=Path('backend/services/news_result.py').read_text()
          store=Path('ops/staged_news_processed_store.py').read_text()
          ai=Path('ops/staged_ai_sequential_batch.py').read_text()
          assert '_us_dated_code_fallback' not in source and 'fallback_source' not in source
          assert '"_code_source_revision": 3' in source
          assert 'payload.get("_code_source_revision") != 3' in store
          assert 'select_stock_news_for_analysis(raw_news_list, stock_name, limit)' in source
          assert '"articles": raw,' in ai and 'GAEMIGTP_NEWS_AI_PAUSED' in ai
          print('KR_US_SOURCE_AND_AI_ISOLATION_VERIFIED')
          PY
      - name: Read-only compare installed worker against exact prior files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i "$HOME/.ssh/id_ed25519")
          old=d3c5cefe31fa3c9e44fe6c8559df3ff84600d4e4
          before_result="$(git show "$old":backend/services/news_result.py | sha256sum | cut -d' ' -f1)"
          before_sources="$(git show "$old":backend/services/verified_fact_headline.py | sha256sum | cut -d' ' -f1)"
          before_store="$(git show "$old":ops/staged_news_processed_store.py | sha256sum | cut -d' ' -f1)"
          ssh "${opts[@]}" "gaemi-deploy@$DO_HOST" bash -s "$before_result" "$before_sources" "$before_store" <<'REMOTE'
          set -euo pipefail
          cd /opt/gaemigtp-news/app
          test "$(systemctl is-active gaemigtp-news.service)" = active
          result="$(sha256sum backend/services/news_result.py | cut -d' ' -f1)"
          source="$(sha256sum backend/services/verified_fact_headline.py | cut -d' ' -f1)"
          store="$(sha256sum backend/services/news_processed_store.py | cut -d' ' -f1)"
          test "$result" = "$1" || { echo US_CODE_RESULT_BASELINE_MISMATCH; exit 1; }
          test "$source" = "$2" || { echo US_CODE_CITATION_BASELINE_MISMATCH; exit 1; }
          test "$store" = "$3" || { echo US_CODE_STORE_BASELINE_MISMATCH; exit 1; }
          test -w backend/services/news_result.py
          test -w backend/services/verified_fact_headline.py
          test -w backend/services/news_processed_store.py
          test -d ops
          echo US_CODE_BASELINE_CONFIRMED
          REMOTE
      - name: Upload only three US CODE source revisions
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i "$HOME/.ssh/id_ed25519")
          remote="gaemi-deploy@$DO_HOST:/opt/gaemigtp-news/app/ops"
          scp "${opts[@]}" backend/services/verified_fact_headline.py "$remote/.us-code-next-citations.py"
          scp "${opts[@]}" backend/services/news_result.py "$remote/.us-code-next-result.py"
          scp "${opts[@]}" ops/staged_news_processed_store.py "$remote/.us-code-next-store.py"
      - name: Install three files atomically with backup rollback and restart news worker
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i "$HOME/.ssh/id_ed25519" "gaemi-deploy@$DO_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/gaemigtp-news/app
          files=(backend/services/verified_fact_headline.py backend/services/news_result.py backend/services/news_processed_store.py)
          staged=(ops/.us-code-next-citations.py ops/.us-code-next-result.py ops/.us-code-next-store.py)
          backup="$(mktemp -d ops/.us-code-citation-backup.XXXXXX)"
          for f in "${files[@]}"; do cp -p "$f" "$backup/$(basename "$f")"; done
          rollback() {
            trap - ERR
            set +e
            for f in "${files[@]}"; do install -m 644 "$backup/$(basename "$f")" "$f"; done
            sudo -n /usr/bin/systemctl restart gaemigtp-news.service
            echo US_CODE_CITATION_ROLLED_BACK
            exit 1
          }
          trap rollback ERR
          for i in "${!files[@]}"; do install -m 644 "${staged[$i]}" "${files[$i]}"; done
          /opt/gaemigtp-news/venv/bin/python -m py_compile "${files[@]}"
          ! grep -Fq '_us_dated_code_fallback' backend/services/news_result.py
          ! grep -Fq 'fallback_source' backend/services/news_result.py
          test "$(grep -c 'payload.get("_code_source_revision") != 3' backend/services/news_processed_store.py)" = 1
          sudo -n /usr/bin/systemctl restart gaemigtp-news.service
          test "$(systemctl is-active gaemigtp-news.service)" = active
          trap - ERR
          echo US_CODE_VERIFIED_ORIGINAL_REV3_DEPLOYED_AI_UNCHANGED
          REMOTE
      - name: Delete temporary SSH credential
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
