name: Verify code-only visible issue feed
on:
  push:
    branches: [fix/issue-code-only-no-ai-fallback-20261024]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test default CODE-only, preserved AI, and existing news contracts
        run: |
          set -euo pipefail
          python -m py_compile backend/services/news_freshness.py backend/services/news_result.py backend/services/market_issue_headlines.py
          python -m unittest discover -s tests -p 'test_us_news_freshness.py' -v
          python -m unittest discover -s tests -p 'test_market_issue_headlines.py' -v
          python -m unittest discover -s tests -p 'test_dual_issue_mode.py' -v
          python -m unittest discover -s tests -p 'test_us_stock_news_identity.py' -v
