name: Stage approved US-close selection on DigitalOcean
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/stage-us-close-selection-20261020.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b1569841aa5f222f246ed187af50239efb53e4c
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8ca38916ce7a0261ba95d6738e0ba05bb6fdef37
          path: scoped-helper
          persist-credentials: false
      - name: Validate exact approved standalone module
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object backend/services/us_market_close.py)" = 6407e8137f4cde96b491aa47e2544a6a1a7214c9
          test "$(git -C scoped-helper hash-object ops/us-close-refresh-once-20261020.sh)" = 4419a21d977d219624a64158c02c5e549310d4c3
          bash -n scoped-helper/ops/us-close-refresh-once-20261020.sh
          python -m py_compile backend/services/us_market_close.py
          python - <<'PY'
          from backend.services import us_market_close as c
          assert c.QUERY == "뉴욕증시 마감"
          assert c.KST.key == "Asia/Seoul"
          assert c.MODEL == "openai/gpt-oss-120b"
          print("US_CLOSE_APPROVED_SOURCE_VALID")
          PY
      - name: Stage code to deploy home without any production writes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12)
          ssh "${SSH_OPTS[@]}" gaemi-deploy@"$DO_HOST" 'set -eu; umask 077; mkdir -p "$HOME/.gaemi-us-close-20261020"; chmod 700 "$HOME/.gaemi-us-close-20261020"; test "$(systemctl is-active gaemigtp-news.service)" = active'
          scp "${SSH_OPTS[@]}" backend/services/us_market_close.py gaemi-deploy@"$DO_HOST":.gaemi-us-close-20261020/us_market_close.py
          scp "${SSH_OPTS[@]}" scoped-helper/ops/us-close-refresh-once-20261020.sh gaemi-deploy@"$DO_HOST":.gaemi-us-close-20261020/refresh-once.sh
          ssh "${SSH_OPTS[@]}" gaemi-deploy@"$DO_HOST" 'set -eu; chmod 600 "$HOME/.gaemi-us-close-20261020/us_market_close.py" "$HOME/.gaemi-us-close-20261020/refresh-once.sh"; test "$(git hash-object "$HOME/.gaemi-us-close-20261020/us_market_close.py")" = 6407e8137f4cde96b491aa47e2544a6a1a7214c9; test "$(git hash-object "$HOME/.gaemi-us-close-20261020/refresh-once.sh")" = 4419a21d977d219624a64158c02c5e549310d4c3; echo "US_CLOSE_SOURCE_STAGED_VERIFIED"; test "$(systemctl is-active gaemigtp-news.service)" = active; echo "ORIGINAL_WORKER_STILL_ACTIVE"'
