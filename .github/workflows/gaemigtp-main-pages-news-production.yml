name: gaemigtp-main Pages deployment

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'functions/**'
      - 'tests/**'
      - 'scripts/pages/**'
      - '.github/workflows/gaemigtp-main-pages-news-production.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'functions/**'
      - 'tests/**'
      - 'scripts/pages/**'
      - '.github/workflows/gaemigtp-main-pages-news-production.yml'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy this main commit to production (pushes to main deploy automatically)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gaemigtp-main-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every local frontend asset and Pages Function route
        run: node scripts/pages/verify-pages-inputs.mjs
      - name: Check out the production baseline for drift verification
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: production-baseline
      - name: Verify current production assets against the production baseline
        if: github.event_name == 'pull_request'
        working-directory: production-baseline
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/pages/verify-pages-deployment.mjs "https://gaemigtp-main.pages.dev"
      - name: Verify portable widget lifecycle
        run: |
          npm install --prefix "$RUNNER_TEMP/widget-validation" jsdom@27.2.0 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/widget-validation/node_modules" node --test tests/test_portable_widgets.cjs tests/test_market_indicators.cjs tests/test_workspace_state.cjs tests/test_chat_stock_name_route.cjs tests/test_news_widget_ai_tab.cjs tests/test_news_ai_function.mjs
      - name: Build Pages Functions from repository root
        run: npx --yes wrangler@4.167.0 pages functions build functions --project-directory . --outdir "$RUNNER_TEMP/pages-functions"
      - name: Preserve critical application checks
        run: |
          test -s frontend/index.html
          test -s functions/market/us-daily-chart.js
          test -s functions/stocks/us/instruments.json.js
          grep -Fq '오늘 미국 상승 테마 뭐야?' frontend/index.html
          grep -Fq '전일 대비 거래량 폭증한 미국 종목 알려줘' frontend/index.html
          grep -Fq '52주 신고가 신저가 종목 알려줘' frontend/index.html
          grep -Eq 'market-sidebar\.js\?v=[^"]+' frontend/index.html
          grep -Fq 'aria-label="메인 화면"' frontend/index.html
          test "$(grep -Fc 'absolute left-1/2 top-1/2 z-10 -translate-x-1/2 -translate-y-1/2' frontend/index.html)" -eq 2
          grep -Fq 'News</span>' frontend/index.html
          grep -Fq '>Chat</button>' frontend/index.html
          node --check frontend/shell/right-panel/right-panel-tabs.js
          node --check frontend/shell/left-market-sidebar/market-sidebar.js
          node --check frontend/shell/center-chat/widget-dock/widget-dock.js
          node --check frontend/widgets/market-indicators/market-indicators-widget.js
          node --test tests/test_sidebar_issue_sync.cjs
          grep -Fq 'const renderIndustryMap = (data) =>' frontend/shell/left-market-sidebar/market-sidebar.js
          grep -Fq 'industry-map-sector' frontend/shell/left-market-sidebar/market-sidebar.js
          grep -Fq 'industry-map-stock' frontend/shell/left-market-sidebar/market-sidebar.js
          grep -Fq 'grid-template-columns: minmax(0, 1fr)' frontend/shell/left-market-sidebar/market-sidebar.css
          grep -Fq 'grid-template-columns: repeat(3, minmax(0, 1fr))' frontend/shell/left-market-sidebar/market-sidebar.css
          ! grep -Fq 'industry-map-stock-rank' frontend/shell/left-market-sidebar/market-sidebar.js
          ! grep -Fq 'rank.textContent' frontend/shell/left-market-sidebar/market-sidebar.js
          grep -Fq '.industry-map-sector.is-up' frontend/shell/left-market-sidebar/market-sidebar.css
          grep -Fq '.industry-map-sector.is-down' frontend/shell/left-market-sidebar/market-sidebar.css
          grep -Fq '.industry-map-stock.is-up' frontend/shell/left-market-sidebar/market-sidebar.css
          grep -Fq '.industry-map-stock.is-down' frontend/shell/left-market-sidebar/market-sidebar.css
          grep -Fq 'wss://quotes.gaemigtp.com/ws/us-live-quotes' frontend/shell/left-market-sidebar/market-sidebar.js
          grep -Fq "window.addEventListener('gaemi:qqq-quote', onQqqQuote)" frontend/shell/center-chat/widget-dock/widget-dock.js
          ! grep -Fq 'data-panel-workspace-view="news"' frontend/shell/right-panel/right-panel-tabs.js
          ! grep -Fq 'renderTradingViewNewsPage' frontend/shell/right-panel/right-panel-tabs.js
          grep -Fq 'data-panel-workspace-view="disclosures"' frontend/shell/right-panel/right-panel-tabs.js
          grep -q 'right-panel-tabs.js?v=20261114-detach-right-news-v1' frontend/index.html

  # Pull requests only: a preview URL for people to open (Cloudflare Access
  # login). It never gates production; main deploys straight after validate.
  preview:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare one immutable deployment artifact
        run: |
          deploy_dir="$RUNNER_TEMP/gaemigtp-pages-deploy"
          rm -rf "$deploy_dir"
          mkdir -p "$deploy_dir"
          cp -a frontend functions "$deploy_dir/"
          diff -qr frontend "$deploy_dir/frontend"
          diff -qr functions "$deploy_dir/functions"
      - name: Deploy the candidate to the existing Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          npm_config_yes: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: 6cf7450897a598809db421965a07304b
          wranglerVersion: "4.167.0"
          workingDirectory: "${{ runner.temp }}/gaemigtp-pages-deploy"
          command: >-
            pages deploy frontend --project-name gaemigtp-main
            --branch pr-${{ github.event.pull_request.number }}
            --commit-hash ${{ github.sha }}
      - name: Detect preview Access protection and verify deployed assets
        id: preview_check
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set +e
          status="$(curl -sSL --max-redirs 5 --max-time 20 -H 'Cache-Control: no-cache' "$DEPLOYMENT_URL/" -o "$RUNNER_TEMP/preview-index.html" -w '%{http_code}')"
          curl_status=$?
          set -e
          if [ "$curl_status" -ne 0 ]; then
            echo "::error::Could not retrieve the Pages preview response."
            exit 1
          fi
          if grep -Eqi 'Cloudflare Access|cloudflareaccess\.com|cf-access' "$RUNNER_TEMP/preview-index.html"; then
            echo "protected=true" >> "$GITHUB_OUTPUT"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Preview deployed, but Cloudflare Access blocks anonymous asset verification. Manual inspection is required."
          elif [ "$status" != "200" ]; then
            echo "::error::Preview returned HTTP $status."
            exit 1
          else
            node scripts/pages/verify-pages-deployment.mjs "$DEPLOYMENT_URL"
            echo "verified=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify preview Pages Functions and existing R2 binding
        if: steps.preview_check.outputs.protected != 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl -fsS --retry 3 --max-time 20 "$DEPLOYMENT_URL/market/qqq-reason" |
            jq -e '.ok == true and (.items | type == "array")'
          curl -fsS --retry 3 --max-time 20 "$DEPLOYMENT_URL/stocks/us/instruments.json" |
            jq -e '.ok == true and ([.items[] | select((.symbol == "NVDA" or .symbol == "WMT") and (.industry | length > 0))] | length) == 2'
          curl -fsS --retry 3 --max-time 20 "$DEPLOYMENT_URL/market/us-daily-chart?symbol=NVDA" |
            jq -e '.ok == true and .symbol == "NVDA" and (.rows | length > 0)'
          curl -fsS --retry 3 --max-time 20 "$DEPLOYMENT_URL/market/indicators" |
            jq -e '.ok == true and ([.items[].id] | sort) == ["dxy","us-10y","us-2y","vix","wti"]'
      - name: Publish preview URL and verification scope
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ACCESS_PROTECTED: ${{ steps.preview_check.outputs.protected }}
        run: |
          echo "[Open the Pages preview]($DEPLOYMENT_URL)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ACCESS_PROTECTED" = "true" ]; then
            echo "Preview is behind Cloudflare Access: open it while signed in with an allowed account." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verified: frontend assets, Pages Functions, instrument metadata, and R2-backed NVDA daily chart." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Post the preview link on the pull request
        if: always() && steps.deploy.outputs.deployment-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -f body="미리보기: $DEPLOYMENT_URL (커밋 ${GITHUB_SHA::7}, Cloudflare 로그인 필요 · 실제 사이트에는 main에 합칠 때만 배포)" > /dev/null

  production:
    needs: validate
    # A push to main deploys automatically, as before 2026-11-27. The manual
    # run remains available for redeploying main. Every production deploy is
    # verified byte-for-byte and through Pages Functions below.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: gaemigtp-main-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare the deployment files from this commit
        run: |
          deploy_dir="$RUNNER_TEMP/gaemigtp-pages-deploy"
          rm -rf "$deploy_dir"
          mkdir -p "$deploy_dir"
          cp -a frontend functions "$deploy_dir/"
          test -s "$deploy_dir/frontend/index.html"
          test -d "$deploy_dir/functions"
      - name: Deploy this main commit to production
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          npm_config_yes: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: 6cf7450897a598809db421965a07304b
          wranglerVersion: "4.167.0"
          workingDirectory: "${{ runner.temp }}/gaemigtp-pages-deploy"
          command: pages deploy frontend --project-name gaemigtp-main --branch main --commit-hash ${{ github.sha }}
      - name: Verify every production asset byte-for-byte
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/pages/verify-pages-deployment.mjs "https://gaemigtp-main.pages.dev"
      - name: Verify production Pages Functions and existing R2 binding
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash scripts/pages/verify-pages-functions.sh "https://gaemigtp-main.pages.dev"
