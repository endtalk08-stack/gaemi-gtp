name: Publish refreshed US close after one-time admin grant
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/us-close-run-20261020.signal]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Execute only the narrowly authorized one-time helper
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 gaemi-deploy@"$DO_HOST" 'set -e; test "$(systemctl is-active gaemigtp-news.service)" = active; sudo -n /usr/local/sbin/gaemi-us-close-refresh-20261020'
