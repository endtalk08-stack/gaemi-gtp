name: Apply minimal US CODE issue preservation to DO
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: ['.github/workflows/do-us-code-preserve-minimal-20261026.yml']
permissions:
  contents: read
jobs:
  deploy:
    environment: digitalocean-news-worker
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/do-preserve-existing-code-issues-20261026
          persist-credentials: false
      - name: Run only the three requested offline preservation tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_staged_ai_code_preservation.py' -v
          python3 - <<'PY'
          from pathlib import Path
          source=Path('ops/staged_news_processed_store.py').read_text()
          anchor='                normalized = _prefer_same_day_ai(normalized, previous_payload,\n                                                  stock_name, day)\n'
          end='            # US display is AI-only'
          assert source.count(anchor)==1 and source.count(end)==1
          snippet=source.split(anchor,1)[1].split(end,1)[0]
          assert 'previous_code = (previous_payload or {}).get("_code_issue_briefs") or []' in snippet
          assert 'normalized["_code_issue_briefs"] = kept' in snippet
          assert snippet.count('normalized["_code_issue_briefs"] = kept')==1
          assert len(snippet.splitlines()) < 35
          Path('/tmp/gaemi-preserve-code-snippet.txt').write_text(snippet)
          print('TESTED_CODE_SNIPPET_VERIFIED')
          PY
      - name: Minimal guarded update with rollback and health check
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          opts=(-o ConnectTimeout=12 -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519")
          remote="gaemi-deploy@$DO_HOST"
          ssh "${opts[@]}" "$remote" 'bash -se' <<'PREFLIGHT'
          set -euo pipefail
          cd /opt/gaemigtp-news/app
          test "$(systemctl is-active gaemigtp-news.service)" = active
          test -w backend/services/news_processed_store.py
          test -w ops/
          current="$(sha256sum backend/services/news_processed_store.py | cut -d' ' -f1)"
          expected="878c658c84072dd9046464ae6b8bf67174a69f6da5ad84fb7b2cdded72163618"
          test "$current" = "$expected" || { echo "LIVE_SOURCE_CHANGED_ABORT_NO_WRITES"; exit 2; }
          echo "LIVE_STORE_BASELINE_VERIFIED"
          PREFLIGHT
          scp "${opts[@]}" /tmp/gaemi-preserve-code-snippet.txt "$remote:/opt/gaemigtp-news/app/ops/.us-code-preserve-insert.next"
          ssh "${opts[@]}" "$remote" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/gaemigtp-news/app
          source_file=backend/services/news_processed_store.py
          original="878c658c84072dd9046464ae6b8bf67174a69f6da5ad84fb7b2cdded72163618"
          test "$(sha256sum "$source_file" | cut -d' ' -f1)" = "$original" || { echo "LIVE_SOURCE_CHANGED_ABORT"; exit 2; }
          backup="$(mktemp ./ops/.us-code-preserve-backup.XXXXXX)"
          cp -p "$source_file" "$backup"
          applied=0
          rollback() {
            if test "$applied" = 1; then
              cp -p "$backup" "$source_file"
              sudo -n /usr/bin/systemctl restart gaemigtp-news.service || true
              echo "US_CODE_PRESERVE_ROLLED_BACK"
            fi
          }
          trap rollback ERR
          python3 - <<'PY'
          import ast,hashlib
          from pathlib import Path
          original="878c658c84072dd9046464ae6b8bf67174a69f6da5ad84fb7b2cdded72163618"
          source_file=Path('backend/services/news_processed_store.py')
          source=source_file.read_text()
          assert hashlib.sha256(source_file.read_bytes()).hexdigest()==original
          anchor='                normalized = _prefer_same_day_ai(normalized, previous_payload,\n                                                  stock_name, day)\n'
          snippet=Path('ops/.us-code-preserve-insert.next').read_text()
          assert source.count(anchor)==1
          assert 'previous_code = (previous_payload or {}).get("_code_issue_briefs") or []' in snippet
          assert 'normalized["_code_issue_briefs"] = kept' in snippet
          assert 'previous_code = (previous_payload or {}).get("_code_issue_briefs")' not in source
          amended=source.replace(anchor,anchor+snippet,1)
          ast.parse(amended)
          Path('ops/.us-code-preserve-store.next').write_text(amended)
          print("MINIMAL_PATCH_AST_VALID")
          PY
          /opt/gaemigtp-news/venv/bin/python -m py_compile ops/.us-code-preserve-store.next
          install -m 644 ops/.us-code-preserve-store.next "$source_file"
          applied=1
          /opt/gaemigtp-news/venv/bin/python -m py_compile "$source_file"
          /opt/gaemigtp-news/venv/bin/python -c 'import backend.news_worker; print("WORKER_IMPORT_VALID")'
          sudo -n /usr/bin/systemctl restart gaemigtp-news.service
          sleep 6
          test "$(systemctl is-active gaemigtp-news.service)" = active
          /opt/gaemigtp-news/venv/bin/python -c 'from backend.services import news_processed_store as s; import inspect; v=inspect.getsource(s.save_snapshot); assert "previous_code = (previous_payload or {})" in v; print("CODE_ISSUE_PRESERVE_LOADED")'
          trap - ERR
          echo "US_CODE_PRESERVE_DEPLOYED"
          sha256sum "$source_file"
          rm -f ops/.us-code-preserve-insert.next ops/.us-code-preserve-store.next
          systemctl show gaemigtp-news.service -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager
          REMOTE
