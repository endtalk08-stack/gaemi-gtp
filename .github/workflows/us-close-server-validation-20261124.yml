name: Validate server-owned US regular close hold

on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths:
      - 'backend/kiwoom_us_top20_api.py'
      - 'tests/test_us_close_server_transition.py'
      - '.github/workflows/us-close-server-validation-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile modified server modules
        run: |
          python -m py_compile backend/kiwoom_us_top20_api.py backend/us_quote_change.py backend/kiwoom_us_live_prices.py
      - name: Validate 30-minute close, cross-restart storage and market responses
        run: |
          python -m unittest discover -s tests -p 'test_us_close_server_transition.py' -v
      - name: Verify previous trading-day baseline handling
        run: |
          python -m unittest discover -s tests -p 'test_previous_trading_day.py' -v
