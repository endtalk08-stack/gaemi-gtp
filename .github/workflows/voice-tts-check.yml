name: Korean cloned voice TTS checks
on:
  pull_request:
    paths:
      - backend/services/voice_tts.py
      - frontend/js/voice-avatar.js
      - tests/test_voice_tts.py
      - .github/workflows/voice-tts-check.yml
  push:
    paths:
      - backend/services/voice_tts.py
      - frontend/js/voice-avatar.js
      - tests/test_voice_tts.py
jobs:
  voice-tts-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install flask msgpack
      - name: No-cost Korean voice tests
        run: python -m unittest discover -s tests -p 'test_voice_tts.py' -v
      - name: Validate Javascript syntax
        run: node --check frontend/js/voice-avatar.js
      - name: Validate Python syntax
        run: python -m py_compile backend/services/voice_tts.py app.py
