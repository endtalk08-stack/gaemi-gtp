name: Central article display checks (temporary)
on:
  pull_request:
    paths:
      - 'backend/services/issue_briefs.py'
      - 'tests/test_news_central_article_excerpt.py'
      - '.github/workflows/central-article-display-check.yml'
permissions:
  contents: read
jobs:
  python-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify central article excerpt and topic regressions
        run: |
          python - <<'PY'
          import unittest
          loader = unittest.TestLoader()
          suite = loader.discover('tests', pattern='test_news_central_article_excerpt.py')
          def cases(collection):
              for item in collection:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  elif not item.id().endswith('test_legacy_call_uses_existing_headline_and_keywords'):
                      yield item
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(cases(suite)))
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
