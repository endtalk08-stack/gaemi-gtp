name: Wabble one-time isolated news test
on:
  push:
    branches: [main]
    paths: [.github/workflows/wabble-one-shot-test.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WABBLE_API_KEY: ${{ secrets.WABBLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public stock news sample (one API credit)
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get("WABBLE_API_KEY","").strip()
          if not key:
              raise SystemExit("MISSING_WABBLE_API_KEY_SECRET")
          url = "https://wabble.news/v1/news?categories=stocks&limit=20"
          req = urllib.request.Request(url,headers={"Authorization":"Bearer "+key,"Accept":"application/json","User-Agent":"gaemi-isolated-news-test/1"})
          try:
              with urllib.request.urlopen(req,timeout=20) as res:
                  data=json.load(res)
                  print("HTTP_STATUS:",res.status)
          except urllib.error.HTTPError as e:
              print("HTTP_STATUS:",e.code)
              raise SystemExit("WABBLE_REQUEST_FAILED")
          records = data.get("news") or data.get("data") or data.get("articles") or data.get("items") or []
          if isinstance(records,dict):
              records = records.get("news") or records.get("items") or records.get("articles") or []
          print("RESPONSE_FIELDS:",",".join(sorted(data.keys())))
          print("ITEM_COUNT:",len(records) if isinstance(records,list) else "unknown")
          if isinstance(records,list):
              for row in records[:10]:
                  if not isinstance(row,dict): continue
                  print("STORY_FIELDS:",",".join(sorted(row.keys())))
                  print("TEXT_FIELD_LENGTHS:",json.dumps({k:len(v) for k,v in row.items() if isinstance(v,str) and k not in ("id","imageUrl")},ensure_ascii=False))
          else:
              print("UNEXPECTED_DATA_SHAPE:",str(type(records).__name__))

          if isinstance(records,list):
              for row in records[:20]:
                  if not isinstance(row,dict): continue
                  print("NEWS_SAMPLE:",json.dumps({k:str(row.get(k,""))[:350] for k in ("title","headline","excerpt","summary","published_at","categories","importance") if row.get(k) is not None},ensure_ascii=False))
          PY

      - name: Compare enrichment and individual story safely
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          key=os.getenv("WABBLE_API_KEY","").strip()
          if not key: raise SystemExit("MISSING_WABBLE_API_KEY_SECRET")
          def get(path):
              req=urllib.request.Request("https://wabble.news"+path,headers={"Authorization":"Bearer "+key,"Accept":"application/json","User-Agent":"gaemi-isolated-news-test/1"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      return response.status,json.load(response)
              except urllib.error.HTTPError as exc:
                  return exc.code,{}
          status,data=get("/v1/news?categories=stocks&limit=10&include=enrichment")
          print("ENRICHED_STATUS:",status)
          if status!=200:
              print("ENRICHMENT_NOT_SUPPORTED_OR_REQUEST_ERROR:",status)
              data={}
          rows=data.get("data") or data.get("news") or data.get("items") or data.get("articles") or []
          if isinstance(rows,dict): rows=rows.get("items") or rows.get("news") or []
          print("ENRICHED_COUNT:",len(rows) if isinstance(rows,list) else "unknown")
          report={"status":status,"count":len(rows) if isinstance(rows,list) else 0,"samples":[]}

          if not isinstance(rows,list): rows=[]
          if not rows:
              print("NO_ENRICHED_NEWS_RETURNED")
              fallback_status,fallback=get("/v1/news?categories=stocks&limit=2")
              print("DETAIL_FALLBACK_LIST_STATUS:",fallback_status)
              if fallback_status==200:
                  rows=fallback.get("data") or fallback.get("news") or fallback.get("items") or fallback.get("articles") or []
                  if isinstance(rows,dict): rows=rows.get("items") or rows.get("news") or []
                  if not isinstance(rows,list): rows=[]

          for i,item in enumerate(rows[:10]):
              if not isinstance(item,dict): continue
              report["samples"].append({"headline":str(item.get("headline") or item.get("title") or "")[:180],"excerpt_length":len(str(item.get("excerpt") or "")),"fields":sorted(item.keys()),"enrichment_present":bool(item.get("enrichment"))})
              enrichment=item.get("enrichment")
              if isinstance(enrichment,dict):
                  report["samples"][-1]["enrichment"]=enrichment
              elif isinstance(enrichment,list):
                  report["samples"][-1]["enrichment"]=enrichment[:10]
              print("ENRICHMENT_SAMPLE:",json.dumps({"headline":report["samples"][-1]["headline"],"enrichment":report["samples"][-1].get("enrichment")},ensure_ascii=False,default=str)[:1600])
              print("ROW:",json.dumps(report["samples"][-1],ensure_ascii=False)[:2000])
          first=next((item for item in rows if isinstance(item,dict) and item.get("id")),None)
          if not first:
              report["detail_status"]="no_story_ids"
              print("NO_STORY_IDS")
          else:
              status,detail=get("/v1/news/"+urllib.parse.quote(str(first["id"]),safe=""))
              story=detail.get("data") or detail.get("news") or detail.get("story") or detail
              if isinstance(story,list): story=story[0] if story else {}
              if not isinstance(story,dict): story={}
              report["detail_status"]=status
              report["detail_fields"]=sorted(story.keys())
              report["detail_excerpt_length"]=len(str(story.get("excerpt") or ""))
              print("DETAIL_STATUS:",status)
              print("DETAIL_FIELDS:",sorted(story.keys()))
              print("DETAIL_TEXT_LENGTHS:",json.dumps({k:len(v) for k,v in story.items() if isinstance(v,str) and k not in ("id","imageUrl")},ensure_ascii=False))
              print("DETAIL_ENRICHMENT:",json.dumps(story.get("enrichment"),ensure_ascii=False,default=str)[:1200])
          os.makedirs("deploy/status",exist_ok=True)
          with open("deploy/status/wabble-test.json","w",encoding="utf-8") as out: json.dump(report,out,ensure_ascii=False,indent=2)
          PY
      - name: Count Nvidia stock news in the last 24 hours
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,datetime
          from datetime import timezone,timedelta
          key=os.environ["WABBLE_API_KEY"]
          now=datetime.datetime.now(timezone.utc)
          begin=now-timedelta(hours=24)
          found={}
          counts={}
          for term in ("Nvidia","NVDA"):
              args={"categories":"stocks","q":term,"limit":100}
              url="https://wabble.news/v1/news?"+urllib.parse.urlencode(args)
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+key,"User-Agent":"gaemi-isolated-news-test/1","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      data=json.load(resp)
              except urllib.error.HTTPError as exc:
                  print("NVDA_SEARCH_HTTP_ERROR",term,exc.code)
                  counts[term]="http_"+str(exc.code)
                  continue
              rows=data.get("data") or []
              counts[term]={"returned":len(rows),"next_cursor":bool(data.get("next_cursor"))}
              for row in rows:
                  if isinstance(row,dict) and row.get("id"):
                      millis=row.get("publishedAt")
                      if not isinstance(millis,(int,float)) or not (begin.timestamp()*1000<=millis<=now.timestamp()*1000):continue
                      found[row["id"]]={"headline":row.get("headline"),"publishedAt":row.get("publishedAt"),"excerptLength":len(row.get("excerpt") or "")}
              print("SEARCH",term,"COUNT",len(rows),"MORE_PAGES",bool(data.get("next_cursor")))
          report={"window_start":begin.isoformat(),"window_end":now.isoformat(),"queries":counts,"unique_count":len(found),"items":list(found.values())}
          os.makedirs("deploy/status",exist_ok=True)
          with open("deploy/status/wabble-nvda-24h.json","w") as fp:json.dump(report,fp,ensure_ascii=False,indent=2)
          print("NVDA_24H_UNIQUE_COUNT",len(found))
          for item in list(found.values())[:30]:print("NVDA_NEWS_TITLE",item["headline"])
          PY
      - name: Save sanitized results for verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/status/wabble-test.json deploy/status/wabble-nvda-24h.json
          if ! git diff --cached --quiet; then
            git commit -m "Record isolated Wabble API test summary"
            git push
          fi
