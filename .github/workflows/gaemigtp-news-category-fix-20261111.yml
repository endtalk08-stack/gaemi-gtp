name: Restore news page before major-news carousel (preview then production)
on:
  push:
    branches: [fix/tradingview-earnings-guidance-exclusive-20261111]
    paths: [.github/workflows/gaemigtp-news-category-fix-20261111.yml]
permissions:
  contents: read
concurrency:
  group: gaemigtp-news-category-fix-20261111
  cancel-in-progress: false
jobs:
  news-category-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact prior production and validate only carousel changed
        run: |
          set -euo pipefail
          mkdir -p _news-deploy-site
          curl -fsSL --retry 3 --max-time 25 'https://fd295125.gaemigtp-news.pages.dev/' -o _news-deploy-site/index.html
          curl -fsSL --retry 3 --max-time 25 'https://gaemigtp-news.pages.dev/' -o /tmp/current-news.html
          python - <<'PY'
          from pathlib import Path
          import re
          old=Path('_news-deploy-site/index.html').read_text(encoding='utf-8')
          now=Path('/tmp/current-news.html').read_text(encoding='utf-8')
          assert 'id="highlightsSection"' in now and 'id="highlightsSection"' not in old, 'unexpected prior/current carousel state'
          for marker in ('id="categoryTabs"','id="newsList"','NEWS_R2_URL','function openDetail(', 'Only the primary stock category'):
              assert marker in old and marker in now, 'baseline or current missing '+marker
          assert now.count('/* Major news carousel:')==1, 'carousel CSS marker drift'
          assert now.count('<section class="hl-section" id="highlightsSection"')==1, 'carousel HTML marker drift'
          assert now.count('// Highlights derive only from the existing R2 items;')==1, 'carousel JS marker drift'
          # Reverse the four narrowly scoped insertions and require byte-for-byte equality
          restored=now
          restored=re.sub(r'/\* Major news carousel:.*?(?=</style>)','',restored,count=1,flags=re.S)
          restored=re.sub(r'\n<section class="hl-section" id="highlightsSection".*?</section>\n','',restored,count=1,flags=re.S)
          restored=restored.replace('news.forEach((n,i)=>n._index=i);\n  renderHighlights();','news.forEach((n,i)=>n._index=i);',1)
          restored=re.sub(r'\n// Highlights derive only from the existing R2 items;.*?(?=</script>)','',restored,count=1,flags=re.S)
          assert restored==old, 'CURRENT_PRODUCTION_HAS_OTHER_CHANGES: refusing rollback'
          print('EXACT_PRE_CAROUSEL_PRODUCTION_MATCH_CONFIRMED',len(old))
          PY
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('_news-deploy-site/index.html','utf8');
          const a=s.lastIndexOf('<script>'),b=s.lastIndexOf('</script>');
          if(a<0||b<=a) throw Error('missing script');
          new Function(s.slice(a+8,b));
          if(s.includes('id="highlightsSection"'))throw Error('carousel remains');
          console.log('PREVIOUS_NEWS_SCRIPT_VALID');
          NODE
      - name: Preview existing Pages project, no new site
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6cf7450897a598809db421965a07304b
          command: pages deploy _news-deploy-site --project-name gaemigtp-news --branch news-highlights-rollback-20261114
      - name: Verify preview markup and R2 route
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          curl -fsSL --retry 4 --max-time 20 "$PREVIEW_URL/" -o /tmp/rollback-preview.html
          cmp _news-deploy-site/index.html /tmp/rollback-preview.html
          ! grep -Fq 'id="highlightsSection"' /tmp/rollback-preview.html
          curl -fsSL --retry 4 --max-time 20 "$PREVIEW_URL/news/latest.json" | python -c 'import sys,json;d=json.load(sys.stdin);assert d.get("ok") is True and isinstance(d.get("items"),list);print("PREVIEW_R2_OK",len(d["items"]))'
      - name: Restore existing production Pages project
        id: production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6cf7450897a598809db421965a07304b
          command: pages deploy _news-deploy-site --project-name gaemigtp-news --branch ops/do-ssh-deploy-setup-20261017
      - name: Verify restored production HTML and R2
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 3 --max-time 20 'https://gaemigtp-news.pages.dev/?rollback=20261114' -o /tmp/rollback-production.html
          cmp _news-deploy-site/index.html /tmp/rollback-production.html
          ! grep -Fq 'id="highlightsSection"' /tmp/rollback-production.html
          curl -fsSL --retry 6 --max-time 20 'https://gaemigtp-news.pages.dev/news/latest.json' | python -c 'import sys,json;d=json.load(sys.stdin);assert d.get("ok") is True and isinstance(d.get("items"),list);print("PRODUCTION_R2_OK",len(d["items"]))'
