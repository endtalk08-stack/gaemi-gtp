name: Isolated disclosure collector recovery

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/disclosures-do-stage.yml'
      - 'deploy/disclosures/run_disclosures.py'
      - 'backend/services/disclosure_transfer.py'
      - 'backend/services/engine.py'
      - 'backend/providers/sec_filings.py'

permissions:
  contents: read

jobs:
  recover-disclosures:
    # Only the deliberately named internal repair branch may touch the host.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/disclosures-normalize-do-neon-render-20261020' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: digitalocean-news-worker
    env:
      DO_HOST: ${{ secrets.DO_HOST || vars.DO_HOST }}
      DO_SSH_USER: ${{ secrets.DO_SSH_USER || vars.DO_SSH_USER }}
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
      TRANSFER_DB_URL: ${{ secrets.NEWS_DATABASE_URL }}
      TRANSFER_DART_KEY: ${{ secrets.OPENDART_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - name: Validate dedicated credentials without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in DO_HOST DO_SSH_USER DO_SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS TRANSFER_DB_URL TRANSFER_DART_KEY; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
      - name: Prepare strict SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Stage only isolated disclosure files
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$DO_SSH_USER@$DO_HOST" \
            'umask 077; mkdir -p "$HOME/.gaemi-disclosures/stage"; chmod 700 "$HOME/.gaemi-disclosures" "$HOME/.gaemi-disclosures/stage"; test -d /opt/gaemigtp-news/app/backend; test "$(systemctl is-active gaemigtp-news.service)" = active'
          for path in \
            'backend/services/engine.py:engine.py' \
            'backend/providers/sec_filings.py:sec_filings.py' \
            'backend/services/disclosure_transfer.py:disclosure_transfer.py' \
            'deploy/disclosures/run_disclosures.py:run_disclosures.py'; do
            source_file="${path%%:*}"
            dest_file="${path#*:}"
            scp -o BatchMode=yes -o StrictHostKeyChecking=yes "$source_file" \
              "$DO_SSH_USER@$DO_HOST:.gaemi-disclosures/stage/$dest_file"
          done
      - name: Safely transfer dedicated disclosure credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          credential_file="$(mktemp)"
          trap 'rm -f "$credential_file"' EXIT
          export DISCLOSURE_LOCAL_CREDENTIAL_FILE="$credential_file"
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = Path(os.environ["DISCLOSURE_LOCAL_CREDENTIAL_FILE"])
          target.write_text(json.dumps({
              "NEWS_DATABASE_URL": os.environ["TRANSFER_DB_URL"],
              "OPENDART_API_KEY": os.environ["TRANSFER_DART_KEY"],
          }), encoding="utf-8")
          target.chmod(0o600)
          PY
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes "$credential_file" \
            "$DO_SSH_USER@$DO_HOST:.gaemi-disclosures/credentials.json"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DO_SSH_USER@$DO_HOST" \
            'chmod 600 "$HOME/.gaemi-disclosures/credentials.json" "$HOME/.gaemi-disclosures/stage/"*.py'
      - name: Validate isolated sync before scheduling
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$DO_SSH_USER@$DO_HOST" \
            'set -eu; cd /opt/gaemigtp-news/app; /opt/gaemigtp-news/venv/bin/python -m py_compile "$HOME/.gaemi-disclosures/stage/"*.py; timeout 160s /opt/gaemigtp-news/venv/bin/python "$HOME/.gaemi-disclosures/stage/run_disclosures.py"; test "$(systemctl is-active gaemigtp-news.service)" = active'
      - name: Install 30-minute disclosure-only cron after successful sync
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DO_SSH_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -eu
          command -v crontab >/dev/null
          command -v flock >/dev/null
          mkdir -p "$HOME/.gaemi-disclosures"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          (crontab -l 2>/dev/null || true) | grep -v '# GAEMIGTP_DISCLOSURE_SYNC_V1' > "$tmp" || true
          printf '%s\n' '*/30 * * * * /usr/bin/flock -n "$HOME/.gaemi-disclosures/run.lock" /opt/gaemigtp-news/venv/bin/python "$HOME/.gaemi-disclosures/stage/run_disclosures.py" >> "$HOME/.gaemi-disclosures/collector.log" 2>&1 # GAEMIGTP_DISCLOSURE_SYNC_V1' >> "$tmp"
          crontab "$tmp"
          crontab -l | grep -q 'GAEMIGTP_DISCLOSURE_SYNC_V1'
          echo DISCLOSURE_SCHEDULE_INSTALLED_30_MINUTES
          test "$(systemctl is-active gaemigtp-news.service)" = active
          REMOTE
