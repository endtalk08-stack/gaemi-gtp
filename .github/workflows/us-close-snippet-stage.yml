name: Stage updated US-close snippet collector and check secret wiring
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/us-close-snippet-stage.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
      A: ${{ secrets.NAVER_CLIENT_ID }}
      B: ${{ secrets.NAVER_CLIENT_SECRET }}
      C: ${{ secrets.NEWS_NAVER_CLIENT_ID }}
      D: ${{ secrets.NEWS_NAVER_CLIENT_SECRET }}
      E: ${{ secrets.NCP_NAVER_CLIENT_ID }}
      F: ${{ secrets.NCP_NAVER_CLIENT_SECRET }}
      G: ${{ secrets.NAVER_API_KEY_ID }}
      H: ${{ secrets.NAVER_API_KEY_SECRET }}
      GROQ: ${{ secrets.GROQ_API_KEY }}
      DB: ${{ secrets.NEWS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0fb123d5638da19d1ddfb1e718b03b1fb095945
          persist-credentials: false
      - name: Offline syntax and regression tests
        run: |
          python -m py_compile backend/services/us_market_close.py backend/us_market_close_job.py
          python -m unittest -q tests.test_us_market_close
      - name: Stage in private directory (do not alter active US-close service)
        shell: bash
        run: |
          set -euo pipefail
          for key in A B C D E F G H GROQ DB; do
            if [ -n "${!key}" ]; then echo "USCRED_PRESENT $key"; else echo "USCRED_MISSING $key"; fi
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=12 gaemi-deploy@"$DO_HOST"             'set -eu; umask 077; mkdir -p "$HOME/.gaemi-us-close-snippet-test"; chmod 700 "$HOME/.gaemi-us-close-snippet-test"'
          scp -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=12             backend/services/us_market_close.py gaemi-deploy@"$DO_HOST":.gaemi-us-close-snippet-test/us_market_close.py
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=12 gaemi-deploy@"$DO_HOST"             'set -eu; chmod 600 "$HOME/.gaemi-us-close-snippet-test/us_market_close.py"; /opt/gaemigtp-news/venv/bin/python -m py_compile "$HOME/.gaemi-us-close-snippet-test/us_market_close.py"; test "$(systemctl is-active gaemigtp-news.service)" = active; echo US_CLOSE_NEW_SOURCE_STAGED_SAFE'
