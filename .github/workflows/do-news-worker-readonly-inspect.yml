name: Inspect existing DO news worker (read only)
on:
  push:
    branches: [audit/do-live-issue-store-20261026]
    paths: ['.github/workflows/do-news-worker-readonly-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_SSH_USER: ${{ vars.NEWS_SSH_USER }}
      DO_SSH_PRIVATE_KEY: ${{ secrets.NEWS_SSH_KEY }}
      DO_SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate and inspect using the previously successful news-check SSH route
        shell: bash
        run: |
          set -euo pipefail
          for v in DO_HOST DO_SSH_USER DO_SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS; do
            test -n "${!v}" || { echo "MISSING: $v"; exit 1; }
          done
          test "$DO_SSH_USER" = gaemi-news-check || { echo "UNEXPECTED SSH USER"; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$DO_SSH_USER@$DO_HOST" 'bash -se' <<'REMOTE'
          set -eu
          echo "WHOAMI:"; id -un
          echo "ACTIVE:"; systemctl is-active gaemigtp-news.service
          echo "SERVICE_PROPERTIES:"
          systemctl show gaemigtp-news.service -p WorkingDirectory -p User -p ExecStart | sed -E 's/([A-Z_]*(KEY|TOKEN|PASSWORD|SECRET)[A-Z_]*)=[^ ;}]+/\1=<redacted>/g'
          echo "AVAILABLE_SUDO_COMMANDS:"
          sudo -n -l 2>&1 | sed -E 's/([A-Z_]*(KEY|TOKEN|PASSWORD|SECRET)[A-Z_]*)=[^ ;}]+/\1=<redacted>/g' | head -35 || true
          echo "WORKER_SOURCE_SELECTION:"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/opt/gaemigtp-news/app/backend/news_worker.py')
          if not p.is_file(): raise SystemExit('WORKER_FILE_MISSING')
          lines=p.read_text(encoding='utf-8').splitlines()
          print('worker_lines=',len(lines))
          for n,line in enumerate(lines,1):
              if any(x in line.upper() for x in ('SECRET','API_KEY','PASSWORD','TOKEN','DATABASE_URL','PRIVATE_KEY','BEARER')):
                  print(f'{n:03d}: [redacted config line]')
              else:
                  print(f'{n:03d}: {line[:260]}')
          PY
          echo "WORKER_SERVICE_SOURCE:"
          systemctl cat gaemigtp-news.service | grep -Ev '(SECRET|TOKEN|PASSWORD|KEY|DATABASE_URL)' | head -90
          echo "RELATED_TIMERS:"
          systemctl list-timers --all --no-pager 2>/dev/null | grep -i -E 'news|gaemigtp' | head -25 || true
          echo "PERMISSIONS:"
          stat -c '%A %U:%G %n' /opt/gaemigtp-news/app/backend/news_worker.py /opt/gaemigtp-news/app/backend/services/news_result.py /opt/gaemigtp-news/app/backend/services/news_freshness.py /opt/gaemigtp-news/app/backend/ /opt/gaemigtp-news/app/backend/services/ 2>&1 || true
          echo "NEWS_RESULT_WORKER_LIVE:"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/opt/gaemigtp-news/app/backend/services/news_result.py')
          t=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(t,1):
              if any(s in line for s in ('limit=storyboard_limit','accepted_articles, limit=','len(storyboard_news_items) >= storyboard_limit','candidate_news.extend','def build_stock_news_result','def get_shared_stock_news_result','limit=max(1, len(rows))')):
                  print(i,line.strip()[:220])
          print('news_result_lines',len(t))
          p=Path('/opt/gaemigtp-news/app/backend/services/news_freshness.py')
          if p.is_file():
              t=p.read_text(encoding='utf-8').splitlines()
              for i,line in enumerate(t,1):
                  if 'return fresh[:3]' in line or 'issue_briefs' in line and 'selected[:' in line: print('freshness',i,line.strip())
          PY
          echo "LIVE_STORE_SOURCE_AUDIT:"
          python3 - <<'PY'
          from pathlib import Path
          import ast, hashlib, re
          p=Path('/opt/gaemigtp-news/app/backend/services/news_processed_store.py')
          if not p.is_file(): raise SystemExit('LIVE_STORE_FILE_MISSING')
          raw=p.read_bytes()
          lines=raw.decode('utf-8').splitlines()
          print('LIVE_STORE_LINES=',len(lines),'SHA256=',hashlib.sha256(raw).hexdigest())
          tree=ast.parse(raw.decode('utf-8'))
          relevant={'read_signature','save_snapshot','_same_stock_issue_briefs','_recent_existing_issue_briefs','_fresh_ai_briefs','_prefer_same_day_ai','purge_expired'}
          for node in tree.body:
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in relevant:
                  print('BEGIN_FN',node.name,node.lineno,node.end_lineno)
                  for no in range(node.lineno,node.end_lineno+1):
                      value=lines[no-1]
                      if re.search(r'(?i)(password|private_key|secret|api_key|bearer)',value):
                          value='[redacted sensitive line]'
                      print(str(no)+':'+value[:260])
                  print('END_FN',node.name)
          PY
          echo "SUDO_DETAILS:"
          ls -ld /home/gaemi-news-check /home/gaemi-deploy /opt/gaemigtp-news/app /opt/gaemigtp-news/app/backend 2>/dev/null || true
          echo "OTHER_DEPLOY_CHANNEL_AVAILABILITY:"
          echo "DEPLOY_WRITE_CAPABILITIES:"
          for f in /opt/gaemigtp-news/app/backend /opt/gaemigtp-news/app/backend/news_worker.py /opt/gaemigtp-news/app/backend/services /opt/gaemigtp-news/app/backend/services/news_result.py /var/lib/gaemigtp-news /opt/gaemigtp-news/app; do
            if test -w "$f"; then echo "writable $f"; else echo "not-writable $f"; fi
          done
          echo "ORIGINAL_SOURCE_FINGERPRINT:"
          sha256sum /opt/gaemigtp-news/app/backend/news_worker.py /opt/gaemigtp-news/app/backend/services/news_result.py
          echo "READ_ONLY_INSPECTION_COMPLETE"
          REMOTE
