name: gaemigtp-main industry names 14px preview

on:
  push:
    branches:
      - ops/gaemigtp-industry-labels-14px-preview-20261124
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify CSS labels and unchanged app logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('frontend/shell/left-market-sidebar/market-sidebar.css').read_text()
          html = Path('frontend/index.html').read_text()
          for selector in ('.industry-map-sector-name', '.industry-map-stock-name'):
              import re
              matches = re.findall(re.escape(selector) + r'\s*\{([^}]+)\}', css)
              assert len(matches) == 2, (selector, matches)
              assert all('font-size: 14px;' in match for match in matches), selector
          for selector in ('.industry-map-sector-change', '.industry-map-stock-change'):
              import re
              assert re.search(re.escape(selector) + r'\s*\{[^}]*font-size: 15px;', css)
          assert 'market-sidebar.css?v=20261124-industry-names-14px-v1' in html
          assert '.industry-map-sector.is-up, .industry-map-stock.is-up { background-color: #302126; }' in css
          assert '.industry-map-sector.is-down, .industry-map-stock.is-down { background-color: #1c2434; }' in css
          print('Industry name typography validated')
          PY
          node --check frontend/shell/left-market-sidebar/market-sidebar.js
          node --test tests/test_sidebar_issue_sync.cjs
          test -s functions/market/us-daily-chart.js
      - name: Deploy existing Pages preview with Functions
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          npm_config_yes: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: 6cf7450897a598809db421965a07304b
          command: pages deploy frontend --project-name gaemigtp-main --branch industry-names-14px-preview-20261124
      - name: Confirm preview deployment URL
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          case "$PREVIEW_URL" in
            https://*.gaemigtp-main.pages.dev) echo "Preview deployed: $PREVIEW_URL" ;;
            *) echo "::error::No valid preview URL"; exit 1 ;;
          esac
          echo "[Open Pages preview]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
