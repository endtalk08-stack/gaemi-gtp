name: Alpaca NVDA-only read-only probe tests
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths:
      - 'backend/alpaca_probe.py'
      - 'tests/test_alpaca_probe.py'
      - '.github/workflows/alpaca-probe-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests/test_alpaca_probe.py -v
