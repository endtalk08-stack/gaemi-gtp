name: Validate Render sidebar read-only cleanup
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/check-render-sidebar-tests.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm worker-only sidebar and no legacy fallback
        run: |
          python -m unittest discover -s tests -p 'test_market_issue_headlines.py' -v
          python -m py_compile backend/services/market_issue_headlines.py
          test ! -e backend/services/news_processed_results_store.py
          echo RENDER_DUPLICATE_ISSUE_STORE_REMOVED
