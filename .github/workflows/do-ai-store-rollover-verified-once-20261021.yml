name: One-time verified US AI 24h store rollover
on:
  push:
    branches: [ops/do-ssh-deploy-setup-20261017]
    paths: [.github/workflows/do-ai-store-rollover-verified-once-20261021.yml]
permissions:
  contents: read
concurrency:
  group: gaemi-ai-store-rollover-once
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.head_commit.message == 'RUN_VERIFIED_AI_24H_STORE_FIX_20261021'
    runs-on: ubuntu-latest
    environment: digitalocean-news-worker
    timeout-minutes: 9
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      SSH_KEY: ${{ secrets.NEWS_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.NEWS_SSH_KNOWN_HOSTS }}
      OLD_BLOB: 4a1427ea1bed3cfcaa1bb3dedf7f8cedb0fb4809
      NEW_BLOB: 1af0fcfde8a0edcdd9eb2d669ff33c672801649d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact source and offline regressions before SSH
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ops/staged_news_processed_store.py)" = "$NEW_BLOB"
          python3 -m py_compile ops/staged_news_processed_store.py
          python3 -m unittest discover -s tests -p 'test_staged_ai_*.py' -q
          python3 -m unittest discover -s tests -p 'test_ai_issue_priority_no_code_gate.py' -q
          python3 -m unittest discover -s tests -p 'test_staged_daily_*.py' -q
          python3 -m unittest discover -s tests -p 'test_staged_issue_*.py' -q
          echo OFFLINE_VALIDATION_PASSED
      - name: Stage source and verify original worker file before write
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DO_HOST" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12)
          remote="gaemi-deploy@$DO_HOST"
          ssh "${opts[@]}" "$remote" 'install -d -m 700 "$HOME/.gaemi-ai-store-rollover-20261021"'
          scp "${opts[@]}" ops/staged_news_processed_store.py "$remote":.gaemi-ai-store-rollover-20261021/new-store.py
          ssh "${opts[@]}" "$remote" "OLD_BLOB=$OLD_BLOB NEW_BLOB=$NEW_BLOB bash -s" <<'REMOTE'
          set -euo pipefail
          source_file="$HOME/.gaemi-ai-store-rollover-20261021/new-store.py"
          target=/opt/gaemigtp-news/app/backend/services/news_processed_store.py
          test -f "$target" && test ! -L "$target" && test -w "$target"
          test "$(git hash-object -- "$source_file")" = "$NEW_BLOB"
          test "$(git hash-object -- "$target")" = "$OLD_BLOB" || {
            echo AI_STORE_ORIGINAL_DRIFT_ABORT
            exit 1
          }
          test "$(stat -c %u "$target")" = "$(id -u)" || {
            echo AI_STORE_OWNERSHIP_MISMATCH_ABORT
            exit 1
          }
          test "$(systemctl is-active gaemigtp-news.service)" = active
          /opt/gaemigtp-news/venv/bin/python -m py_compile "$source_file"
          echo LIVE_STORE_PRECONDITIONS_PASSED
          REMOTE
      - name: Install only existing processed store with rollback and verify
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12)
          ssh "${opts[@]}" "gaemi-deploy@$DO_HOST" "OLD_BLOB=$OLD_BLOB NEW_BLOB=$NEW_BLOB bash -s" <<'REMOTE'
          set -Eeuo pipefail
          source_file="$HOME/.gaemi-ai-store-rollover-20261021/new-store.py"
          target=/opt/gaemigtp-news/app/backend/services/news_processed_store.py
          work="$HOME/.gaemi-ai-store-rollover-20261021"
          test -f "$target" && test ! -L "$target" && test -w "$target"
          test "$(git hash-object -- "$target")" = "$OLD_BLOB" || {
            echo AI_STORE_ORIGINAL_CHANGED_ABORT
            exit 1
          }
          test "$(git hash-object -- "$source_file")" = "$NEW_BLOB"
          test "$(stat -c %u "$target")" = "$(id -u)"
          test "$(systemctl is-active gaemigtp-news.service)" = active
          mode="$(stat -c %a "$target")"
          backup="$(mktemp "$work/original-store.XXXXXXXX.py")"
          cp -p "$target" "$backup"
          test "$(git hash-object -- "$backup")" = "$OLD_BLOB"
          rollback() {
            rc=$?
            trap - ERR
            echo AI_STORE_ROLLBACK_START
            cp -p "$backup" "$target" || true
            sudo -n /usr/bin/systemctl restart gaemigtp-news.service || true
            echo AI_STORE_ROLLBACK_COMPLETED
            exit "$rc"
          }
          trap rollback ERR
          install -m "$mode" "$source_file" "$target"
          test "$(git hash-object -- "$target")" = "$NEW_BLOB"
          /opt/gaemigtp-news/venv/bin/python -m py_compile "$target"
          sudo -n /usr/bin/systemctl restart gaemigtp-news.service
          test "$(systemctl is-active gaemigtp-news.service)" = active
          sleep 3
          test "$(systemctl is-active gaemigtp-news.service)" = active
          test "$(git hash-object -- "$target")" = "$NEW_BLOB"
          test "$(stat -c %u "$target")" = "$(id -u)"
          trap - ERR
          echo AI_STORE_24H_FIX_DEPLOYED
          echo AI_STORE_PREVIOUS_SOURCE_BACKED_UP
          echo NEWS_WORKER_ACTIVE
          REMOTE
