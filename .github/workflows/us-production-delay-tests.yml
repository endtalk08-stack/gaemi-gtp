name: Business material production delay tests

on:
  pull_request:
    paths:
      - 'backend/services/business_material_events.py'
      - 'tests/test_us_production_delay_event.py'
      - '.github/workflows/us-production-delay-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-material-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing business material regression tests
        run: python -m unittest discover -s tests -p 'test_business_material_events.py' -v
      - name: Confirmed postponement and rumor separation
        run: python -m unittest discover -s tests -p 'test_us_production_delay_event.py' -v
