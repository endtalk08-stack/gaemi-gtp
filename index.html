  <script>
    let activeStock = 'SK하이닉스';
    let currentChartInstance = null;

    // 🔄 뷰 전환
    function resetToHome() {
      document.getElementById('mainHeroView').classList.remove('hidden');
      closeAllSidebars();
    }

    function switchToAnalysisMode(stockName) {
      document.getElementById('mainHeroView').classList.add('hidden');
      requestStock(stockName || 'SK하이닉스');
    }

    function handleHeroSearch() {
      const val = document.getElementById('heroStockInput').value;
      switchToAnalysisMode(val || 'SK하이닉스');
    }

    function handleBottomSearch() {
      const val = document.getElementById('bottomStockInput').value;
      if (val) {
        requestStock(val);
        document.getElementById('bottomStockInput').value = '';
      }
    }

    // 드롭다운 토글
    function toggleHeroModePopup(event) {
      event.stopPropagation();
      document.getElementById('heroModePopup').classList.toggle('hidden');
    }

    function toggleBottomModePopup(event) {
      event.stopPropagation();
      document.getElementById('bottomModePopup').classList.toggle('hidden');
    }

    function selectSearchMode(modeKey, desc, target) {
      if (target === 'hero') {
        document.getElementById('heroSelectedMode').innerText = modeKey;
        ['gaemi', 'info', 'pro'].forEach(k => {
          document.getElementById(`hero-check-${k}`).classList.toggle('hidden', k !== modeKey);
        });
        document.getElementById('heroModePopup').classList.add('hidden');
      } else {
        document.getElementById('bottomSelectedMode').innerText = modeKey;
        ['gaemi', 'info', 'pro'].forEach(k => {
          document.getElementById(`bottom-check-${k}`).classList.toggle('hidden', k !== modeKey);
        });
        document.getElementById('bottomModePopup').classList.add('hidden');
      }
    }

    // 바깥 클릭 시 드롭다운 닫기
    document.addEventListener('click', () => {
      const hp = document.getElementById('heroModePopup');
      const bp = document.getElementById('bottomModePopup');
      if (hp && !hp.classList.contains('hidden')) hp.classList.add('hidden');
      if (bp && !bp.classList.contains('hidden')) bp.classList.add('hidden');
    });

    // 사이드바 제어
    function toggleLeftSidebar() {
      const leftBar = document.getElementById('leftSidebar');
      const rightBar = document.getElementById('rightSidebar');
      const backdrop = document.getElementById('sidebarBackdrop');

      rightBar.classList.add('translate-x-full');
      rightBar.classList.remove('translate-x-0');

      if (leftBar.classList.contains('-translate-x-full')) {
        leftBar.classList.remove('-translate-x-full');
        leftBar.classList.add('translate-x-0');
        backdrop.classList.remove('hidden');
      } else {
        closeAllSidebars();
      }
    }

    function toggleRightSidebar() {
      const leftBar = document.getElementById('leftSidebar');
      const rightBar = document.getElementById('rightSidebar');
      const backdrop = document.getElementById('sidebarBackdrop');

      leftBar.classList.add('-translate-x-full');
      leftBar.classList.remove('translate-x-0');

      if (rightBar.classList.contains('translate-x-full')) {
        rightBar.classList.remove('translate-x-full');
        rightBar.classList.add('translate-x-0');
        backdrop.classList.remove('hidden');
      } else {
        closeAllSidebars();
      }
    }

    function closeAllSidebars() {
      const leftBar = document.getElementById('leftSidebar');
      const rightBar = document.getElementById('rightSidebar');
      const backdrop = document.getElementById('sidebarBackdrop');

      if (leftBar) {
        leftBar.classList.add('-translate-x-full');
        leftBar.classList.remove('translate-x-0');
      }
      if (rightBar) {
        rightBar.classList.add('translate-x-full');
        rightBar.classList.remove('translate-x-0');
      }
      if (backdrop) backdrop.classList.add('hidden');
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      const themeText = document.getElementById('themeText');

      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        if (themeIcon) themeIcon.innerText = '☀️';
        if (themeText) themeText.innerText = '라이트 모드';
      } else {
        htmlEl.classList.add('dark');
        if (themeIcon) themeIcon.innerText = '🌙';
        if (themeText) themeText.innerText = '다크 모드';
      }
    }

    function openUpgradeModal(name) {
      document.getElementById('modalTitle').innerText = `${name} 알림/신청`;
      document.getElementById('upgradeModal').classList.remove('hidden');
    }
    function closeUpgradeModal() {
      document.getElementById('upgradeModal').classList.add('hidden');
    }

    function requestStock(stockName) {
      if (!stockName || !stockName.trim()) return;
      stockName = stockName.trim();
      activeStock = stockName;

      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = '';

      appendUserQuery(stockName);

      const loaderInfo = appendCenteredAntLoader(stockName);

      setTimeout(() => {
        if (loaderInfo.timerId) clearInterval(loaderInfo.timerId);
        const loaderEl = document.getElementById(loaderInfo.id);
        if (loaderEl) loaderEl.remove();

        startTypewriterFlow(stockName);
      }, 700);
    }

    function appendUserQuery(text) {
      const chatArea = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = "flex justify-end animate-fade";
      div.innerHTML = `<div class="bg-[#f1f5f9] dark:bg-[#27272a] text-[#0f172a] dark:text-white text-base font-bold px-5 py-3 rounded-2xl rounded-tr-none border border-[#cbd5e1] dark:border-[#3f3f46]">${text}</div>`;
      chatArea.appendChild(div);
      chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
    }

    function appendCenteredAntLoader(stockName) {
      const chatArea = document.getElementById('chatArea');
      const id = 'loader-' + Date.now();
      const div = document.createElement('div');
      div.id = id;
      div.className = "flex flex-col items-center justify-center p-8 bg-white dark:bg-[#18181b] border border-[#e2e8f0] dark:border-[#27272a] rounded-3xl my-2 animate-fade text-center shadow-sm";
      
      div.innerHTML = `
        <div class="flex items-center gap-4 mb-3">
          <div class="w-12 h-12 rounded-full bg-[#f8fafc] dark:bg-[#27272a] border border-[#cbd5e1] dark:border-[#3f3f46] flex items-center justify-center text-xl">🐜</div>
          <span class="text-[#94a3b8] dark:text-[#71717a] font-bold text-lg">×</span>
          <div class="w-12 h-12 rounded-full bg-[#0f172a] dark:bg-white text-white dark:text-black font-black flex items-center justify-center text-xl">🕶️</div>
        </div>
        <h4 class="font-bold text-base text-[#0f172a] dark:text-white">
          <span class="text-[#475569] dark:text-[#a1a1aa]">${stockName}</span> 정밀 퀀트 분석 중
        </h4>
        <p id="antStatusMsg" class="text-sm text-[#64748b] dark:text-[#a1a1aa] mt-1.5 font-medium transition-all duration-300">
          📡 나스닥 매크로 및 글로벌 지표 스캔 중...
        </p>
      `;
      chatArea.appendChild(div);
      chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });

      const messages = [
        "📡 나스닥 매크로 및 글로벌 지표 스캔 중...",
        "📰 핵심 테마 재료 및 실적 발표 일정 검증 중...",
        "📊 외인·기관 누적 수급 데이터 대조 중...",
        "💡 3인 실전 전문가 매매 시나리오 산출 중..."
      ];
      let idx = 0;
      const timerId = setInterval(() => {
        idx = (idx + 1) % messages.length;
        const textEl = document.getElementById('antStatusMsg');
        if (textEl) textEl.innerText = messages[idx];
      }, 500);

      return { id, timerId };
    }

    // 📋 [G 마크 기반 핵심 팩트 생성기]
    // 부연설명을 과감히 빼고 사진 스타일의 "굵은 2줄 결론 + 컬러 알약 태그"로 압축
    function getReportSections(stockName) {
      if (stockName === '삼성전자') {
        return [
          {
            title: "오늘 왜 올랐을까?",
            content: "차세대 HBM4 퀄테스트 통과 기대감과 함께\n기관 중심 대량 저가 매수세 유입",
            tags: ["# HBM4 퀄테스트", "# 기관순매수"]
          }
        ];
      } else if (stockName === '엔비디아' || stockName.toUpperCase() === 'NVDA') {
        return [
          {
            title: "오늘 왜 올랐을까?",
            content: "차세대 AI 칩 수요 폭발 공시와 함께\n글로벌 빅테크 투자 확대 가속화",
            tags: ["# 블랙웰수요폭증", "# 빅테크AI투자"]
          }
        ];
      } else if (stockName === '알테오젠') {
        return [
          {
            title: "오늘 왜 올랐을까?",
            content: "피하주사(SC) 플랫폼 독점 계약 확대와 함께\n외인·기관 대량 쌍끌이 매수세 유입",
            tags: ["# 플랫폼독점계약", "# 메이저쌍끌이"]
          }
        ];
      } else if (stockName === '비트코인' || stockName.toUpperCase() === 'BTC') {
        return [
          {
            title: "오늘 왜 올랐을까?",
            content: "미국 현물 ETF 기관 자금 유입과 함께\n글로벌 유동성 공급 기대감 반영",
            tags: ["# 비트코인ETF", "# 기관자금유입"]
          }
        ];
      }

      // 기본값 (SK하이닉스)
      return [
        {
          title: "오늘 왜 올랐을까?",
          content: "단일판매 공급계약 체결 공시와 함께\n외국인 대량 매수세 유입",
          tags: ["# HBM 공급계약", "# 외인순매수"]
        }
      ];
    }

    // 🚀 [G 글자 크기 극대화 + 굵고 선명한 2줄 타이포그래피 렌더링 엔진]
    function startTypewriterFlow(stockName) {
      const chatArea = document.getElementById('chatArea');
      const wrapperId = 'stream-' + Date.now();

      const mainContainer = document.createElement('div');
      mainContainer.id = wrapperId;
      mainContainer.className = "space-y-8 py-2";
      chatArea.appendChild(mainContainer);

      const sections = getReportSections(stockName);
      let secIdx = 0;

      function typeNextSection() {
        if (secIdx >= sections.length) {
          renderStrategySelectionBlock(wrapperId, stockName);
          return;
        }

        const sec = sections[secIdx];
        
        // 🌟 지름 36px(w-9 h-9) 안에 'G' 글자를 text-xl(20px font-black)로 꽉 채운 균형잡힌 배지
        const textBlock = document.createElement('div');
        textBlock.className = "relative pl-13 sm:pl-14 animate-fade";
        textBlock.innerHTML = `
          <div class="absolute left-0 top-0.5 w-9 h-9 rounded-full bg-white text-black flex items-center justify-center font-black text-xl leading-none shadow-md">G</div>
          <div class="space-y-3">
            <h3 class="font-black text-lg sm:text-xl text-white tracking-tight leading-snug">${sec.title}</h3>
            <p id="p-content-${secIdx}" class="text-lg sm:text-xl text-white font-extrabold leading-snug whitespace-pre-line typing-cursor"></p>
            <div id="tags-${secIdx}" class="flex flex-wrap gap-2 pt-2 hidden">
              ${(sec.tags || []).map(t => `<span class="bg-red-500/20 border border-red-500/30 text-red-400 font-black text-xs sm:text-sm px-3.5 py-1.5 rounded-xl shadow-sm tracking-tight">${t}</span>`).join('')}
            </div>
          </div>
        `;
        mainContainer.appendChild(textBlock);

        const pEl = document.getElementById(`p-content-${secIdx}`);
        let charIdx = 0;
        const text = sec.content;
        const chunkSize = 20;

        function typeChunk() {
          if (charIdx < text.length) {
            pEl.textContent += text.substr(charIdx, chunkSize);
            charIdx += chunkSize;
            chatArea.scrollTop = chatArea.scrollHeight;
            setTimeout(typeChunk, 6);
          } else {
            pEl.classList.remove('typing-cursor');
            const tagEl = document.getElementById(`tags-${secIdx}`);
            if (tagEl) tagEl.classList.remove('hidden');
            secIdx++;
            setTimeout(typeNextSection, 100);
          }
        }

        typeChunk();
      }

      typeNextSection();
    }

    // 🌟 실전 전략 3인방 카드 블록 (G 마크 배지도 동일하게 G 글자 크기 극대화 적용)
    function renderStrategySelectionBlock(wrapperId, stockName) {
      const chatArea = document.getElementById('chatArea');
      const container = document.getElementById(wrapperId);

      const hoodieDiv = document.createElement('div');

    function renderAccordionChart(canvasId, data) {
      const ctx = document.getElementById(canvasId);
      if (!ctx || typeof Chart === 'undefined') return;

      const isDark = document.documentElement.classList.contains('dark');
      const lineColor = isDark ? '#ffffff' : '#0f172a';

      currentChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['2016', '2018', '2020', '2022', '2024', '2026'],
          datasets: [
            {
              label: '캐릭터 포트폴리오',
              data: data.chartData,
              borderColor: lineColor,
              borderWidth: 3,
              tension: 0.35,
              fill: false,
              pointBackgroundColor: lineColor,
              pointBorderColor: isDark ? '#09090b' : '#ffffff',
              pointBorderWidth: 2,
              pointRadius: [0, 5, 0, 5, 0, 6]
            },
            {
              label: '벤치마크 단순보유',
              data: data.benchData,
              borderColor: '#71717a',
              borderWidth: 1.5,
              borderDash: [5, 5],
              tension: 0.2,
              fill: false,
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: isDark ? '#18181b' : '#0f172a',
              titleColor: '#ffffff',
              bodyColor: '#ffffff',
              borderColor: '#3f3f46',
              borderWidth: 1,
              callbacks: {
                label: function(context) {
                  return context.dataset.label + ': ' + context.parsed.y + '억 원';
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(150, 150, 150, 0.1)' },
              ticks: { color: '#71717a', font: { size: 11 } }
            },
            y: {
              grid: { color: 'rgba(150, 150, 150, 0.1)' },
              ticks: { color: '#71717a', font: { size: 11 } },
              suggestedMax: 35
            }
          }
        }
      });
    }

    function setMood(mood) {
      const emoji = document.getElementById('memeEmoji');
      const title = document.getElementById('memeTitle');
      const sub = document.getElementById('memeSub');

      if (mood === '자신감') {
        emoji.innerText = '😎';
        title.innerText = `"${activeStock} 수급 반등 포착!"`;
        sub.innerText = "개미들아 쫄지 마라! 후드 개미 시그널 탑승 완료.";
      } else if (mood === '익절') {
        emoji.innerText = '🤑';
        title.innerText = `"${activeStock} 시원하게 익절 완료!"`;
        sub.innerText = "목표 수익 달성! 욕심 안 부리고 깔끔하게 챙깁니다.";
      } else if (mood === '고민') {
        emoji.innerText = '🤔';
        title.innerText = `"${activeStock} 중요한 변곡점 진입"`;
        sub.innerText = "지금 추격 매수할까 말까? 스마트 개미 팩트 확인 중.";
      } else if (mood === '절망') {
        emoji.innerText = '😭';
        title.innerText = `"${activeStock}에 또 물렸다..."`;
        sub.innerText = "손절 기준가 이탈... 물타지 말고 기계적으로 대응하자!";
      }
    }

    function downloadMemeImage() {
      const card = document.getElementById('memeCardToRender');
      const isDark = document.documentElement.classList.contains('dark');
      if (typeof html2canvas !== 'undefined') {
        html2canvas(card, { backgroundColor: isDark ? '#09090b' : '#ffffff', scale: 2 }).then(canvas => {
          const a = document.createElement('a');
          a.download = `gaemiGTP_${activeStock}_짤카드.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        });
      } else {
        alert('화면 캡처를 이용하여 공유할 수 있습니다.');
      }
    }
  </script>
</body>
</html>
