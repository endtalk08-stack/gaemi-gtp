<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>gaemiGTP</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    .theme-toggle {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
    }
    .theme-toggle:hover {
      background: rgba(148, 163, 184, 0.12) !important;
      border: none !important;
    }
    .icon-hit {
      width: 44px !important;
      height: 44px !important;
      min-width: 44px !important;
      min-height: 44px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .icon-hit svg { pointer-events: none; }

    .analysis-state {
      width: 100%;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      background: rgba(255,255,255,.78);
      border: 1px solid #e2e8f0;
      box-shadow: 0 8px 28px rgba(15,23,42,.05);
    }
    .dark .analysis-state {
      background: rgba(30,31,36,.82);
      border-color: #27272a;
      box-shadow: 0 8px 28px rgba(0,0,0,.14);
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }
    #chatArea p { line-height: 1.65; letter-spacing: -0.02em; }

    /* 뉴스/공시는 원래 형식을 유지하고 모바일에서 내용만 조금 작게 표시 */
    #chatArea .news-item,
    #chatArea .disclosure-item {
      line-height: 1.5;
      margin: 0 0 0.28rem 0;
    }

    #chatArea .news-item {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      #chatArea .news-item,
      #chatArea .disclosure-item {
        font-size: 0.88rem;
        line-height: 1.5;
      }
    }

    /* 사이드바: 닫힘 상태에서는 화면을 차지하지 않고 상단 버튼만 사용 */
    #mainHeroView { padding-left: 0; padding-right: 0; box-sizing: border-box; }
    #mainHeroView > header { padding-left: 14px; padding-right: 14px; }

    /* 닫힌 상태의 세로 유틸리티 레일은 사용하지 않음 */
    #leftUtilityRail, #rightUtilityRail { display: none !important; }

    /* 데스크톱: 사이드바는 본문을 밀지 않고 독립 오버레이로 표시 */
    @media (min-width: 1024px) {
      #mainHeroView {
        left: 0; right: 0;
        transition: none;
      }
      body > main { margin-left: 0 !important; margin-right: 0 !important; width: 100%; }
      #leftSidebar { position: fixed !important; }
    }

    /* 모바일/태블릿: 닫힌 상태는 본문 전체 폭, 열린 사이드바만 위에 표시 */
    @media (max-width: 1023px) {
      #mainHeroView { left: 0; right: 0; }
      #mainHeroView > header { padding-left: 8px; padding-right: 8px; }
      body > main { margin-left: 0 !important; margin-right: 0 !important; width: 100%; }
      #leftSidebar, #rightSidebar { width: min(320px, 86vw); }
    }

    /* 오른쪽 사이드바: 콘텐츠 + 우측 유틸리티 레일을 하나의 패널로 구성 */
    #rightSidebar { position: fixed !important; width: 320px !important; overflow: hidden; }
    #rightSidebar > .flex-1 { padding-right: 44px; box-sizing: border-box; }
    #rightSidebar .right-utility-rail {
      position: absolute; top: 0; right: 0; bottom: 0; width: 44px;
      display: flex; flex-direction: column; align-items: center;
      background: #f8fafc; border-left: 1px solid #e2e8f0; z-index: 10;
    }
    .dark #rightSidebar .right-utility-rail { background: #16171b; border-left-color: #27272a; }
    #rightSidebar .right-utility-toggle { height: 56px; width: 44px; display: flex; align-items: center; justify-content: center; }
    #rightSidebar .right-utility-divider { width: 28px; border-top: 1px solid #e2e8f0; margin: 0 auto 4px; }
    .dark #rightSidebar .right-utility-divider { border-top-color: #27272a; }
    #rightSidebar .right-utility-item { width: 44px; min-height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    @media (max-width: 1023px) {
      #rightSidebar { width: min(320px, 86vw) !important; }
      #rightSidebar > .flex-1 { padding-right: 44px; }
    }

    ::-webkit-scrollbar { display: none; width: 0px; }
    html, body, #chatArea, aside { scrollbar-width: none; -ms-overflow-style: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.25s ease-out forwards; }
    
    @keyframes popBounce {
      0% { transform: scale(0.6); opacity: 0; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      vertical-align: baseline;
      margin-left: 4px;
      color: #71717a;
      animation: blink 0.8s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body class="bg-[#f8fafc] dark:bg-[#121316] text-[#1e293b] dark:text-[#e4e4e7] flex h-[100dvh] w-screen overflow-hidden select-none">

  <!-- 모바일 배경 오버레이 -->
  <div id="sidebarBackdrop" onclick="closeAllSidebars()" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-sm transition-opacity duration-300"></div>

  <!-- 분석 완료 알림 팝업 -->

      <div class="text-6xl animate-bounce">🐜✨</div>

  <!-- 메인 히어로 첫 화면 -->

        <span class="font-black text-lg tracking-tight text-[#0f172a] dark:text-white cursor-pointer" onclick="resetToHome()">gaemiGTP</span>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" onclick="toggleTheme()" class="theme-toggle icon-hit relative z-[70] pointer-events-auto flex items-center justify-center rounded-full text-[#64748b] dark:text-[#a1a1aa] hover:bg-[#f1f5f9] dark:hover:bg-[#282a30] hover:text-[#0f172a] dark:hover:text-white transition cursor-pointer" aria-label="라이트/다크 모드 전환" title="라이트/다크 모드 전환"><i data-theme-icon data-lucide="sun" class="w-4 h-4"></i></button>

      </div>
    </header>

    <div class="flex-1 flex flex-col items-center justify-center px-4 -mt-12 w-full max-w-3xl mx-auto text-center space-y-6">
      <div class="space-y-1.5">
        <h1 class="text-4xl sm:text-5xl font-black tracking-tight text-[#0f172a] dark:text-white">gaemiGTP</h1>
        <p class="text-sm sm:text-base text-[#64748b] dark:text-[#a1a1aa] font-medium">종목명 하나면 10초 만에 끝납니다</p>
      </div>

      <div class="w-full relative">
        <form class="relative flex items-center" onsubmit="event.preventDefault(); handleHeroSearch();">
          <input 
            id="heroStockInput" 
            type="text" 
            placeholder="종목명 입력 (예: 삼성전자, SK하이닉스, NVDA, TSLA)"

              <span id="heroModeLabel">gaemi</span> <span class="text-[10px]">▲</span>

        <!-- 히어로 개미/인포/프로 드롭다운 -->
        <div id="heroModeMenu" class="absolute right-12 bottom-16 bg-white dark:bg-[#1e1f24] border border-[#cbd5e1] dark:border-[#2e3038] rounded-2xl p-2 w-48 shadow-2xl text-left hidden z-50 animate-fade">

            </div>
            <span id="chk-hero-gaemi" class="text-sky-500 font-bold ml-auto">✓</span>
          </button>
          <button type="button" onclick="selectAppMode('info')" class="w-full flex items-center p-2.5 rounded-xl text-left hover:bg-[#f1f5f9] dark:hover:bg-[#282a30] transition">
            <div class="text-left flex-1">
              <div class="font-bold text-sm text-[#0f172a] dark:text-white text-left">info</div>
              <div class="text-[11px] text-[#64748b] dark:text-[#71717a] text-left">도움을 받으세요</div>
            </div>
            <span id="chk-hero-info" class="text-sky-500 font-bold ml-auto hidden">✓</span>

          <button type="button" onclick="selectAppMode('pro')" class="w-full flex items-center p-2.5 rounded-xl text-left hover:bg-[#f1f5f9] dark:hover:bg-[#282a30] transition">
            <div class="text-left flex-1">
              <div class="font-bold text-sm text-[#0f172a] dark:text-white text-left">pro</div>
              <div class="text-[11px] text-[#64748b] dark:text-[#71717a] text-left">실력을 키우세요</div>
            </div>
            <span id="chk-hero-pro" class="text-sky-500 font-bold ml-auto hidden">✓</span>
          </button>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-center gap-2 pt-1">
        <button type="button" onclick="switchToAnalysisMode('삼성전자')" class="text-xs bg-white dark:bg-[#18191d] hover:bg-[#f1f5f9] dark:hover:bg-[#262830] text-[#334155] dark:text-[#a1a1aa] hover:text-[#0f172a] dark:hover:text-white border border-[#cbd5e1] dark:border-[#282a30] px-4 py-2 rounded-full transition cursor-pointer">삼성전자</button>
        <button type="button" onclick="switchToAnalysisMode('SK하이닉스')" class="text-xs bg-white dark:bg-[#18191d] hover:bg-[#f1f5f9] dark:hover:bg-[#262830] text-[#334155] dark:text-[#a1a1aa] hover:text-[#0f172a] dark:hover:text-white border border-[#cbd5e1] dark:border-[#282a30] px-4 py-2 rounded-full transition cursor-pointer">SK하이닉스</button>
        <button type="button" onclick="switchToAnalysisMode('현대차')" class="text-xs bg-white dark:bg-[#18191d] hover:bg-[#f1f5f9] dark:hover:bg-[#262830] text-[#334155] dark:text-[#a1a1aa] hover:text-[#0f172a] dark:hover:text-white border border-[#cbd5e1] dark:border-[#282a30] px-4 py-2 rounded-full transition cursor-pointer">현대차</button>
        <button type="button" onclick="switchToAnalysisMode('엔비디아')" class="text-xs bg-white dark:bg-[#18191d] hover:bg-[#f1f5f9] dark:hover:bg-[#262830] text-[#334155] dark:text-[#a1a1aa] hover:text-[#0f172a] dark:hover:text-white border border-[#cbd5e1] dark:border-[#282a30] px-4 py-2 rounded-full transition cursor-pointer">엔비디아</button>
      </div>

    <div class="h-6"></div>
  </div>

  <!-- 좌측 사이드바 -->
  <aside id="leftSidebar" class="fixed inset-y-0 left-0 z-50 w-[320px] bg-[#f8fafc] dark:bg-[#16171b] border-r border-[#e2e8f0] dark:border-[#27272a] flex flex-col justify-between shrink-0 transform -translate-x-full lg:-translate-x-full lg:w-0 lg:overflow-hidden transition-all duration-300 shadow-2xl lg:shadow-none">
    <div class="p-4 flex flex-col gap-5 overflow-y-auto">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="resetToHome()">
          <span class="text-2xl">🐜</span>
          <span class="font-black text-xl text-[#0f172a] dark:text-white tracking-tight">gaemiGTP</span>

        <button type="button" onclick="toggleLeftSidebar()" class="icon-hit text-[#64748b] dark:text-[#a1a1aa] hover:text-[#0f172a] dark:hover:text-white rounded-full cursor-pointer" aria-label="왼쪽 사이드바 열기"><i data-lucide="panel-left" class="w-5 h-5"></i></button>

      </div>
      <div class="flex items-center gap-1">

    <div id="chatArea" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-6 max-w-3xl mx-auto w-full"></div>

      <div class="max-w-3xl mx-auto relative">
        <form class="relative flex items-center w-full" onsubmit="event.preventDefault(); handleBottomSearch();">

  <script>
    const BACKEND_URL = 'https://gaemi-gtp.onrender.com';
    let activeStock = '삼성전자';
    let currentChartInstance = null;
    let currentAppMode = 'gaemi';

    function applySidebarState() {
      const leftBar = document.getElementById('leftSidebar');
      const rightBar = document.getElementById('rightSidebar');
      const leftRail = document.getElementById('leftUtilityRail');
      const backdrop = document.getElementById('sidebarBackdrop');
      const leftOpen = document.body.classList.contains('left-sidebar-open');
      const rightOpen = document.body.classList.contains('right-sidebar-open');
      const mobile = window.innerWidth < 1024;

      if (leftBar) {
        leftBar.classList.toggle('-translate-x-full', !leftOpen);
        leftBar.classList.toggle('lg:-translate-x-full', !leftOpen);
        leftBar.classList.toggle('lg:w-0', !leftOpen);
        leftBar.classList.toggle('lg:overflow-hidden', !leftOpen);
      }
      if (rightBar) {
        rightBar.classList.toggle('translate-x-full', !rightOpen);
        rightBar.classList.toggle('xl:translate-x-full', !rightOpen);
      }

      // 오른쪽 상단 버튼 하나로 열기/닫기: 닫힘=패널 아이콘, 열림=X
      document.querySelectorAll('[data-right-toggle-icon="closed"]').forEach(el => el.classList.toggle('hidden', rightOpen));
      document.querySelectorAll('[data-right-toggle-icon="open"]').forEach(el => el.classList.toggle('hidden', !rightOpen));
      document.querySelectorAll('[data-right-header-toggle]').forEach(el => el.classList.remove('hidden'));

      // 왼쪽 접힘 레일은 닫힌 상태에서만 사용하지 않고, 현재 레이아웃의 상단 버튼을 기준으로 유지
      if (leftRail) leftRail.style.display = 'none';

      // 모바일에서는 열린 패널을 오버레이로 보여주고 배경을 눌러 닫을 수 있게 함.
      if (backdrop) backdrop.classList.toggle('hidden', !(mobile && (leftOpen || rightOpen)));
    }

    function resetToHome() {
      document.getElementById('mainHeroView').classList.remove('hidden');
      document.body.classList.remove('left-sidebar-open','right-sidebar-open','sidebar-left-expanded','sidebar-right-expanded');
      applySidebarState();
    }

    function switchToAnalysisMode(stockName) {
      document.getElementById('mainHeroView').classList.add('hidden');
      // 분석 진입 시 양쪽 패널은 닫힌 상태 + 양쪽 열기 레일만 표시
      document.body.classList.remove('left-sidebar-open','right-sidebar-open','sidebar-left-expanded','sidebar-right-expanded');
      applySidebarState();
      requestStock(stockName || '삼성전자');
    }

    function handleHeroSearch() {
      const val = document.getElementById('heroStockInput').value;
      switchToAnalysisMode(val || '삼성전자');
    }
    function handleBottomSearch() {
      const val = document.getElementById('bottomStockInput').value;
      if (val) {
        requestStock(val);
        document.getElementById('bottomStockInput').value = '';
      }
    }

    function toggleModeDropdown(which) {
      const heroMenu = document.getElementById('heroModeMenu');
      const bottomMenu = document.getElementById('bottomModeMenu');
      if (which === 'hero') {
        heroMenu.classList.toggle('hidden');
        if (bottomMenu) bottomMenu.classList.add('hidden');
      } else {
        bottomMenu.classList.toggle('hidden');
        if (heroMenu) heroMenu.classList.add('hidden');
      }
    }

    function selectAppMode(mode) {
      currentAppMode = mode;
      document.getElementById('heroModeLabel').innerText = mode;
      document.getElementById('bottomModeLabel').innerText = mode;
      ['gaemi', 'info', 'pro'].forEach(m => {
        const hChk = document.getElementById(`chk-hero-${m}`);
        const bChk = document.getElementById(`chk-bottom-${m}`);
        if (hChk) hChk.classList.toggle('hidden', m !== mode);
        if (bChk) bChk.classList.toggle('hidden', m !== mode);
      });
      document.getElementById('heroModeMenu').classList.add('hidden');
      document.getElementById('bottomModeMenu').classList.add('hidden');
    }

    function toggleLeftSidebar() {
      const isOpen = document.body.classList.contains('left-sidebar-open');
      document.body.classList.toggle('left-sidebar-open', !isOpen);
      applySidebarState();
    }

    function toggleRightSidebar() {
      const isOpen = document.body.classList.contains('right-sidebar-open');
      document.body.classList.toggle('right-sidebar-open', !isOpen);
      applySidebarState();
    }

    function closeAllSidebars() {
      // 닫기는 두 패널만 닫고, 열기 레일은 반드시 남긴다.
      document.body.classList.remove('left-sidebar-open','right-sidebar-open','sidebar-left-expanded','sidebar-right-expanded');
      applySidebarState();
    }

    // 초기 상태: 양쪽 패널은 닫고, 상단 열기 버튼만 표시
    function initializeSidebars() {
      document.body.classList.remove('left-sidebar-open','right-sidebar-open','sidebar-left-expanded','sidebar-right-expanded');
      applySidebarState();
    }

    initializeSidebars();

    function updateThemeButtons() {
      const isDark = document.documentElement.classList.contains('dark');
      document.querySelectorAll('[data-theme-icon]').forEach(icon => {
        icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      });
      if (window.lucide) lucide.createIcons();
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      htmlEl.classList.toggle('dark');
      updateThemeButtons();
    }

    async function fetchAnalysisFromBackend(stockName) {
      try {
        const response = await fetch(`${BACKEND_URL}/analyze?stock=${encodeURIComponent(stockName)}`);
        if (!response.ok) throw new Error('서버 에러');
        const data = await response.json();
        return { sections: data.sections || [], ok: true };
      } catch (err) {
        return { sections: [], ok: false };
      }
    }

    function renderAnalysisStatus(chatArea, stockName, ok) {
      const state = document.createElement('div');
      state.className = 'analysis-state animate-fade';
      state.innerHTML = ok ? `
        <div class="w-10 h-10 mx-auto mb-3 rounded-full bg-[#f1f5f9] dark:bg-[#27272a] flex items-center justify-center text-[#64748b] dark:text-[#a1a1aa]">
          <i data-lucide="database" class="w-5 h-5"></i>
        </div>
        <div class="font-black text-base text-[#0f172a] dark:text-white">분석 데이터가 없습니다</div>
        <div class="mt-1 text-xs text-[#64748b] dark:text-[#a1a1aa]">${stockName}에 대한 분석 내용을 준비하고 있습니다.</div>
      ` : `
        <div class="w-10 h-10 mx-auto mb-3 rounded-full bg-[#f1f5f9] dark:bg-[#27272a] flex items-center justify-center text-[#64748b] dark:text-[#a1a1aa]">
          <i data-lucide="refresh-cw" class="w-5 h-5"></i>
        </div>
        <div class="font-black text-base text-[#0f172a] dark:text-white">분석 데이터를 불러오지 못했습니다</div>
        <div class="mt-1 text-xs text-[#64748b] dark:text-[#a1a1aa]">잠시 후 다시 시도해주세요.</div>
      `;
      chatArea.appendChild(state);
      if (window.lucide) lucide.createIcons();
      return state;
    }

    async function requestStock(stockName) {
      if (!stockName || !stockName.trim()) return;
      stockName = stockName.trim();
      activeStock = stockName;

      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = '';
      chatArea.scrollTop = 0;

      const userDiv = document.createElement('div');
      userDiv.className = "flex justify-end animate-fade";
      userDiv.innerHTML = `<div class="bg-[#f1f5f9] dark:bg-[#1e1f24] text-[#0f172a] dark:text-white text-base font-bold px-5 py-3 rounded-2xl border border-[#cbd5e1] dark:border-[#3f3f46]">${stockName}</div>`;
      chatArea.appendChild(userDiv);

      const loaderDiv = document.createElement('div');
      loaderDiv.className = "flex flex-col items-center justify-center p-8 bg-white dark:bg-[#1e1f24] border border-[#e2e8f0] dark:border-[#27272a] rounded-3xl my-2 text-center shadow-sm animate-fade";
      loaderDiv.innerHTML = `
        <div class="flex items-center gap-4 mb-3">
          <div class="w-14 h-14 rounded-full bg-[#f8fafc] dark:bg-[#27272a] border border-[#cbd5e1] dark:border-[#3f3f46] flex items-center justify-center text-2xl animate-bounce">🐜</div>
          <span class="text-[#94a3b8] dark:text-[#71717a] font-bold text-xl">×</span>
          <div class="w-14 h-14 rounded-full bg-[#0f172a] dark:bg-white text-white dark:text-black font-black flex items-center justify-center text-2xl">🕶️</div>
        </div>
        <h4 class="font-black text-lg text-[#0f172a] dark:text-white">${stockName} 퀀트 5초 정밀 스캔 중...</h4>
      `;
      chatArea.appendChild(loaderDiv);

      const fetchPromise = fetchAnalysisFromBackend(stockName);
      const delayPromise = new Promise(resolve => setTimeout(resolve, 900));
      const [result] = await Promise.all([fetchPromise, delayPromise]);
      const sections = result.sections || [];

      loaderDiv.remove();

      if (!result.ok || sections.length === 0) {
        renderAnalysisStatus(chatArea, stockName, result.ok);
        chatArea.scrollTop = 0;
        return;
      }

      const surprisePopup = document.getElementById('surpriseAntPopup');
      surprisePopup.classList.remove('hidden');
      await new Promise(res => setTimeout(res, 600));
      surprisePopup.classList.add('hidden');

      chatArea.scrollTop = 0;
      startTypewriterFlow(stockName, sections);
    }

    // ★ 버그 완벽 수정된 텍스트 파싱 로직
    function startTypewriterFlow(stockName, sections) {
      const chatArea = document.getElementById('chatArea');
      const wrapperId = 'stream-' + Date.now();

      const mainContainer = document.createElement('div');
      mainContainer.id = wrapperId;
      mainContainer.className = "space-y-7 py-2";
      chatArea.appendChild(mainContainer);

      let secIdx = 0;

      function typeNextSection() {
        if (!sections || secIdx >= sections.length) {
          renderBottomWidgets(wrapperId, stockName);
          return;
        }

        const sec = sections[secIdx];
        const textBlock = document.createElement('div');
        textBlock.className = "space-y-4 animate-fade";
        textBlock.innerHTML = `
          <div class="flex items-center gap-2.5">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-[#0f172a] dark:bg-white text-white dark:text-black flex items-center justify-center font-black text-xs sm:text-sm shadow-sm shrink-0">G</div>
            ${sec.title ? `<h4 class="font-black text-lg sm:text-xl text-[#0f172a] dark:text-white">${sec.title}</h4>` : ''}
          </div>
          <p id="p-content-${secIdx}" class="text-base sm:text-lg text-[#334155] dark:text-[#e4e4e7] leading-relaxed whitespace-pre-line typing-cursor"></p>
        `;
        mainContainer.appendChild(textBlock);

        const pEl = document.getElementById(`p-content-${secIdx}`);
        let charIdx = 0;
        const text = sec.content || "";
        const chunkSize = 25;

        function typeChunk() {
          if (charIdx < text.length) {
            pEl.textContent += text.substr(charIdx, chunkSize);
            charIdx += chunkSize;
            setTimeout(typeChunk, 15);
          } else {
            pEl.classList.remove('typing-cursor');
            let formatted = pEl.textContent;

            try {
              // 1. 실적 종목명(#오라클, #어도비 등) -> 핑크
              formatted = formatted.replace(/(#(?:오라클|어도비|엔비디아|테슬라|애플|구글|마이크로소프트|아마존|메타|일라이릴리))/g, '<span class="font-bold" style="color: #FF8DA1;">$1</span>');

              // 2. 경제 지표(#PPI, #CPI, #FOMC, #PCE, #NFP) -> 블루
              formatted = formatted.replace(/(#(?:PPI|CPI|FOMC|PCE|NFP))/g, '<span class="font-bold" style="color: #38BDF8;">$1</span>');

              // 3. 지지선 / 저항선 색상
              if (formatted.includes('#생존 지지선')) {
                formatted = formatted.replace(/#생존\s+지지선\s+([$]?[\d,.]+[원]?)/g, '<span style="color: #FF8DA1;">#생존 지지선 $1</span>');
                formatted = formatted.replace(/#악성\s+매물대\s+([$]?[\d,.]+[원]?)/g, '<span style="color: #38BDF8;">#악성 매물대 $1</span>');
              } 
              // 4. 수급 매매동향 및 콜/풋 옵션 색상 
              else if (formatted.includes('#외국인') || formatted.includes('#콜')) {
                let lines = formatted.split('\n\n');
                let tagLine = lines[0];
                let rest = lines.slice(1).join('\n\n');

                if (tagLine.includes('#콜')) {
                  // 미국 주식 콜/풋/비율 분할 처리 (#콜은 전체 핑크, #풋은 전체 블루)
                  const parts = tagLine.split(/\s+(?=#)/);
                  let coloredTags = parts.map(part => {
                    if (part.startsWith('#콜')) return `<span class="whitespace-nowrap font-bold" style="color: #FF8DA1;">${part}</span>`;
                    if (part.startsWith('#풋')) return `<span class="whitespace-nowrap font-bold" style="color: #38BDF8;">${part}</span>`;
                    return `<span class="whitespace-nowrap font-bold" style="color: #94a3b8;">${part}</span>`;
                  });
                  tagLine = coloredTags.join(' ');
                } else {
                  // 국내 주식 외인/기관/개인 처리
                  tagLine = tagLine.replace(/#(외국인|기관|개인)\s+([+-]?[\d,.]+(?:만주|주|관망)?)/g, function(_, name, val) {
                    let color = val.includes('+') ? '#FF8DA1' : (val.includes('-') ? '#38BDF8' : '#94a3b8');
                    return `<span class="whitespace-nowrap font-bold" style="color: ${color};">#${name} ${val}</span>`;
                  });
                }
                formatted = `<div class="flex items-center gap-2 sm:gap-4 overflow-x-auto whitespace-nowrap text-base sm:text-lg mb-3 tracking-tight">${tagLine}</div>${rest}`;
              } 
              // 5. 첫 섹션 태그 라인 오류 완전 해결
              else if (formatted.includes('#') && !formatted.includes('캘린더')) {
                const isDown = formatted.includes('-') || formatted.includes('보합') || formatted.includes('눈치싸움') || formatted.includes('파란불') || formatted.includes('숨고르기') || formatted.includes('투매');
                const themeColor = isDown ? '#38BDF8' : '#FF8DA1';
                
                let lines = formatted.split('\n\n');
                if (lines.length > 0) {
                  let lastLine = lines[lines.length - 1];
                  // HTML 태그(<span ...>)가 이미 들어간 경우 순수 텍스트만 뽑아서 다시 색을 칠함
                  if (lastLine.includes('#') && lastLine.includes('<span')) {
                     // 1. 임시 div를 만들어 HTML 태그를 모두 벗겨냄
                     let tempDiv = document.createElement('div');
                     tempDiv.innerHTML = lastLine;
                     let rawText = tempDiv.textContent || tempDiv.innerText || "";
                     
                     // 2. 벗겨낸 순수 텍스트(예: #엔비디아 #-2.01% #숨고르기 #버텨보자)를 단어별로 다시 칠함
                     const words = rawText.split(/\s+/);
                     const newWords = words.map(w => {
                       if (w.startsWith('#')) {
                         let color = themeColor;
                         if (w.includes('+')) color = '#FF8DA1';
                         else if (w.includes('-')) color = '#38BDF8';
                         return `<span class="font-bold" style="color: ${color};">${w}</span>`;
                       }
                       return w;
                     });
                     lines[lines.length - 1] = newWords.join(' ');
                     formatted = lines.join('\n\n');
                  } else if (lastLine.includes('#')) {
                     // HTML 태그가 없을 땐 기존 방식대로 처리
                     const words = lastLine.split(/\s+/);
                     const newWords = words.map(w => {
                       if (w.startsWith('#')) {
                         let color = themeColor;
                         if (w.includes('+')) color = '#FF8DA1';
                         else if (w.includes('-')) color = '#38BDF8';
                         return `<span class="font-bold" style="color: ${color};">${w}</span>`;
                       }
                       return w;
                     });
                     lines[lines.length - 1] = newWords.join(' ');
                     formatted = lines.join('\n\n');
                  }
                }
              }

              // 6. 본문 텍스트 내 등락률 (-0.19%, +8.26% 등)
              formatted = formatted.replace(/(?:\s|^)([+-]\d+(?:\.\d+)?%)/g, function(match, p1) {
                const color = p1.startsWith('+') ? '#FF8DA1' : '#38BDF8';
                return match.replace(p1, `<span class="font-bold" style="color: ${color};">${p1}</span>`);
              });

            } catch (err) {
              console.warn("치환 예외 안전 무시:", err);
            }

            // 뉴스/공시는 원래 표시 방식 유지: 각 항목의 📰 / 📌 아이콘을 그대로 표시
            // 모바일에서는 내용만 작게 보이고, 뉴스 제목은 최대 2줄까지만 표시한다.
            const displayBlocks = formatted.split('\n\n');
            const displayOut = [];

            displayBlocks.forEach(function(block) {
              const trimmed = block.trim();
              if (trimmed.startsWith('📰')) {
                displayOut.push(`<div class="news-item">${trimmed}</div>`);
              } else if (trimmed.startsWith('📌')) {
                displayOut.push(`<div class="disclosure-item">${trimmed}</div>`);
              } else {
                displayOut.push(block);
              }
            });

            // 뉴스 항목끼리는 한 줄 간격만 사용해 모바일에서 더 깔끔하게 표시한다.
            // 그 외 섹션 사이의 기존 간격은 그대로 유지한다.
            const joinedBlocks = [];
            displayOut.forEach(function(block, i) {
              if (i === 0) {
                joinedBlocks.push(block);
                return;
              }
              const prev = displayBlocks[i - 1].trim();
              const curr = displayBlocks[i].trim();
              const bothNews = prev.startsWith('📰') && curr.startsWith('📰');
              joinedBlocks.push((bothNews ? '\n' : '\n\n') + block);
            });

            formatted = joinedBlocks.join('');

            pEl.innerHTML = formatted;
            secIdx++;
            setTimeout(typeNextSection, 50);
          }
        }
        typeChunk();
      }

      typeNextSection();
    }

              <div class="w-12 h-12 rounded-2xl bg-[#ff2d78]/10 border border-[#ff2d78]/20 flex items-center justify-center text-2xl shrink-0">
                ${data.icon}
              </div>
              <div>
                <h2 class="text-xl sm:text-2xl font-black text-[#0f172a] dark:text-white tracking-tight">실제 백테스트 검증</h2>
                <p class="text-xs sm:text-sm text-[#64748b] dark:text-[#8e92a4] mt-0.5 font-medium">과거 데이터로 증명된, 개미GTP의 투자 전략입니다.</p>
              </div>
            </div>
            <div class="sm:text-right font-serif italic text-xs sm:text-sm text-[#64748b] dark:text-[#7e8294] shrink-0">
              ${data.quote}
              <div class="text-[11px] text-[#94a3b8] dark:text-[#525565] not-italic font-sans mt-0.5">- gaemiGTP -</div>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2 sm:gap-3 text-xs sm:text-sm text-[#64748b] dark:text-[#8e92a4] font-medium">
            <span class="font-black text-[#0f172a] dark:text-white text-base">${data.name}</span>
            <span class="text-[#cbd5e1] dark:text-[#363949]">|</span>
            <span>${data.dateRange}</span>
            <span class="text-[#cbd5e1] dark:text-[#363949]">|</span>
            <span>초기자금 ${data.initial}</span>
            <span class="text-[#cbd5e1] dark:text-[#363949]">|</span>
            <span class="text-emerald-600 dark:text-emerald-400 font-bold">수수료 포함</span>
          </div>

          <div class="grid grid-cols-2 divide-x divide-[#e2e8f0] dark:divide-[#262837] bg-[#f8fafc] dark:bg-[#161720] border border-[#e2e8f0] dark:border-[#262837] rounded-3xl p-5 sm:p-6 text-center">
            <div class="flex flex-col items-center justify-center space-y-1 pr-2 sm:pr-4">
              <div class="text-xs text-[#64748b] dark:text-[#717588] font-bold">1억 → 최종 자산</div>
              <div class="text-2xl sm:text-4xl font-black text-[#0f172a] dark:text-white tracking-tight">${data.finalAsset}</div>
            </div>
            <div class="flex flex-col items-center justify-center space-y-1 pl-2 sm:pl-4">
              <div class="text-xs text-[#64748b] dark:text-[#8e92a4] font-bold">10년 누적수익률</div>
              <div class="text-2xl sm:text-4xl font-black tracking-tight" style="color: ${data.accentColor};">${data.totalReturn}</div>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-[#f8fafc] dark:bg-[#171821] border border-[#e2e8f0] dark:border-[#262837] rounded-2xl p-3.5 text-center space-y-1">
              <div class="text-xs text-[#64748b] dark:text-[#7e8294] font-bold">CAGR</div>
              <div class="text-xl sm:text-2xl font-black" style="color: ${data.accentColor};">${data.cagr}</div>
            </div>
            <div class="bg-[#f8fafc] dark:bg-[#171821] border border-[#e2e8f0] dark:border-[#262837] rounded-2xl p-3.5 text-center space-y-1">
              <div class="text-xs text-[#64748b] dark:text-[#7e8294] font-bold">MDD</div>
              <div class="text-xl sm:text-2xl font-black text-[#00b8ff]">${data.mdd}</div>
            </div>
            <div class="bg-[#f8fafc] dark:bg-[#171821] border border-[#e2e8f0] dark:border-[#262837] rounded-2xl p-3.5 text-center space-y-1">
              <div class="text-xs text-[#64748b] dark:text-[#7e8294] font-bold">총 거래</div>
              <div class="text-xl sm:text-2xl font-black text-[#0f172a] dark:text-white">${data.trades}</div>
            </div>
            <div class="bg-[#f8fafc] dark:bg-[#171821] border border-[#e2e8f0] dark:border-[#262837] rounded-2xl p-3.5 text-center space-y-1">
              <div class="text-xs text-[#64748b] dark:text-[#7e8294] font-bold">승률</div>
              <div class="text-xl sm:text-2xl font-black text-[#0f172a] dark:text-white">${data.winRate}</div>
            </div>
          </div>

          <div class="bg-[#f8fafc] dark:bg-[#161720] border border-[#e2e8f0] dark:border-[#262837] rounded-3xl p-4 sm:p-6 space-y-3">
            <div class="flex items-center justify-between text-xs sm:text-sm">
              <div class="flex items-center gap-2 font-black text-[#0f172a] dark:text-white">
                <span>10년 자산곡선 (단위: 억)</span>
              </div>
              <div class="flex items-center gap-4 text-xs font-bold">
                <span class="flex items-center gap-1.5" style="color: ${data.accentColor};">
                  <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color: ${data.accentColor};"></span> 전략 수익률
                </span>
                <span class="flex items-center gap-1.5 text-[#64748b] dark:text-[#7e8294]">
                  <span class="w-2.5 h-2.5 rounded-full bg-[#94a3b8] dark:bg-[#7e8294] inline-block"></span> ${data.benchLabel}
                </span>
              </div>
            </div>
            <div class="relative w-full h-52 sm:h-60">
              <canvas id="canvas-acc-${type}"></canvas>
            </div>
          </div>

          <a href="https://www.quantconnect.com" target="_blank" rel="noopener noreferrer" class="block w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-[#00a6f4] via-[#00c5ff] to-[#008be3] hover:brightness-110 text-white font-black text-center text-sm sm:text-base shadow-lg shadow-sky-500/20 transition cursor-pointer">
            QuantConnect 원본 결과 보기 ↗
          </a>
        </div>
      `;

      targetSlot.classList.remove('hidden');

      const isDark = document.documentElement.classList.contains('dark');
      const ctx = document.getElementById(`canvas-acc-${type}`).getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 220);
      gradient.addColorStop(0, data.accentColor + '44');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');

      currentChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.labels,
          datasets: [
            {
              label: '전략 수익률',
              data: data.chartData,
              borderColor: data.accentColor,
              backgroundColor: gradient,
              borderWidth: 2.5,
              fill: true,
              tension: 0.35,
              pointRadius: 0
            },
            {
              label: data.benchLabel,
              data: data.benchData,
              borderColor: isDark ? '#4e5264' : '#94a3b8',
              borderWidth: 1.5,
              borderDash: [4, 4],
              fill: false,
              tension: 0.2,
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: isDark ? '#686c80' : '#94a3b8', font: { size: 10 } }
            },
            y: {
              position: 'right',
              grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' },
              ticks: {
                color: isDark ? '#686c80' : '#94a3b8',
                font: { size: 10 },
                callback: v => v + '억'
              }
            }
          }
        }
      });
    }

    let voted = false;
    function castVote(type) {
      if (voted) return alert('이미 투표하셨습니다!');
      voted = true;
      const bar = document.getElementById('voteProgressBar');
      const upLbl = document.getElementById('voteUpLabel');
      const downLbl = document.getElementById('voteDownLabel');
      if (type === 'up') {
        bar.style.width = '74%';
        upLbl.innerText = '상승 74%';
        downLbl.innerText = '하락 26%';
      } else {
        bar.style.width = '61%';
        upLbl.innerText = '상승 61%';
        downLbl.innerText = '하락 39%';
      }
    }
  </script>
<script>document.addEventListener("DOMContentLoaded", () => { if (window.lucide) lucide.createIcons(); });
    function setRightInfoTab(tab) {
      const titles = {
        popular: ['인기 TOP 20', '현재가'],
        value: ['거래대금 TOP 20', '거래대금'],
        industry: ['산업 TOP 20', '등락률'],
        theme: ['테마 TOP 20', '등락률']
      };
      document.querySelectorAll('.right-info-tab').forEach(btn => {
        const active = btn.dataset.infoTab === tab;
        btn.classList.toggle('bg-[#eef2f7]', active);
        btn.classList.toggle('dark:bg-[#272a31]', active);
        btn.classList.toggle('text-[#0f172a]', active);
        btn.classList.toggle('dark:text-white', active);
        btn.classList.toggle('text-[#64748b]', !active);
        btn.classList.toggle('dark:text-[#a1a1aa]', !active);
      });
      const title = document.getElementById('rightListTitle');
      const metric = document.getElementById('rightListMetric');
      if (title) title.textContent = titles[tab][0];
      if (metric) metric.textContent = titles[tab][1];
      const criteria = document.getElementById('valueCriteria');
      if (criteria) criteria.classList.toggle('hidden', tab !== 'value');
    }

    function setValueCriteria(button, label) {
      document.querySelectorAll('.value-criterion').forEach(btn => {
        const active = btn === button;
        btn.classList.toggle('bg-[#eef2f7]', active);
        btn.classList.toggle('dark:bg-[#272a31]', active);
        btn.classList.toggle('text-[#0f172a]', active);
        btn.classList.toggle('dark:text-white', active);
        btn.classList.toggle('text-[#64748b]', !active);
        btn.classList.toggle('dark:text-[#a1a1aa]', !active);
      });
      const metric = document.getElementById('rightListMetric');
      if (metric) metric.textContent = label;
    }
</script>
</body>
</html>
