        document.getElementById('bottomModePopup').classList.add('hidden');

      const leftBar = document.getElementById('leftSidebar');
      const rightBar = document.getElementById('rightSidebar');
      const backdrop = document.getElementById('sidebarBackdrop');

      rightBar.classList.add('translate-x-full');
      rightBar.classList.remove('translate-x-0');

      if (leftBar.classList.contains('-translate-x-full')) {
        leftBar.classList.remove('-translate-x-full');
        leftBar.classList.add('translate-x-0');
        backdrop.classList.remove('hidden');
      } else {
        closeAllSidebars();
      }

    function startTypewriterFlow(stockName, loaderId) {
      const chatArea = document.getElementById('chatArea');
      const wrapperId = 'stream-' + Date.now();

      const mainContainer = document.createElement('div');
      mainContainer.id = wrapperId;
      mainContainer.className = "space-y-8 py-2";
      chatArea.appendChild(mainContainer);

      const sections = getReportSections(stockName);
      let secIdx = 0;

      function typeNextSection() {
        if (secIdx >= sections.length) {
          // 글이 모두 끝나면 상단에 있던 춤추는 개미 삭제
          if (loaderId) {
            const lEl = document.getElementById(loaderId);
            if (lEl) lEl.remove();
          }
          renderStrategySelectionBlock(wrapperId, stockName);
          return;
        }

        const sec = sections[secIdx];
        
        const textBlock = document.createElement('div');
        textBlock.className = "relative pl-12 sm:pl-14 animate-fade";
        textBlock.innerHTML = `
          <div class="absolute left-0 top-0 w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-[#0f172a] dark:bg-white text-white dark:text-black flex items-center justify-center font-black text-sm sm:text-base shadow-sm">G</div>
          
          <div class="space-y-2.5">
            ${sec.title ? `<h4 class="font-black text-lg sm:text-xl text-[#0f172a] dark:text-white flex items-center gap-1.5">${sec.title}</h4>` : ''}
            <p id="p-content-${secIdx}" class="text-base sm:text-lg text-[#334155] dark:text-[#e4e4e7] leading-relaxed whitespace-pre-line typing-cursor"></p>
          </div>
        `;
        mainContainer.appendChild(textBlock);

        const pEl = document.getElementById(`p-content-${secIdx}`);
        let charIdx = 0;
        const text = sec.content;
        const chunkSize = 20;

        function typeChunk() {
          if (charIdx < text.length) {
            pEl.textContent += text.substr(charIdx, chunkSize);
            charIdx += chunkSize;
            
            // ★ 아래로 끌려내려가는 스크롤 기능 삭제 (사용자 시선 고정) ★
            setTimeout(typeChunk, 20);
          } else {
            pEl.classList.remove('typing-cursor');
            secIdx++;
            setTimeout(typeNextSection, 90);
          }
        }

        typeChunk();
      }

      typeNextSection();
    }

              <div class="lg:col-span-7 bg-[#f8fafc] dark:bg-[#121316] border border-[#cbd5e1] dark:border-[#27272a] rounded-2xl p-4 sm:p-5 space-y-3">
                <div class="flex items-center justify-between">
                  <span class="font-bold text-sm sm:text-base text-[#334155] dark:text-[#e4e4e7] flex items-center gap-1.5">
                    📈 누적 자산 성장 곡선 (단기/복리)
                  </span>
                  <span class="text-sm font-black bg-[#e2e8f0] dark:bg-[#1e1f24] text-[#0f172a] dark:text-white border dark:border-[#3f3f46] px-3 py-1 rounded-md">
                    ${data.badge}
                  </span>
                </div>
                <div class="h-56 sm:h-64 relative w-full">
                  <canvas id="canvas-${type}"></canvas>
                </div>
                <div class="flex items-center justify-center gap-6 text-[13px] text-[#64748b] dark:text-[#a1a1aa] pt-1">
                  <span class="flex items-center gap-1.5"><span class="w-3 h-1 bg-[#0f172a] dark:bg-white inline-block rounded"></span> 캐릭터 포트폴리오</span>
                  <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 border-t border-dashed border-[#94a3b8] dark:border-[#71717a] inline-block"></span> 벤치마크 단순보유</span>
                </div>
              </div>

              <div class="lg:col-span-5 bg-[#f8fafc] dark:bg-[#121316] border border-[#cbd5e1] dark:border-[#27272a] rounded-2xl p-4 sm:p-5 space-y-3.5">
                <h5 class="font-black text-base text-[#0f172a] dark:text-white flex items-center gap-1.5">
                  <span>$</span> 캐릭터 핵심 실행 공식
                </h5>
                <div class="text-sm sm:text-base text-[#475569] dark:text-[#e4e4e7] space-y-2.5 leading-relaxed">
                  ${data.formulas.map(f => `<p>${f}</p>`).join('')}
                </div>
              </div>
            </div>

            <div class="bg-[#f8fafc] dark:bg-[#121316] border border-[#cbd5e1] dark:border-[#27272a] rounded-2xl p-4 sm:p-5 space-y-1.5">
              <div class="font-bold text-sm text-[#0f172a] dark:text-white flex items-center gap-1">
                <span>💡</span> 백테스트 핵심 포인트
              </div>
              <p class="text-sm sm:text-base text-[#475569] dark:text-[#a1a1aa] leading-relaxed">${data.point}</p>
            </div>
          </div>
        </div>
      `;

      targetSlot.classList.remove('hidden');

      if (typeof Chart !== 'undefined') {
        renderAccordionChart(`canvas-${type}`, data);
      }

      if (btnElement) {
        setTimeout(() => {
          btnElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
      }
    }

    function renderAccordionChart(canvasId, data) {
      const ctx = document.getElementById(canvasId);
      if (!ctx || typeof Chart === 'undefined') return;

      const isDark = document.documentElement.classList.contains('dark');
      const lineColor = isDark ? '#ffffff' : '#0f172a';

      currentChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['2016', '2018', '2020', '2022', '2024', '2026'],
          datasets: [
            {
              label: '캐릭터 포트폴리오',
              data: data.chartData,
              borderColor: lineColor,
              borderWidth: 3,
              tension: 0.35,
              fill: false,
              pointBackgroundColor: lineColor,
              pointBorderColor: isDark ? '#121316' : '#ffffff',
              pointBorderWidth: 2,
              pointRadius: [0, 5, 0, 5, 0, 6]
            },
            {
              label: '벤치마크 단순보유',
              data: data.benchData,
              borderColor: '#71717a',
              borderWidth: 1.5,
              borderDash: [5, 5],
              tension: 0.2,
              fill: false,
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: isDark ? '#1e1f24' : '#0f172a',
              titleColor: '#ffffff',
              bodyColor: '#ffffff',
              borderColor: '#3f3f46',
              borderWidth: 1,
              callbacks: {
                label: function(context) {
                  return context.dataset.label + ': ' + context.parsed.y + '억 원';
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(150, 150, 150, 0.1)' },
              ticks: { color: '#a1a1aa', font: { size: 11 } }
            },
            y: {
              grid: { color: 'rgba(150, 150, 150, 0.1)' },
              ticks: { color: '#a1a1aa', font: { size: 11 } },
              suggestedMax: 35
            }
          }
        }
      });
    }

    function openMeme(stockName) {
      activeStock = stockName;
      document.getElementById('memeStockBadge').innerText = stockName;
      setMood('자신감');
      document.getElementById('memeModal').classList.remove('hidden');
    }

    function setMood(mood) {
      const emoji = document.getElementById('memeEmoji');
      const title = document.getElementById('memeTitle');
      const sub = document.getElementById('memeSub');

      if (mood === '자신감') {
        emoji.innerText = '😎';
        title.innerText = `"${activeStock} 수급 반등 포착!"`;
        sub.innerText = "개미들아 쫄지 마라! 후드 개미 시그널 탑승 완료.";
      } else if (mood === '익절') {
        emoji.innerText = '🤑';
        title.innerText = `"${activeStock} 시원하게 익절 완료!"`;
        sub.innerText = "목표 수익 달성! 욕심 안 부리고 깔끔하게 챙깁니다.";
      } else if (mood === '고민') {
        emoji.innerText = '🤔';
        title.innerText = `"${activeStock} 중요한 변곡점 진입"`;
        sub.innerText = "지금 추격 매수할까 말까? 스마트 개미 팩트 확인 중.";
      } else if (mood === '절망') {
        emoji.innerText = '😭';
        title.innerText = `"${activeStock}에 또 물렸다..."`;
        sub.innerText = "손절 기준가 이탈... 물타지 말고 기계적으로 대응하자!";
      }
    }

    function downloadMemeImage() {
      const card = document.getElementById('memeCardToRender');
      const isDark = document.documentElement.classList.contains('dark');
      if (typeof html2canvas !== 'undefined') {
        html2canvas(card, { backgroundColor: isDark ? '#121316' : '#ffffff', scale: 2 }).then(canvas => {
          const a = document.createElement('a');
          a.download = `gaemiGTP_${activeStock}_짤카드.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        });
      } else {
        alert('화면 캡처를 이용하여 공유할 수 있습니다.');
      }
    }
  </script>
</body>
</html>
