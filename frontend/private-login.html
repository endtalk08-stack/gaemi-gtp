<!doctype html>
<html lang="ko" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>gaemiGTP · 개발 모드</title>
<style>
:root{color-scheme:dark;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#121316;color:#e4e4e7;padding:24px}
main{width:min(100%,390px)}
h1{font-size:22px;font-weight:700;margin:0 0 8px}
p{font-size:13px;font-weight:500;line-height:1.7;color:#a1a1aa;margin:0 0 25px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}
input{display:block;width:100%;height:46px;border:1px solid #41414a;background:#1e1f24;color:#e4e4e7;border-radius:11px;padding:0 14px;font:inherit;font-size:14px}
input:focus{outline:2px solid #777e94;outline-offset:2px}
button{width:100%;height:44px;margin-top:12px;border:0;border-radius:11px;background:#e4e4e7;color:#18181b;font:inherit;font-size:14px;font-weight:650;cursor:pointer}
button:disabled{opacity:.6}
#feedback{min-height:22px;margin-top:15px;color:#f0b7b7;font-size:12px}
</style>
</head>
<body>
<main>
  <h1>gaemiGTP</h1>
  <p>현재 비공개 개발 모드야. 관리자 로그인 후 이용할 수 있어.</p>
  <form id="devLoginForm">
    <label for="password">관리자 비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" minlength="16" required autofocus>
    <button id="loginButton" type="submit">들어가기</button>
  </form>
  <p id="feedback" role="status" aria-live="polite"></p>
</main>
<script>
(function(){
  const form=document.getElementById('devLoginForm');
  const feedback=document.getElementById('feedback');
  const button=document.getElementById('loginButton');
  form.addEventListener('submit',async function(event){
    event.preventDefault();
    button.disabled=true;
    feedback.textContent='확인 중...';
    try{
      const password=document.getElementById('password').value;
      const response=await fetch('/dev-access/login',{
        method:'POST',credentials:'same-origin',cache:'no-store',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password})
      });
      const result=await response.json();
      if(!response.ok||!result.ok)throw new Error(result.error||'login_failed');
      document.getElementById('password').value='';
      location.replace('/');
    }catch(error){
      const messages={
        invalid_password:'비밀번호가 일치하지 않아.',
        too_many_attempts:'로그인 시도가 많아. 10분 뒤 다시 시도해 줘.',
        site_password_not_configured:'서버의 관리자 비밀번호 설정을 확인해 줘.'
      };
      feedback.textContent=messages[error.message]||'로그인할 수 없어. 잠시 후 다시 시도해 줘.';
    }finally{button.disabled=false}
  });
})();
</script>
</body>
</html>
